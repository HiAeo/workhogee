# WorkHogee AI 获客伙计 - Docker Compose 配置
# 用于本地开发和生产部署

version: '3.8'

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:15-alpine
    container_name: workhogee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workhogee
      POSTGRES_USER: workhogee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workhogee_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhogee -d workhogee"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== WorkHogee 后端应用 =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workhogee-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # 数据库配置
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgresql://workhogee:${POSTGRES_PASSWORD:-workhogee_password}@postgres:5432/workhogee
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      # LLM 配置
      LLM_PROVIDER: deepseek
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  app_data:
