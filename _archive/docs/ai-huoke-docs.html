// 页面顺序（用于翻页）
const pageOrder = [
  'overview', 'quickstart', 'install',
  'knowledge', 'content', 'channels', 'reception', 'nurture', 'analytics',
  'channel-website', 'channel-email', 'channel-xhs', 'channel-douyin',
  'admin-dashboard', 'admin-leads', 'admin-chat', 'admin-reports',
  'api', 'team',
  'faq', 'contact'
];

// 渲染文档页面
function renderDoc(pageId) {
  const doc = docData[pageId];
  if (!doc) {
    document.getElementById('docContent').innerHTML = '<p>文档不存在</p>';
    return;
  }

  const breadcrumbHtml = doc.breadcrumb.map((item, i) =>
    i === doc.breadcrumb.length - 1 ? item : '<a href="#">' + item + '</a>'
  ).join('<span>/</span>');

  // 翻页
  const currentIndex = pageOrder.indexOf(pageId);
  const prevPage = currentIndex > 0 ? pageOrder[currentIndex - 1] : null;
  const nextPage = currentIndex < pageOrder.length - 1 ? pageOrder[currentIndex + 1] : null;

  let pagerHtml = '<div class="doc-pager">';
  if (prevPage && docData[prevPage]) {
    pagerHtml += '<a href="#" onclick="switchDoc(\'' + prevPage + '\');return false;">' +
      '<span class="doc-pager-label">上一页</span>' +
      '<span class="doc-pager-title">' + docData[prevPage].title + '</span></a>';
  }
  if (nextPage && docData[nextPage]) {
    pagerHtml += '<a href="#" class="doc-pager-next" onclick="switchDoc(\'' + nextPage + '\');return false;">' +
      '<span class="doc-pager-label">下一页</span>' +
      '<span class="doc-pager-title">' + docData[nextPage].title + '</span></a>';
  }
  pagerHtml += '</div>';

  document.getElementById('docContent').innerHTML =
    '<div class="doc-page active">' +
    '<div class="doc-breadcrumb">' + breadcrumbHtml + '</div>' +
    '<h1 class="doc-title">' + doc.title + '</h1>' +
    '<p class="doc-subtitle">' + doc.subtitle + '</p>' +
    '<div class="doc-meta">' + doc.meta + '</div>' +
    doc.content +
    pagerHtml +
    '</div>';

  // 更新侧边栏激活状态
  document.querySelectorAll('.doc-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.page === pageId);
  });

  // 滚动到顶部
  document.querySelector('.doc-content').scrollTop = 0;
  window.scrollTo(0, 0);
}

// 切换文档
function switchDoc(pageId) {
  renderDoc(pageId);
  history.replaceState(null, '', '#' + pageId);
}

// 搜索过滤
function filterDocs(keyword) {
  keyword = keyword.toLowerCase().trim();
  document.querySelectorAll('.doc-item').forEach(function(item) {
    const text = item.textContent.toLowerCase();
    const pageId = item.dataset.page;
    const doc = docData[pageId];
    const matches = !keyword ||
      text.indexOf(keyword) > -1 ||
      (doc && (doc.title.toLowerCase().indexOf(keyword) > -1 ||
               doc.subtitle.toLowerCase().indexOf(keyword) > -1));
    item.style.display = matches ? '' : 'none';
  });
}

// 侧边栏点击
document.querySelectorAll('.doc-item').forEach(function(item) {
  item.addEventListener('click', function() {
    switchDoc(this.dataset.page);
  });
});

// 初始化：从URL hash读取页面
const initialPage = location.hash.replace('#', '') || 'overview';
renderDoc(initialPage);
</script>
