<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片动态化工具 · WorkHogee 活儿伙计</title>
<style>
:root {
  --orange: #ea580c;
  --orange-light: #fb923c;
  --ink: #1c1917;
  --ink-soft: #57534e;
  --ink-muted: #a8a29e;
  --paper: #faf8f4;
  --sand: #f5f0e8;
  --line: #e7e5e4;
  --white: #ffffff;
  --green: #16a34a;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(28,25,23,0.08);
  --shadow-md: 0 4px 16px rgba(28,25,23,0.1);
  --shadow-lg: 0 12px 40px rgba(28,25,23,0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; }
a { text-decoration: none; color: inherit; }

/* 导航 */
.nav { position: sticky; top: 0; z-index: 100; background: rgba(250,248,244,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 32px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo svg { height: 26px; width: auto; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a { font-size: 14px; color: var(--ink-soft); font-weight: 500; transition: color 0.2s; }
.nav-links a:hover { color: var(--orange); }
.nav-product-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); font-weight: 500; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
.nav-product-link:hover { color: var(--orange); background: rgba(234,88,12,0.06); }
.nav-product-link.active { background: var(--orange); color: var(--white) !important; font-weight: 600; box-shadow: 0 4px 12px rgba(234,88,12,0.25); }
.nav-product-link svg { width: 14px; height: 14px; }
.nav-cta { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--white) !important; padding: 9px 20px; border-radius: 10px; font-size: 13px !important; font-weight: 600 !important; transition: all 0.25s; }
.nav-cta:hover { background: var(--orange); transform: translateY(-1px); }

/* 主区域 */
.tool-main { max-width: 1200px; margin: 0 auto; padding: 40px 32px 60px; }
.tool-header { text-align: center; margin-bottom: 36px; }
.tool-header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
.tool-header h1 span { color: var(--orange); }
.tool-header p { color: var(--ink-soft); font-size: 16px; }

.tool-layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }

/* 左侧控制面板 */
.control-panel { background: var(--white); border-radius: var(--radius-lg); padding: 28px; border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: sticky; top: 88px; }
.panel-section { margin-bottom: 28px; }
.panel-section:last-child { margin-bottom: 0; }
.panel-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.panel-title::before { content: ''; width: 3px; height: 16px; background: var(--orange); border-radius: 2px; }

/* 上传区 */
.upload-zone { border: 2px dashed var(--line); border-radius: var(--radius-md); padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.25s; background: var(--paper); }
.upload-zone:hover { border-color: var(--orange); background: rgba(234,88,12,0.03); }
.upload-zone.dragover { border-color: var(--orange); background: rgba(234,88,12,0.06); }
.upload-zone svg { width: 40px; height: 40px; color: var(--ink-muted); margin-bottom: 12px; }
.upload-zone h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.upload-zone p { font-size: 12px; color: var(--ink-muted); }
.upload-zone input { display: none; }
.upload-preview { margin-top: 14px; border-radius: var(--radius-sm); overflow: hidden; display: none; }
.upload-preview img { width: 100%; display: block; }
.upload-preview.show { display: block; }

/* 效果选择 */
.effect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.effect-card { border: 2px solid var(--line); border-radius: var(--radius-md); padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--white); }
.effect-card:hover { border-color: var(--orange-light); }
.effect-card.active { border-color: var(--orange); background: rgba(234,88,12,0.05); }
.effect-card svg { width: 28px; height: 28px; color: var(--ink-soft); margin-bottom: 8px; }
.effect-card.active svg { color: var(--orange); }
.effect-card span { font-size: 12px; font-weight: 600; display: block; }

/* 参数滑块 */
.param-row { margin-bottom: 16px; }
.param-row:last-child { margin-bottom: 0; }
.param-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
.param-label span:last-child { color: var(--orange); font-weight: 600; }
.param-row input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; background: var(--line); border-radius: 3px; outline: none; }
.param-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--orange); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(234,88,12,0.3); }

/* 导出按钮 */
.export-btn { width: 100%; padding: 14px; background: var(--orange); color: var(--white); border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.export-btn:hover:not(:disabled) { background: var(--orange-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(234,88,12,0.3); }
.export-btn:disabled { background: var(--ink-muted); cursor: not-allowed; }
.export-btn.recording { background: var(--ink); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.export-btn svg { width: 18px; height: 18px; }

/* 右侧预览区 */
.preview-area { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--line); box-shadow: var(--shadow-sm); overflow: hidden; }
.preview-header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.preview-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.preview-header h3 .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
.preview-info { font-size: 12px; color: var(--ink-muted); }
.preview-canvas-wrap { background: var(--ink); display: flex; align-items: center; justify-content: center; min-height: 480px; position: relative; }
.preview-canvas-wrap canvas { max-width: 100%; max-height: 560px; display: block; }
.preview-placeholder { text-align: center; color: var(--ink-muted); padding: 80px 20px; }
.preview-placeholder svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }
.preview-placeholder p { font-size: 14px; }
.recording-badge { position: absolute; top: 16px; right: 16px; background: rgba(239,68,68,0.9); color: white; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; display: none; align-items: center; gap: 6px; }
.recording-badge.show { display: flex; }
.recording-badge .rec-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }

/* 页脚 */
.footer { background: var(--ink); color: var(--ink-muted); padding: 48px 0 32px; margin-top: 60px; }
.footer-inner { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.footer-logo svg { height: 28px; margin-bottom: 16px; }
.footer-bottom { text-align: center; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; }

/* 响应式 */
@media (max-width: 900px) {
  .tool-layout { grid-template-columns: 1fr; }
  .control-panel { position: static; }
  .nav-links { display: none; }
}
</style>

const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const uploadPreview = document.getElementById('uploadPreview');
const previewImg = document.getElementById('previewImg');
const exportBtn = document.getElementById('exportBtn');
const previewInfo = document.getElementById('previewInfo');
const recordingBadge = document.getElementById('recordingBadge');

// 参数
const intensitySlider = document.getElementById('intensity');
const speedSlider = document.getElementById('speed');
const durationSlider = document.getElementById('duration');
const intensityVal = document.getElementById('intensityVal');
const speedVal = document.getElementById('speedVal');
const durationVal = document.getElementById('durationVal');

// 上传处理
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      previewImg.src = e.target.result;
      uploadPreview.classList.add('show');
      placeholder.style.display = 'none';
      canvas.style.display = 'block';
      exportBtn.disabled = false;
      previewInfo.textContent = `${img.width}×${img.height} · ${currentEffect === 'steam' ? '热气蒸汽' : currentEffect === 'light' ? '光影流动' : currentEffect === 'kenburns' ? '缓慢推拉' : '粒子飘散'}`;
      // 设置canvas尺寸为图片尺寸（最大800）
      const maxSize = 800;
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        const ratio = Math.min(maxSize / w, maxSize / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      canvas.width = w;
      canvas.height = h;
      initParticles();
      startAnimation();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 效果选择
function selectEffect(effect, el) {
  document.querySelectorAll('.effect-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentEffect = effect;
  if (currentImage) {
    previewInfo.textContent = `${canvas.width}×${canvas.height} · ${el.querySelector('span').textContent}`;
    initParticles();
  }
}

// 参数滑块
intensitySlider.addEventListener('input', () => { intensityVal.textContent = intensitySlider.value + '%'; });
speedSlider.addEventListener('input', () => { speedVal.textContent = (speedSlider.value / 100).toFixed(1) + 'x'; });
durationSlider.addEventListener('input', () => { durationVal.textContent = durationSlider.value + '秒'; });

// 粒子初始化
function initParticles() {
  particles = [];
  const count = Math.floor(20 * (intensitySlider.value / 100));
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: canvas.height + Math.random() * 100,
      size: 3 + Math.random() * 8,
      speed: 0.5 + Math.random() * 1.5,
      opacity: 0.3 + Math.random() * 0.5,
      drift: (Math.random() - 0.5) * 0.5
    });
  }
}

// 动画主循环
function startAnimation() {
  if (animId) cancelAnimationFrame(animId);
  startTime = performance.now();
  animate();
}

function animate() {
  const now = performance.now();
  const t = (now - startTime) / 1000 * (speedSlider.value / 100);
  const intensity = intensitySlider.value / 100;

  // 清空
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentEffect === 'kenburns') {
    // Ken Burns效果：缓慢放大+平移
    const scale = 1 + 0.15 * intensity * (t % 5) / 5;
    const offsetX = Math.sin(t * 0.3) * 20 * intensity;
    const offsetY = Math.cos(t * 0.2) * 15 * intensity;
    ctx.save();
    ctx.translate(canvas.width / 2 + offsetX, canvas.height / 2 + offsetY);
    ctx.scale(scale, scale);
    ctx.drawImage(currentImage, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
    ctx.restore();
  } else {
    // 其他效果先画原图
    ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
  }

  if (currentEffect === 'steam') {
    // 热气蒸汽
    particles.forEach((p, i) => {
      p.y -= p.speed * (speedSlider.value / 100);
      p.x += p.drift;
      p.size += 0.05;
      p.opacity -= 0.003;
      if (p.y < -50 || p.opacity <= 0) {
        p.y = canvas.height + Math.random() * 50;
        p.x = canvas.width * 0.3 + Math.random() * canvas.width * 0.4;
        p.size = 3 + Math.random() * 8;
        p.opacity = 0.3 + Math.random() * 0.5;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity * intensity})`;
      ctx.fill();
    });
  } else if (currentEffect === 'light') {
    // 光影流动
    const sweepX = ((t * 150) % (canvas.width * 2)) - canvas.width * 0.5;
    const gradient = ctx.createLinearGradient(sweepX - 100, 0, sweepX + 100, canvas.height);
    gradient.addColorStop(0, 'rgba(255,248,220,0)');
    gradient.addColorStop(0.5, `rgba(255,248,220,${0.4 * intensity})`);
    gradient.addColorStop(1, 'rgba(255,248,220,0)');
    ctx.save();
    ctx.rotate(-0.2);
    ctx.fillStyle = gradient;
    ctx.fillRect(-100, -100, canvas.width + 200, canvas.height + 200);
    ctx.restore();
  } else if (currentEffect === 'particle') {
    // 粒子飘散（金色光斑）
    particles.forEach((p, i) => {
      p.y -= p.speed * 0.8 * (speedSlider.value / 100);
      p.x += p.drift * 2;
      p.opacity = 0.4 + Math.sin(t * 2 + i) * 0.3;
      if (p.y < -20) {
        p.y = canvas.height + 20;
        p.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,215,100,${p.opacity * intensity})`;
      ctx.fill();
      // 光晕
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,215,100,${p.opacity * 0.2 * intensity})`;
      ctx.fill();
    });
  }

  animId = requestAnimationFrame(animate);
}

// 导出视频
async function exportVideo() {
  if (!currentImage) return;
  const duration = durationSlider.value;
  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  const chunks = [];

  exportBtn.disabled = true;
  exportBtn.classList.add('recording');
  exportBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>录制中...';
  recordingBadge.classList.add('show');

  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `workhogee-dynamic-${currentEffect}-${Date.now()}.webm`;
    a.click();
    URL.revokeObjectURL(url);
    exportBtn.disabled = false;
    exportBtn.classList.remove('recording');
    exportBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>生成并下载视频';
    recordingBadge.classList.remove('show');
  };

  recorder.start();
  setTimeout(() => recorder.stop(), duration * 1000);
}
</script>
</body>
