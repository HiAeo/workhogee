<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阿文·文案工坊 自验 Harness</title>
<style>
  body{margin:0;background:#0f1115;color:#e5e7eb;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .bar{position:sticky;top:0;background:#161a20;border-bottom:1px solid #262d3a;padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:10}
  .bar b{color:#f97316}
  .bar button{background:#f97316;color:#fff;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px}
  .bar .muted{color:#8b93a3;font-size:12px}
</style>
</head>
<body>
<div class="bar">
  <b>阿文 Harness</b>
  <span class="muted">（自包含真机验证页：下方两个真实商品场景）</span>
  <button onclick="__run(0)">场景1·中文美妆(滴管精华瓶)</button>
  <button onclick="__run(1)">场景2·英文3C(话务耳机)</button>
  <span class="muted" id="cost"></span>
</div>
<script src="awen-studio.js"></script>
<script>
/* 由构建脚本注入：window.__AWEN_BUNDLES = [ {..}, {..} ] */
window.__AWEN_BUNDLES = window.__AWEN_BUNDLES || [];
function __run(i){
  var b = window.__AWEN_BUNDLES[i]; if(!b) return;
  window.openAwenStudio({
    product: { image: b.image, brand: b.mctx_summary.brand, category: b.mctx_summary.category,
               language: b.mctx_summary.language, bg_brands: b.mctx_summary.bg_brands },
    factsBrief: b.factsBrief,
    prefill: b.prefill, prefillValues: b.prefillValues,
    results: b.result.results,
    costTotal: b.result.cost_total_cny
  });
}
if (window.__AWEN_BUNDLES.length) __run(0);
</script>
</body>
</html>
