/* ---- 企业资料库（IndexedDB 持久化 + 文本提取） ---- */
var KB_DB='hogee-kb',KB_STORE='docs';
function kbOpenDB(){return new Promise(function(res,rej){try{var r=indexedDB.open(KB_DB,1);r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains(KB_STORE))db.createObjectStore(KB_STORE,{keyPath:'id'});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function kbTx(mode,fn){return kbOpenDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(KB_STORE,mode);fn(tx.objectStore(KB_STORE));tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function kbPut(rec){return kbTx('readwrite',function(st){st.put(rec);});}
function kbDel(id){return kbTx('readwrite',function(st){st.delete(id);});}
function kbAll(){return kbOpenDB().then(function(db){return new Promise(function(res,rej){var rq=db.transaction(KB_STORE).objectStore(KB_STORE).getAll();rq.onsuccess=function(){res((rq.result||[]).sort(function(a,b){return b.ts-a.ts;}));};rq.onerror=function(){rej(rq.error);};});}).catch(function(){return [];});}
function kbExt(name){var m=/\.([a-z0-9]+)$/i.exec(name||'');return m?m[1].toLowerCase():'';}
function kbTextExt(ext){return ['txt','md','markdown','csv','json','log','text'].indexOf(ext)>=0;}
function kbFmtSize(n){n=n||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function kbIcon(ext){var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';if(/jpg|jpeg|png|webp|gif|bmp|svg/.test(ext))return s+'<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.7"/><path d="m21 15-4.5-4.5L7 21"/></svg>';if(/mp4|mov|avi|mkv|webm/.test(ext))return s+'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m10 9 5 3-5 3Z"/></svg>';if(/xls|xlsx|csv/.test(ext))return s+'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>';if(/ppt|pptx/.test(ext))return s+'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v3M8 20h8"/></svg>';return s+'<path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M8 13h8M8 17h6"/></svg>';}
function kbTrash(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';}
function renderKnowledge(){

 var up='<div class="kb-up" id="kbUp" role="button"><span class="ku-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span><b>点击上传企业资料</b><span>支持 PDF / Word / Excel / PPT / TXT / Markdown / CSV / 图片 / 视频，可一次选多个</span></div>';
 return note+up+'<div class="kb-list" id="kbList"><div class="kb-empty">正在载入资料库…</div></div>';

function syncKbText(docs){
 try{
  var parts=docs.filter(function(d){return d.text;}).map(function(d){return d.text;});
  var t=parts.join(String.fromCharCode(10,10)).slice(0,8000);
  if(t)localStorage.setItem('hogee_kb_text',t);else localStorage.removeItem('hogee_kb_text');
 }catch(e){}
}
function getKnowledgeContext(){try{return localStorage.getItem('hogee_kb_text')||'';}catch(e){return '';}}
function bindKnowledge(){
 var body=document.getElementById('labBody');if(!body)return;
 function paint(){kbAll().then(function(docs){syncKbText(docs);var box=document.getElementById('kbList');if(!box)return;if(!docs.length){box.innerHTML='<div class="kb-empty">还没有资料，上传后会显示在这里</div>';return;}
  box.innerHTML=docs.map(function(d){var on=kbTextExt(d.ext);return '<div class="kb-item"><span class="ki-ic">'+kbIcon(d.ext)+'</span><div class="ki-main"><div class="ki-name">'+esc(d.name)+'</div><div class="ki-sub">'+kbFmtSize(d.size)+' · '+(d.ext||'file').toUpperCase()+' · '+fmtWTime(d.ts)+'</div></div><span class="ki-state '+(on?'on':'wait')+'">'+(on?'已用于文案参考':'已收录 · 解析即将开放')+'</span><button class="kb-del" type="button" data-kbdel="'+d.id+'" aria-label="删除">'+kbTrash()+'</button></div>';}).join('');}).catch(function(){var box=document.getElementById('kbList');if(box)box.innerHTML='<div class="kb-empty">当前浏览器无法启用本地资料库</div>';});}
 paint();
 if(body._kbbound)return;body._kbbound=1;
 var inp=document.createElement('input');inp.id='kbFile';inp.type='file';inp.multiple=true;inp.style.display='none';
 inp.accept='.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.markdown,.csv,.json,.log,.jpg,.jpeg,.png,.webp,.gif,.mp4,.mov';document.body.appendChild(inp);
 body.addEventListener('click',function(e){var up=e.target.closest('#kbUp');if(up){inp.click();return;}var del=e.target.closest('[data-kbdel]');if(del){kbDel(del.getAttribute('data-kbdel')).then(paint).catch(paint);}});
 inp.addEventListener('change',function(){
  var fs=Array.prototype.slice.call(inp.files||[]);if(!fs.length)return;
  fs.forEach(function(f){var ext=kbExt(f.name),isText=kbTextExt(ext);var rec={id:'kb'+Date.now()+Math.random().toString(36).slice(2,7),name:f.name,size:f.size,ext:ext||'file',mime:f.type||'',ts:Date.now(),text:'',blob:f};
   var fin=function(){kbPut(rec).then(paint).catch(paint);};
   if(isText){var rd=new FileReader();rd.onload=function(){rec.text=String(rd.result||'').slice(0,40000);fin();};rd.onerror=fin;rd.readAsText(f);}else fin();
  });
  inp.value='';if(window.toast)toast('资料已收录'+(fs.length>1?'（'+fs.length+' 个文件）':''));
 });
}

/* 内测水印：右下角半透明深色圆角框 + 白色 WorkHogee 出图字样 */
function addWatermark(dataUrl){
 return new Promise(function(resolve){
  if(!dataUrl||typeof dataUrl!=='string'){resolve(dataUrl);return;}
  if(SVC.cap&&SVC.cap.aiLabel===false){resolve(dataUrl);return;}
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
   try{
    var c=document.createElement('canvas');
    c.width=img.width;c.height=img.height;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0);
    var pad=Math.round(img.width*0.012);
    var fs=Math.round(img.width*0.026);
    var bw=fs*9,bh=fs+pad*2;
    var bx=img.width-bw-pad*1.5;
    var by=img.height-bh-pad*1.5;
    ctx.fillStyle='rgba(0,0,0,0.55)';
    var r=fs*0.28;
    ctx.beginPath();
    ctx.moveTo(bx+r,by);
    ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,r);
    ctx.arcTo(bx,by+bh,bx,by,r);
    ctx.arcTo(bx,by,bx+bw,by,r);
    ctx.closePath();ctx.fill();
    ctx.font='600 '+fs+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText('WorkHogee 出图',bx+pad*1.4,by+bh/2);
    resolve(c.toDataURL('image/jpeg',0.92));
   }catch(e){resolve(dataUrl);}
  };
  img.onerror=function(){resolve(dataUrl);};
  img.src=dataUrl;
 });
}

function callIdentify(dataUrl){
 return fetch(API+'/identify',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({image:dataUrl})})
  .then(function(r){return r.json();})
  .then(function(j){
   var f=(j&&j.identify&&j.identify.available)?j.identify.fields:{};
   // 品牌模糊纠错：AI说"丰田汽车""TOYOTA丰田"等，纠正到 CAR_DB 标准名
   if(f.brand&&CAR_DB.length){
    var bf=f.brand.replace(/[汽车|有限公司|中国|合资|进口|TOYOTA|toyota|HONDA|honda]/g,'').trim();
    var hit=CAR_DB.filter(function(d){return d.n===bf||d.n.indexOf(bf)>=0||bf.indexOf(d.n)>=0;})[0];
    if(hit)f.brand=hit.n;
   }
   return f;
  })
  .catch(function(){return {};});
}
function identifySummary(f){
 if(!f||!f.kind)return '';
 if(f.kind==='usedcar'){
  var parts=[];
  if(f.color)parts.push(f.color);
  if(f.brand)parts.push(f.brand);
  if(f.series)parts.push(f.series);
  if(f.year)parts.push(f.year);
  return parts.join(' ');
 }else{
  return f.name||f.category||f.brand||'';
 }
}

function buildJobs(){

 if(state.extra){var ce=cleanBanned(state.extra.slice(0,120));var ex=ce.text.trim();if(ex)extra='；补充的画面要求（仅用于光线、色调、构图与氛围；画面中绝不出现任何文字、字母、数字、价格、标语、招牌或水印，商品本身原有标识除外）：'+ex;}
 var carAnchor='';
 if(used&&state.product&&state.product.brand){

 }
 state.outputs.forEach(function(k){

    try{

     var wmUrl=await addWatermark(url);
     var __res={url:wmUrl,label:jobs[i].label,k:jobs[i].k};state.results.push(__res);tosSyncResult(__res);rememberWork('img',{url:wmUrl,label:jobs[i].label});

     if(e&&typeof e.code==='string'&&e.code.indexOf('member')===0){toast(e.message,'err');return;}

    }
   }
   if(token===state.genToken)finishGenerate();
  })();
 };

}

window.HogeeTyper=(function(){
 var inp=document.getElementById('composerInput'),si=0,ci=0,del=false,timer=null,key='host';
 function arr(){return CMP_PH[key]||CMP_PH.host;}
 function focused(){return document.activeElement===inp;}
 function tick(){
   if(!inp)return;
   if(focused()||inp.value){if(!inp.value)inp.placeholder=arr()[si%arr().length];return;}
   var a=arr(),s=a[si%a.length];
   if(!del){ci++;inp.placeholder=s.slice(0,ci);if(ci>=s.length){del=true;timer=setTimeout(tick,1700);return;}}
   else{ci--;inp.placeholder=s.slice(0,ci);if(ci<=0){del=false;si=(si+1)%a.length;timer=setTimeout(tick,340);return;}}
   timer=setTimeout(tick,del?26:54);
 }
 function start(){if(timer)clearTimeout(timer);ci=0;del=false;timer=setTimeout(tick,480);}
 function setTab(k){k=CMP_PH[k]?k:'host';var same=(k===key);key=k;si=0;
   if(!inp)return;
   if(focused()||inp.value){inp.placeholder=(CMP_PH[k]||CMP_PH.host)[0];}
   else if(!same||!timer){inp.placeholder='';start();}}
 if(inp){
  inp.addEventListener('blur',function(){if(!inp.value)start();});
  inp.addEventListener('focus',function(){if(!inp.value){if(timer)clearTimeout(timer);timer=null;inp.placeholder=arr()[si%arr().length];}});
 }
 return {setTab:setTab,start:start};
})();

var DYN_EDGE=440;
function dynTick(){return new Promise(function(r){setTimeout(r,0);});}
function dynRatio(){var s=SIZES.filter(function(x){return state.sizes.has(x.k);})[0]||SIZES[0];return s.w/s.h;}
function dynSize(ratio,edge){return ratio>=1?{w:edge,h:Math.max(8,Math.round(edge/ratio))}:{h:edge,w:Math.max(8,Math.round(edge*ratio))};}
function dynPaint(x,img,w,h,scale,px,py){x.fillStyle='#fff';x.fillRect(0,0,w,h);var ir=img.width/img.height,tr=w/h,bw,bh;if(ir>tr){bh=h;bw=h*ir;}else{bw=w;bh=w/ir;}bw*=scale;bh*=scale;var ox=(bw-w)/2,oy=(bh-h)/2;x.drawImage(img,(w-bw)/2+px*ox,(h-bh)/2+py*oy,bw,bh);}
function dynFrame(img,w,h,scale,px,py,delay,newPal){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');dynPaint(x,img,w,h,scale,px,py);return {data:x.getImageData(0,0,w,h).data,delay:delay,newPalette:!!newPal};}
function dynEase(t){return t*t*(3-2*t);}
async function dynBuildGif(frames,w,h,onProg){var gif=HGif.GIFEncoder(),palette=null;for(var i=0;i<frames.length;i++){if(frames[i].newPalette||!palette){palette=HGif.quantize(frames[i].data,256,{format:'rgb444'});}var idx=HGif.applyPalette(frames[i].data,palette,'rgb444');gif.writeFrame(idx,w,h,{palette:palette,delay:frames[i].delay,dispose:2});if(onProg)onProg(i+1,frames.length);await dynTick();}gif.finish();var b=gif.bytes();return new Blob([b],{type:'image/gif'});}
async function dynKen(img,ratio,setP){var z=dynSize(ratio,DYN_EDGE),N=22,fr=[];for(var i=0;i<N;i++){var ph=i/(N-1),k=ph<.5?ph*2:(1-ph)*2,e=dynEase(k);fr.push(dynFrame(img,z.w,z.h,1+0.10*e,-0.7+1.4*e,-0.5+1.0*e,70,i===0));if(i%4===0)setP(i+1,N);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:N};}
async function dynShow(imgs,ratio,setP){var z=dynSize(ratio,DYN_EDGE),fr=[],per=7,n=0;for(var g=0;g<imgs.length;g++){for(var f=0;f<per;f++){var e=f/(per-1);fr.push(dynFrame(imgs[g],z.w,z.h,1+0.06*e,0,0,110,f===0));n++;setP(n,imgs.length*per);}}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:n};}
async function dynSpin(imgs,setP){var z=dynSize(1,DYN_EDGE),fr=[];for(var g=0;g<imgs.length;g++){for(var f=0;f<2;f++){fr.push(dynFrame(imgs[g],z.w,z.h,1.08,0,0,95,f===0));}setP(g+1,imgs.length);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:fr.length};}
function dynGrid9(img){var S=1200,c=document.createElement('canvas');c.width=S;c.height=S;var x=c.getContext('2d');dynPaint(x,img,S,S,1.06,0,0);var cell=S/3,out=[];for(var r=0;r<3;r++)for(var cc=0;cc<3;cc++){var t=document.createElement('canvas');t.width=cell;t.height=cell;var tx=t.getContext('2d');tx.drawImage(c,cc*cell,r*cell,cell,cell,0,0,cell,cell);out.push(t.toDataURL('image/jpeg',.92));}return out;}
function dynKb(n){return n>1048576?(n/1048576).toFixed(1)+'MB':Math.round(n/1024)+'KB';}

function drawCoverKB(x,img,W,H,s,ox,oy,alpha){

function composeVideo(sb,imgs,onProg){
 var dim=VIDEO_RATIOS[sb.ratio]||VIDEO_RATIOS['9:16'],W=dim.w,H=dim.h;
 var canvas=document.getElementById('vidCanvasEl');
 if(!canvas)return Promise.reject(new Error('视频画布未就绪'));
 canvas.width=W;canvas.height=H;var x=canvas.getContext('2d');
 var shots=sb.shots||[],INTRO=1.3,OUTRO=1.8,TRANS=0.28;
 var shotsDur=shots.reduce(function(a,s){return a+(+s.duration||3);},0);
 var total=INTRO+shotsDur+OUTRO;
 var mime=pickVideoMime();
 if(!mime)return Promise.reject(new Error('当前浏览器不支持本地视频录制，请用最新版 Chrome / Edge / Safari'));
 function frame(t){
  x.fillStyle='#0c0b09';x.fillRect(0,0,W,H);
  if(t<INTRO){drawIntro(x,W,H,t/INTRO,sb.title);return;}
  if(t>=INTRO+shotsDur){drawOutro(x,W,H,(t-INTRO-shotsDur)/OUTRO);return;}
  var lt=t-INTRO,cum=0,shot=shots[shots.length-1],idx=shots.length-1,local=0,dur=3;
  for(var i=0;i<shots.length;i++){var d=+shots[i].duration||3;cum+=d;if(lt<cum){shot=shots[i];idx=i;local=lt-(cum-d);dur=d;break;}}
  var p=Math.max(0,Math.min(1,local/dur));
  var kb=kbFor(p,shot.motion);
  var fade=Math.min(1,local/TRANS);
  if(idx===shots.length-1&&local>dur-0.32)fade*=Math.max(0,(dur-local)/0.32);
  var img=imgs[idx%imgs.length];
  if(img)drawCoverKB(x,img,W,H,kb.s,kb.ox,kb.oy,Math.max(0,Math.min(1,fade)));
  if(shot.caption&&local>0.34&&local<dur-0.16)drawCaption(x,W,H,shot.caption,Math.min(1,(local-0.34)/0.3));
  drawCorner(x,W,H);
 }
 var stream=canvas.captureStream(30);
 var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
 var chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
 return new Promise(function(res,rej){
  rec.onerror=function(){rej(new Error('录制失败'));};
  rec.onstop=function(){res({blob:new Blob(chunks,{type:mime.split(';')[0]}),w:W,h:H,dur:total});};
  var start=null,raf=0,stopped=false;
  function loop(ts){
   if(!start)start=ts;var t=(ts-start)/1000;
   if(t>=total){frame(total);onProg&&onProg(1);if(!stopped){stopped=true;setTimeout(function(){try{rec.stop();}catch(e){}},150);}return;}
   frame(t);onProg&&onProg(Math.min(0.999,t/total));raf=requestAnimationFrame(loop);
  }
  rec.onstart=function(){raf=requestAnimationFrame(loop);};
  setTimeout(function(){try{rec.start(200);}catch(e){rej(e);}},60);
 });
}

function exportRatio(url,w,h,mode,fmt){
 return loadImage(url).then(function(img){
  var base=state.quality==='hd'?2048:1600,cw,ch;
  if(w>=h){cw=base;ch=Math.round(base*h/w);}else{ch=base;cw=Math.round(base*w/h);}

  x.fillStyle='#fff';x.fillRect(0,0,cw,ch);

  if(mode==='cover'){var sw,sh,sx,sy;if(ir>tr){sh=img.height;sw=img.height*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=img.width/tr;sx=0;sy=(img.height-sh)/2;}x.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);}

async function doPublish(){
 if(window.HogeeMember){try{await HogeeMember.requireAuth();}catch(e){return;}}
 var title=($('#pubTitle').value||'').trim();if(!title){toast('先填一下画册标题','err');return;}
 var points=$('#pubPoints').value.split('\n').map(function(x){return x.trim();}).filter(Boolean).slice(0,10);
 var phone=$('#pubPhone')?$('#pubPhone').value.trim():'';var wechat=$('#pubWechat')?$('#pubWechat').value.trim():'';var source=$('#pubSource').value;
 var btn=document.querySelector('[data-act="doPublish"]');if(btn){btn.disabled=true;btn.textContent='正在生成…';}
 var stop=botTyping('afa');
 try{
  var imgs=await Promise.all(state.results.slice(0,8).map(function(r){return compressForShowcase(r.url,1280,.82);}));
  var assets=imgs.map(function(u,i){return {asset_id:'a'+(i+1),kind:i===0?'main':'detail',url:u};});
  var params={};
  if(state.identity.type==='usedcar'&&state.product){var p=state.product;if(p.brand)params['品牌']=p.brand;if(p.series)params['车系']=p.series;if(p.year)params['年款']=p.year;if(p.energy&&p.energy!=='燃油')params['能源']=p.energy;if(p.gear)params['变速箱']=p.gear;}
  else if(state.identity.cat)params['品类']=state.identity.cat;
  var sc=await authPost('/showcases',{title:title,assets:assets,copy:{title:title,selling_points:points,params:params},contact:{phone:phone,wechat:wechat,show_call:!!phone}});
  if(!sc.ok)throw new Error((sc.error&&sc.error.message)||'画册生成失败');
  var lk=await authPost('/qr',{target_code:sc.code,source:source,campaign:title.slice(0,50)});
  if(!lk.ok)throw new Error((lk.error&&lk.error.message)||'渠道码生成失败');
  stop();state.showcase={code:sc.code,url:sc.url,short_url:lk.short_url,qr_svg:lk.qr_svg,source:source,title:title};
  setDeliverTab('reach');openDeliver();
  botSay('画册和「'+pubSourceName(source)+'」渠道码都好了，已放进右侧「送达」。链接发出去、二维码贴出去，<b>谁看了、谁留了联系方式</b>，都回到阿果效果中心。','afa');
 }catch(e){stop();if(btn){btn.disabled=false;btn.innerHTML=IC.qr+' 生成画册与二维码';}toast(e.message||'生成失败，稍后再试','err');}
}

function awenFlow(text,tone){
 if(!state.identity){state.identity={type:'general',label:'通用电商',cat:''};saveId();}
 if(text){if(!state.product.name)state.product.name=text.slice(0,24);state.extra=text;}
 if(!state.product.name&&!(identifyFields&&identifyFields.sellingPoints&&identifyFields.sellingPoints.length)){
  botSay('告诉我你卖什么、主打什么卖点（或先传商品图让阿图认货），我就能出一版分渠道文案。','awen');return;
 }
 var sp=(identifyFields&&identifyFields.sellingPoints)||state.product.sellingPoints||[];
 var cat=(identifyFields&&identifyFields.category)||state.product.category||state.identity.cat||'';
 var productName=state.product.name||[identifyFields.brand,identifyFields.name].filter(Boolean).join(' ');
 var stop=botTyping('awen');
 authPost('/copy',{product:productName,identityType:state.identity.type||'general',extra:state.extra||'',sellingPoints:sp,category:cat,tone:tone||'',kbContext:getKnowledgeContext()})
  .then(function(r){
   stop();
   if(r&&r.ok&&r.copy&&r.copy.available&&r.copy.channels){
    var ch=r.copy.channels;
    state.copy.cps={general:ch.general,xhs:ch.xhs,pyq:ch.pyq,tags:(ch.tags||[]).join(' ')};
    state.copy.ready=true;state.copy.channel='general';state.copy.draft='';state.copy._lastCh='';
    state.copy._lastTone=tone||'';rememberWork('copy',{text:(state.copy.cps&&state.copy.cps.general)||''});
    renderTopbar();setDeliverTab('copy');openDeliver();
    var warn=(r.copy.bannedHits&&r.copy.bannedHits.length)?(' 检出绝对化词「'+r.copy.bannedHits.join('、')+'」，发布前点净化。'):'';
    var spHint=sp.length?(' 这次用了图里看出来的 '+sp.length+' 个卖点。'):'';
    botSay('文案已放进右侧「交付物 · 图文」。'+spHint+warn+' 不满意可以点下面按钮再改一版。','awen');
   }else{
    state.copy.cps=buildCopies();state.copy.ready=true;state.copy.channel='general';state.copy.draft='';state.copy._lastCh='';rememberWork('copy',{text:(state.copy.cps&&state.copy.cps.general)||''});
    renderTopbar();setDeliverTab('copy');openDeliver();
    botSay('文案已放进右侧「交付物 · 图文」（规则模板版）。','awen');
   }
  })
  .catch(function(){
   stop();
   state.copy.cps=buildCopies();state.copy.ready=true;state.copy.channel='general';state.copy.draft='';state.copy._lastCh='';rememberWork('copy',{text:(state.copy.cps&&state.copy.cps.general)||''});
   renderTopbar();setDeliverTab('copy');openDeliver();
   botSay('文案已放进右侧「交付物 · 图文」（规则模板版）。','awen');
  });
}

/* 按大模型意图分流 */
function routeByIntent(txt,it){
 var t=it.target,a=it.action;
 /* 切主讲 */
 if(t&&t!==state.activePartner&&(t==='atu'||t==='awen'||t==='afa'||t==='agu')){
  state.activePartner=t;renderPartners();renderTopbar();
 }
 switch(a){
  case 'start_sell':{
   var nm=(it.product||txt).slice(0,24);
   if(!state.identity||state.stage==='welcome'){
    state.identity={type:'general',label:'通用电商',cat:''};saveId();state.bgImage=null;renderTopbar();
   }
   state.product.name=nm;
   botSay((it.reply||'明白了，你做「'+esc(nm)+'」。把商品用手机拍几张传上来，第一张拍清整体，我拿它做主图。'),'atu');
   if(state.stage!=='upload'){renderUploadCard();state.stage='upload';}
   break;
  }
  case 'upload_photos':{
   if(!state.identity){
    state.identity={type:'general',label:'通用电商',cat:''};saveId();state.bgImage=null;renderTopbar();
   }
   if(!$('#uploadCard')){renderUploadCard();state.stage='upload';}
   botSay(it.reply||'好，点左下角「+」把手机拍的图传上来。','atu');
   $('#fileInput').click();
   break;
  }
  case 'write_copy':{
    state.activePartner='awen';renderPartners();renderTopbar();
   awenFlow(txt);
   break;
  }
  case 'deliver':{
   if(state.results.length||state.copy.ready){
    setDeliverTab('reach');openDeliver();
    botSay(it.reply||'素材和文案都备好了，右边选平台：复制文案、打开发布页，最后一下由你本人点发送。','afa');
   }else{
    botSay(it.reply||'先让阿图出图、或让阿文写文案，我才能把素材打包送达各平台。','afa');
   }
   break;
  }
  case 'show_analytics':{
   state.activePartner='agu';renderPartners();renderTopbar();
   botSay(it.reply||'我是阿果，专管效果数据。画册投出去后的浏览、留资、渠道归因都在效果中心。','agu');
   aguCard();
   break;
  }
  case 'choose_skill':{
   openLab('plugin');
   botSay(it.reply||'账号连接和伙计都在这里管理；做什么行业，传图后阿图会自动认出来。','host');
   break;
  }
  case 'extra_note':{
   state.extra=(state.extra?state.extra+'；':'')+txt;
   botSay(it.reply||('记下了：'+esc(txt)+'。出图时按这个来。'),'atu');
   break;
  }
  case 'chat':
  default:{
   botSay(it.reply||'收到。你说，我听着。','host');
   break;
  }
 }
}

/* 规则兜底：API 不可用或低置信度时走老逻辑（userSay 已在新入口做过，这里不重复） */
function sendFreeTextLegacy(txt){

  if(state.results.length||state.copy.ready){setDeliverTab('reach');openDeliver();botSay('素材和文案都备好了，右边选平台：复制文案、打开发布页，最后一下由你本人点发送。','afa');}
  else botSay('先让阿图出图、或让阿文写文案，我才能把素材打包送达各平台。','afa');
  return;
 }
 if(ap==='agu'){botSay('我是阿果，专管效果数据。画册投出去后的浏览、留资、渠道归因都在效果中心。','agu');aguCard();return;}
 /* 默认阿图：按流程阶段分流 */
 if(!state.identity||state.stage==='welcome'){
  state.identity={type:'general',label:'通用电商',cat:''};saveId();state.bgImage=null;renderTopbar();
  state.product.name=txt.slice(0,24);
  botSay('明白了，你做「'+esc(txt)+'」。把商品用手机拍几张传上来，第一张拍清整体，我拿它做主图。','atu');
  renderUploadCard();state.stage='upload';
 }else if(state.stage==='confirm'){
  if(state.identity.type==='usedcar'){var cb=$('#carBrand');if(cb&&!cb.value)cb.value=txt;}
  else{var pn=$('#productName');if(pn&&!pn.value)pn.value=txt;}
  botSay('记下了：'+esc(txt)+'。确认无误就点卡片里的按钮。','atu');
 }else{
  state.extra=(state.extra?state.extra+'；':'')+txt;
  if(state.stage==='upload'&&(!state.images||!state.images.length)){
   botSay('收到：'+esc(txt)+'。点左下角「+」上传商品图片我就能开工；想先写文案，可在左侧伙伴里让阿文接手。','atu');
  }else{
   botSay('收到，'+esc(txt)+'。我会在出图时按这个来。','atu');
  }
 }
}

 else if(act==='fillSell'){var ex=document.getElementById('extraInstr'),v=b.dataset.v,arr=ex?ex.value.split(/[、,，\n]/).map(function(x){return x.trim();}).filter(Boolean):[];if(b.classList.contains('on')){b.classList.remove('on');arr=arr.filter(function(x){return x!==v;});}else{if(arr.indexOf(v)<0)arr.push(v);b.classList.add('on');}if(ex)ex.value=arr.join('、');}
 else if(act==='confirmProduct'){
  var used=state.identity.type==='usedcar';
  if(used){
   var brand=$('#carBrand').value.trim(),series=$('#carSeries').value.trim();
   var year=$('#carYear').value.trim(),trim=$('#carTrim').value.trim();
   var color=$('#carColor')?$('#carColor').value.trim():'';
   var energy=$('#carEnergy')?$('#carEnergy').value:'燃油';
   var gear=$('#carGear')?$('#carGear').value:'';
   state.product={brand:brand,series:series,year:year,trim:trim,color:color,energy:energy,gear:gear,name:[year,brand,series].filter(Boolean).join(' ')};
  }else{
   var nm=$('#productName').value.trim();
   state.product.name=nm;
  }
  state.extra=$('#extraInstr')?$('#extraInstr').value.trim():'';
  state.taskTitle=state.taskTitle||state.product.name||(used?'这台车':'这款商品');
  markTaskProgress();renderTopbar();
  botSay('认下了：<b>'+esc(state.product.name||'这单货')+'</b>。下面挑这单要出哪些图。','atu');
  renderOutputsCard();
 }
 else if(act==='skipIdentify'){
  // 快速路径：不填任何信息，直接进产出选择
  var used2=state.identity.type==='usedcar';
  var f=identifyFields||{};

  state.extra='';

  markTaskProgress();renderTopbar();
  botSay('好，直接出图。下面挑这单要出哪些图。','atu');
  renderOutputsCard();
 }
 else if(act==='showEditIdentify'){
  renderConfirmEdit();
 }
 else if(act==='toggleOutput'){var k=b.dataset.k;if(state.outputs.has(k)){if(state.outputs.size===1){toast('至少保留一种图');return;}state.outputs.delete(k);b.classList.remove('on');}else{state.outputs.add(k);b.classList.add('on');}}
 else if(act==='toScene'){var isUsed=state.identity.type==='usedcar';
  if(isUsed&&state.outputs.has('onsite')&&!state.bgImage)renderBgCard();

  else if(!isUsed&&state.outputs.has('scene'))renderSceneCard();
  else renderSpecCard();}
 else if(act==='pickScene'){state.scene=b.dataset.k;$$('[data-act="pickScene"]').forEach(function(c){c.classList.remove('on');});b.classList.add('on');}
 else if(act==='cancelOnsite'){state.outputs.delete('onsite');toast('已去掉实地展厅版');renderSpecCard();}
 else if(act==='toSpec'){if(state.stage==='bg'&&!state.bgImage){toast('先传一张展厅背景，或取消实地版','err');return;}renderSpecCard();}
 else if(act==='toggleSize'){var sk=b.dataset.k;if(state.sizes.has(sk)){if(state.sizes.size===1){toast('至少保留一个尺寸');return;}state.sizes.delete(sk);b.classList.remove('on');}else{state.sizes.add(sk);b.classList.add('on');}}

 else if(act==='startGen'){var outs=OUTPUTS[state.identity.type==='usedcar'?'usedcar':'general'],summary=[];state.outputs.forEach(function(kk){var o=outs.filter(function(x){return x.k===kk;})[0];summary.push(o?o.t:kk);});

 else if(act==='dlvPreview'){openLightbox(state.results[+b.dataset.i].url);}

 else if(act==='dlvRedo'){redoOne(+b.dataset.i);}

 else if(act==='copyChan'){state.copy.channel=b.dataset.v;var cps0=state.copy.cps||buildCopies();state.copy.draft='';state.copy._lastCh=state.copy.channel;renderDeliver();}
 else if(act==='copyRedo'){var toneMap={'casual':'再口语化一点，像真人说话，不要广告腔','short':'再短一点，朋友圈就3行，别啰嗦','real':'别这么像广告，像个人闲置转让，有点小缺点也没事'};redoCopy(toneMap[b.dataset.t]||b.dataset.t);}

 else if(act==='videoTpl'){state.videoCfg.tpl=b.dataset.v;$$('[data-act="videoTpl"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.videoCfg.tpl);});}

    menu.innerHTML=_mi('profile','账号')+_mi('quota','额度')+'<div class="wb-sep"></div>'+_mi('help','帮助')+_mi('update','更新')+'<div class="wb-sep"></div>'+_mi('switch','切换')+_mi('logout','退出','danger');

  function openModal(html){mask.innerHTML=html;mask.classList.add('open');}

  function modalShell(title,body,foot){

      +'<div class="wb-mb">'+body+'</div>'+(foot?'<div class="wb-mf">'+foot+'</div>':'')+'</div>';

  mask.addEventListener('click',function(e){var b=e.target.closest('[data-am="close"]');if(b)closeModal();});

  function showProfile(){
    var u=user()||{},p=getProfile();
    var industries=['通用电商','二手车','服装服饰','家居家装','餐饮美食','美妆个护','数码家电','本地生活','其他'];
    var opts=industries.map(function(it){return '<option '+(p.industry===it?'selected':'')+'>'+it+'</option>';}).join('');
    var body='<div class="pf-ava-row"><div class="pf-ava" id="pfAva">'+(p.avatar?'<img src="'+p.avatar+'" alt="头像">':esc(initialOf(u)))+'</div><div class="pf-ava-btns"><button type="button" class="pf-up" id="pfAvaUp">更换头像</button><button type="button" id="pfAvaRm">移除头像</button></div></div>'
     +'<div class="wb-field"><label>登录账号（不可修改）</label><input class="wb-ro" readonly value="'+esc(u.account||u.phone||u.email||u.username||'—')+'"></div>'
      +'<div class="wb-field"><label>联系人称呼</label><input id="pfContact" maxlength="20" value="'+esc(p.contactName||u.contactName||'')+'" placeholder="怎么称呼你"></div>'
      +'<div class="wb-field"><label>店铺 / 公司名</label><input id="pfMerchant" maxlength="30" value="'+esc(p.merchantName||u.merchantName||'')+'" placeholder="你的店铺或公司名称"></div>'
      +'<div class="wb-field"><label>主营行业</label><select id="pfIndustry">'+opts+'</select></div>'
      +'<div class="wb-note">内测阶段资料仅保存在本机，用于让伙计更懂你的生意；正式版将同步到账号云端。</div>';
    var foot='<button class="wb-mbtn" data-am="close">取消</button><button class="wb-mbtn p" id="pfSave">保存</button>';
    openModal(modalShell('账号资料',body,foot));
    var avaIn=document.createElement('input');avaIn.type='file';avaIn.accept='image/*';avaIn.style.display='none';mask.appendChild(avaIn);
    avaIn.addEventListener('change',function(){var f=avaIn.files&&avaIn.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){compressAvatar(rd.result,function(d){var el=q('#pfAva',mask);if(el){el.innerHTML='<img src="'+d+'" alt="头像">';el.setAttribute('data-new',d);el.removeAttribute('data-rm');}});};rd.readAsDataURL(f);});
    q('#pfAvaUp',mask).addEventListener('click',function(){avaIn.click();});
    q('#pfAvaRm',mask).addEventListener('click',function(){var el=q('#pfAva',mask);if(el){el.removeAttribute('data-new');el.setAttribute('data-rm','1');el.textContent=esc(initialOf(u));}});
    q('#pfSave',mask).addEventListener('click',function(){
      var prof={contactName:q('#pfContact',mask).value.trim(),merchantName:q('#pfMerchant',mask).value.trim(),industry:q('#pfIndustry',mask).value,avatar:getProfile().avatar||''};
      var ae=q('#pfAva',mask);
      if(ae&&ae.getAttribute('data-new'))prof.avatar=ae.getAttribute('data-new');
      else if(ae&&ae.hasAttribute('data-rm'))prof.avatar='';
      try{localStorage.setItem('hogee_profile',JSON.stringify(prof));}catch(e){}
      closeModal();renderAccount();if(window.toast)toast('资料已保存在本机');
    });
  }
  function showQuota(){
    var u=user()||{};
    var body='<div class="wb-qrow"><span>当前套餐</span><b>'+esc(planLabel(u))+'</b></div>'
      +'<div class="wb-qrow"><span>账号状态</span><b>'+esc(statusLabel(u))+'</b></div>'
      +'<div class="wb-qrow"><span>出图额度</span><b>内测阶段 · 不限量</b></div>'
      +'<div class="wb-qrow"><span>本机累计生成</span><b class="big">'+genCount()+' 张</b></div>'
      +'<div class="wb-note">内测期间注册登录即可使用，不限出图数量。正式版将上线套餐与按量计费，额度与用量以账号云端统计为准；切换设备后本机计数不互通。</div>';
    openModal(modalShell('额度状态',body,'<button class="wb-mbtn p" data-am="close">知道了</button>'));
  }
  function onMenu(k){
    closeMenu();
    if(k==='profile'){showProfile();}
    else if(k==='quota'){showQuota();}
    else if(k==='cloud'){if(window.setDeliverTab)setDeliverTab('all');if(window.openDeliver)openDeliver();if(window.toast)toast('交付物按 图片 / 动态 / 视频 / 图文 / 送达 归档');}
    else if(k==='site'){window.open('https://www.workhogee.com/','_blank','noopener');}
    else if(k==='help'){window.open('mailto:910036590@qq.com?subject=WorkHogee%20%E5%B8%AE%E5%8A%A9%E4%B8%8E%E5%8F%8D%E9%A6%88','_blank');if(window.toast)toast('已为你打开邮件反馈');}
    else if(k==='update'){if(window.toast)toast('当前已是最新版本，网页版会自动更新');}
    else if(k==='switch'){if(M){M.logout();setTimeout(function(){M.open('login');},260);}}
    else if(k==='logout'){if(M){M.logout();if(window.toast)toast('已退出登录');}}
  }

  function renderAccount(){
    if(!M){acct.innerHTML='';return;}
    if(!M.isLoggedIn()){
      acct.innerHTML='<button class="wb-btn wb-btn-p" id="wbReg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>注册</button>'
        +'<button class="wb-btn wb-btn-g" id="wbLogin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>登录</button>';
      var r=q('#wbReg',acct),l=q('#wbLogin',acct);
      if(r)r.addEventListener('click',function(){M.open('register');});
      if(l)l.addEventListener('click',function(){M.open('login');});
      closeMenu();return;
    }
    var u=user();
    acct.innerHTML='<button class="wb-ab" id="wbAb" aria-haspopup="true">'+avatarHtml(u)
      +'<span class="nm">'+esc(dispName(u))+'</span><span class="cv">'+(IC?IC.chevron:'')+'</span></button>';
    q('#wbAb',acct).addEventListener('click',function(e){e.stopPropagation();if(menu.classList.contains('open'))closeMenu();else openMenu();});
  }
  window.HG_renderAccount=renderAccount;
  renderAccount();
  if(M&&M.verify){try{M.verify().then(renderAccount,renderAccount);}catch(e){}}
  document.addEventListener('hogee:auth',renderAccount);
  document.addEventListener('hogee:logout',renderAccount);
})();

window.HG={toast:toast,setActivePartner:setActivePartner,renderPartners:renderPartners,renderTopbar:renderTopbar,setMenuActive:setMenuActive,enterMate:enterMate,startOrder:startOrder,syncSendReady:syncSendReady,refreshHmFeed:function(){if(typeof state!=='undefined'&&state._heroEl)renderHmRail(state._heroEl);}};

/* ================= rework10 交互：下拉 / 语音 / 精选本地上传 ================= */
(function(){
 var HG=window.HG||{};
 function $(s){return document.querySelector(s);}
 /* ---- ④ 通用下拉 ---- */
 function wire(btnId,menuId,onPick){
  var btn=document.getElementById(btnId),menu=document.getElementById(menuId);
  if(!btn||!menu)return;var dd=btn.closest('.cmp-dd');
  if(menu.parentElement!==document.body)document.body.appendChild(menu);
  function closeAll(){menu.classList.remove('open');dd.classList.remove('open');
   document.querySelectorAll('.cmp-menu.open').forEach(function(m){if(m!==menu)m.classList.remove('open');});
   document.querySelectorAll('.cmp-dd.open').forEach(function(x){if(x!==dd)x.classList.remove('open');});}
  function placeCmpMenu(){var r=btn.getBoundingClientRect();menu.style.minWidth=Math.max(r.width,208)+'px';
   menu.style.left=r.left+'px';var h=menu.offsetHeight||260;var top=r.bottom+8;
   if(top+h>window.innerHeight-10)top=Math.max(10,r.top-h-8);menu.style.top=top+'px';}
  btn.addEventListener('click',function(e){e.stopPropagation();
   var willOpen=!menu.classList.contains('open');closeAll();
   if(willOpen){dd.classList.add('open');menu.classList.add('open');placeCmpMenu();}});
  window.addEventListener('resize',closeAll);
  window.addEventListener('scroll',closeAll,true);
  menu.addEventListener('click',function(e){e.stopPropagation();var b=e.target.closest('button');if(!b)return;
   if(b.classList.contains('off')||b.disabled){if(HG.toast)HG.toast('该行业技能即将开放，先用通用电商');return;}
   onPick(b);closeAll();});
  document.addEventListener('click',function(e){if(!dd.contains(e.target)&&!menu.contains(e.target))closeAll();});
 }
 /* ---- ⑤ 语音输入（Web Speech API，仅本机识别，不上传） ---- */
 var mic=document.getElementById('btnMic'),ta=document.getElementById('composerInput');
 if(mic&&ta){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mic.addEventListener('click',function(){if(HG.toast)HG.toast('当前浏览器不支持语音，请用 Edge 或 Chrome');});
   mic.style.opacity=.55;}
  else{
   var rec=new SR();rec.lang='zh-CN';rec.continuous=false;rec.interimResults=true;
   var listening=false,base='';
   function fit(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px';}
   mic.addEventListener('click',function(){
    if(listening){try{rec.stop();}catch(e){}return;}
    base=ta.value?(ta.value.replace(/\s$/,'')+' '):'';
    try{rec.start();}catch(e){}
   });
   rec.onstart=function(){listening=true;mic.classList.add('rec');};
   rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
    ta.value=base+t;fit();if(HG.syncSendReady)HG.syncSendReady();};
   var end=function(){listening=false;mic.classList.remove('rec');fit();if(HG.syncSendReady)HG.syncSendReady();};
   rec.onend=end;rec.onerror=function(ev){end();if(ev&&ev.error==='not-allowed'&&HG.toast)HG.toast('请在浏览器允许麦克风权限');};
  }
 }
 /* ---- ⑥ Hogee上新：仅官方管理员可上传，服务端持久化、全员可见 ---- */
 var FAPI='https://api.workhogee.com';
 function fIsAdmin(){try{return !!(window.HogeeMember&&HogeeMember.getUser()&&HogeeMember.getUser().role==='admin');}catch(e){return false;}}
 document.addEventListener('click',function(e){
  var add=e.target.closest('#hmAddBtn');
  if(add){e.preventDefault();e.stopPropagation();
   if(!fIsAdmin()){if(HG.toast)HG.toast('仅官方运营账号可维护上新素材');return;}
   var inp0=document.getElementById('hmUpload');if(inp0)inp0.click();}
 },true);
 function fSzByAspect(a){if(a>=1.45)return 'wide';if(a<=0.78)return 'tall';return 'sq';}
 function fMediaSize(file){
  return new Promise(function(resolve){
   if(/^video\//.test(file.type)){
    var v=document.createElement('video');v.preload='metadata';
    v.onloadedmetadata=function(){resolve(fSzByAspect((v.videoWidth||16)/(v.videoHeight||9)));};
    v.onerror=function(){resolve('wide');};v.src=URL.createObjectURL(file);
   }else{
    var img=new Image();
    img.onload=function(){resolve(fSzByAspect(img.width/img.height));};
    img.onerror=function(){resolve('sq');};img.src=URL.createObjectURL(file);
   }
  });
 }
 function fExt(file){var m=(file.name||'').toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:(/^video\//.test(file.type)?'mp4':'jpg');}
 function fCap(file){return (file.name||'官方素材').replace(/\.[a-z0-9]+$/i,'').slice(0,60)||'官方素材';}
 function fUploadOne(file){
  var ext=fExt(file);
  return fMediaSize(file).then(function(sz){
   var kind=/^(mp4|mov|webm)$/.test(ext)?'v':'img';
   return HogeeMember.authFetch(FAPI+'/api/feed/presign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ext:ext})})
    .then(function(r){if(!r.ok)throw new Error('presign '+r.status);return r.json();})
    .then(function(j){
     if(!j.ok||!j.putUrl||!j.key)throw new Error('presign bad');
     var putHeaders={'Content-Type':(j.headers&&j.headers['Content-Type'])||'application/octet-stream'};
     return fetch(j.putUrl,{method:'PUT',headers:putHeaders,body:file}).then(function(pr){if(!pr.ok)throw new Error('put '+pr.status);
      return HogeeMember.authFetch(FAPI+'/api/feed/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,key:j.key,cap:fCap(file),sz:sz})});});
    })
    .then(function(r){if(!r.ok)throw new Error('commit '+r.status);return r.json();});
  });
 }
 var hmInp=document.getElementById('hmUpload');
 if(hmInp)hmInp.addEventListener('change',function(){
  if(!fIsAdmin()){hmInp.value='';if(HG.toast)HG.toast('仅官方运营账号可维护上新素材');return;}
  var files=Array.prototype.slice.call(hmInp.files||[]);if(!files.length)return;
  hmInp.value='';
  if(HG.toast)HG.toast('开始上传 '+files.length+' 个素材，请勿关闭页面…');
  files.reduce(function(p,f){return p.then(function(){return fUploadOne(f);});},Promise.resolve())
   .then(function(){if(HG.toast)HG.toast('上传完成，已同步给所有用户');if(HG.refreshHmFeed)HG.refreshHmFeed();})
   .catch(function(err){if(HG.toast)HG.toast('部分素材上传失败：'+(err&&err.message?err.message:'请重试'));if(HG.refreshHmFeed)HG.refreshHmFeed();});
 });
 function fRefreshIfHome(){var rail0=document.getElementById('hmRail');if(rail0&&HG.refreshHmFeed)HG.refreshHmFeed();}
 document.addEventListener('hogee:auth',fRefreshIfHome);
 document.addEventListener('hogee:logout',fRefreshIfHome);
})();

</script>
