<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkHogee · 生意伙计工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231c1917'/%3E%3Cpath d='M7 7h2.4v3.4h3.2V7H15v10h-2.4v-4.2H9.4V17H7z' fill='%23fff'/%3E%3Cpath d='M16.4 7h.4c1.5 0 2.5.8 2.5 2.2 0 .9-.4 1.5-1.1 1.8.9.3 1.4 1 1.4 2 0 1.6-1.1 2.5-2.8 2.5h-.4zm2.2 2.3c0-.6-.4-1-1.1-1h-.7v2.1h.7c.7 0 1.1-.4 1.1-1.1zm.2 3.5c0-.7-.4-1.1-1.2-1.1h-.8v2.3h.8c.8 0 1.2-.5 1.2-1.2z' fill='%23fb923c'/%3E%3C/svg%3E">
<style>
/* ============================================================
   WorkHogee · 对话式 Agent 工作台（暖白品牌版 · 对外创作界面）
   保留全部 class / 状态钩子，仅重塑视觉
   ============================================================ */
:root{
  --bg:#0d1119; --stage:#131a27; --panel:#1b2333; --panel2:#232d42; --elev:#2c3750;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.075);
  --tx:#f4f7fd; --tx2:rgba(244,247,253,.72); --tx3:rgba(244,247,253,.50);
  --orange:#fb7a22; --orange-d:#f2630d; --orange-soft:rgba(251,122,34,.18);
  --atu:#fb923c; --awen:#60a5fa; --ashi:#f472b6; --afa:#4ade80; --agu:#c084fc; --host:#fb923c;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --shadow-s:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 10px 30px rgba(0,0,0,.40);
  --shadow-l:0 24px 70px rgba(0,0,0,.62);
  --rail:240px; --deliver:0px;
  --font:"Trebuchet MS","Trebuchet","Lucida Sans Unicode","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--stage);color:var(--tx);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.wm{font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1;white-space:nowrap}
.wm b{color:var(--tx);font-weight:800}.wm i{color:var(--orange);font-style:normal;font-weight:800}
.rail-brand a.wm svg .wb1{fill:var(--tx)}
.rail-brand a.wm svg text{fill:var(--tx)}
body[data-rail="mini"]{--rail:76px}
body[data-deliver="open"]{--deliver:380px}
.rail-brand-actions{display:inline-flex;align-items:center;gap:6px;flex:none}
.rail-toggle{appearance:none;background:transparent;border:1px solid var(--line);color:var(--tx2);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:.15s;padding:0}
.rail-toggle:hover{color:var(--orange);border-color:var(--orange);background:var(--orange-soft)}
#btnDeliver.on{color:var(--orange);background:var(--orange-soft)}
@media(min-width:1081px){
  .deliver{overflow:hidden;transition:border-color .22s ease}
  body:not([data-deliver="open"]) .deliver{border-left-color:transparent}
}
@media(max-width:900px){.rail-toggle{display:none}}
.app{transition:grid-template-columns .24s ease}
.app{display:grid;grid-template-columns:var(--rail) 1fr var(--deliver);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}

/* 左列 */
.rail{background:var(--bg);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.rail-brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 14px}
.rail-brand .wm{font-size:19px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--tx2);width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;transition:background .16s,color .16s;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.rail-scroll{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
.btn-new{width:100%;appearance:none;border:0;background:var(--orange-d);color:#fff;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;transition:.18s;margin-bottom:12px;box-shadow:0 6px 16px rgba(234,88,12,.22)}
.btn-new:hover{background:var(--orange);transform:translateY(-1px);box-shadow:0 10px 22px rgba(234,88,12,.28)}
.btn-new .pl{width:18px;height:18px;flex:none}
.rmenu{display:flex;flex-direction:column;gap:2px;margin:2px 0 12px}
.rgroup{font-size:11px;font-weight:600;letter-spacing:.10em;color:var(--tx3);padding:14px 14px 5px;text-transform:uppercase;user-select:none}
.rgroup:first-child{padding-top:4px}
.rmenu button{appearance:none;border:0;background:transparent;text-align:left;color:var(--tx2);font-size:14px;font-weight:500;border-radius:11px;height:44px;padding:0 13px;display:flex;align-items:center;gap:12px;transition:background .15s ease,color .15s ease;cursor:pointer;width:100%}
.rmenu button svg{width:19px;height:19px;flex:none;color:var(--tx3);transition:color .15s ease}
.rmenu button:hover{background:rgba(255,255,255,.055);color:var(--tx)}
.rmenu button:hover svg{color:var(--tx2)}
.rgroup{margin:16px 4px 7px;font-size:10.5px;letter-spacing:1.4px;color:var(--tx3);text-transform:uppercase;padding:0;font-weight:700}
.skill-now{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px 12px;cursor:pointer;transition:.16s;box-shadow:var(--shadow-s)}
.skill-now:hover{border-color:rgba(234,88,12,.45);box-shadow:var(--shadow)}
.skill-now .sn-t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.skill-now .sn-d{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.45}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);flex:none}
.partner{display:flex;align-items:center;gap:10px;width:100%;appearance:none;border:0;background:transparent;border-radius:11px;padding:7px 8px;text-align:left;transition:.15s;position:relative;cursor:pointer}
.partner:hover{background:rgba(255,255,255,.045)}
.partner.active{background:var(--panel);box-shadow:var(--shadow-s)}
.partner.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--orange)}
.pavatar{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.05)}
.pavatar svg{width:17px;height:17px}
.p-atu .pavatar{background:rgba(234,88,12,.13)}.p-atu .pavatar svg{color:var(--atu)}.p-atu.active .pavatar{box-shadow:0 0 0 1.5px var(--atu)}
.bubble.welcome{font-size:15px;line-height:1.85;padding:16px 18px}
.tasklist{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.task-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.15s;position:relative}
.task-item:hover{background:rgba(255,255,255,.045)}
.task-item.active{background:var(--panel);box-shadow:var(--shadow-s)}
.task-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--orange)}
.task-item .tk-ico{width:15px;height:15px;flex:none;color:var(--tx3);display:flex}
.task-item .tk-ico svg{width:15px;height:15px}
.task-item.active .tk-ico{color:var(--orange)}
.task-item .tk-name{flex:1;min-width:0;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item.active .tk-name{color:var(--tx);font-weight:600}
.task-item .tk-pin{flex:none;color:var(--orange);display:flex}
.task-item .tk-pin svg{width:12px;height:12px}
.task-item .tk-acts{display:none;gap:1px;flex:none}
.task-item:hover .tk-acts{display:flex}
.task-item .tk-acts button{appearance:none;border:0;background:transparent;color:var(--tx3);width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.task-item .tk-acts button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.task-item .tk-acts button.danger:hover{color:var(--bad)}
.task-item .tk-acts svg{width:13px;height:13px}
.task-item.editing,.task-item.confirming{background:rgba(255,255,255,.06)}
.task-item.editing .tk-acts,.task-item.confirming .tk-acts{display:flex}
.task-item .tk-edit{flex:1;min-width:0;height:26px;margin:0;border:1px solid var(--orange);background:rgba(251,122,34,.14);color:var(--tx);font-size:12.5px;font-family:inherit;font-weight:500;border-radius:7px;padding:0 8px;outline:none;box-shadow:0 0 0 2px rgba(251,122,34,.12)}
.task-item .tk-warn{flex:1;min-width:0;font-size:12px;font-weight:600;color:#ff8a7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item .tk-acts button.ok{color:var(--ok)}
.task-item .tk-acts button.ok:hover{background:rgba(255,255,255,.1);color:var(--ok)}
.task-empty{font-size:11.5px;color:var(--tx3);padding:2px 8px 8px;line-height:1.55}
.cmp-quick{display:flex;gap:7px;overflow-x:auto;padding:0 1px 9px;scrollbar-width:none}
.cmp-quick::-webkit-scrollbar{display:none}
.cmp-quick button{appearance:none;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-s)}
.cmp-quick button svg{width:14px;height:14px}
.cmp-quick button:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);transform:translateY(-1px)}
@media(max-width:560px){.cmp-quick button{font-size:12px;padding:6px 11px}.task-item .tk-name{font-size:12px}.bubble.welcome{font-size:14.5px}}
.p-awen .pavatar{background:rgba(37,99,235,.12)}.p-awen .pavatar svg{color:var(--awen)}.p-awen.active .pavatar{box-shadow:0 0 0 1.5px var(--awen)}
.p-afa .pavatar{background:rgba(22,163,74,.12)}.p-afa .pavatar svg{color:var(--afa)}.p-afa.active .pavatar{box-shadow:0 0 0 1.5px var(--afa)}
.p-agu .pavatar{background:rgba(147,51,234,.12)}.p-agu .pavatar svg{color:var(--agu)}.p-agu.active .pavatar{box-shadow:0 0 0 1.5px var(--agu)}
.p-ashi .pavatar{background:rgba(219,39,119,.12)}.p-ashi .pavatar svg{color:var(--ashi)}.p-ashi.active .pavatar{box-shadow:0 0 0 1.5px var(--ashi)}
.partner .pn{flex:1;min-width:0}
.partner .pn b{display:block;font-size:13px;font-weight:700;color:var(--tx)}
.partner .pn span{display:block;font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hire{width:30px;height:18px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:.18s;border:0;padding:0}
.hire::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;box-shadow:var(--shadow-s)}
.hire.on{background:var(--orange-d)}.hire.on::after{left:14px}
.rail-foot{border-top:1px solid var(--line2);padding:12px}
.rail-foot .member-nav{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.rail-foot .hm-navbtn{width:100%;padding:10px 14px;text-align:center;font-size:13px}
.rail-foot .hm-navuser{max-width:none;justify-content:center;padding:9px 12px;font-size:12.5px;color:var(--tx);background:var(--panel);border:1px solid var(--line)}
.rail-foot .hm-navlogout{text-align:center;color:var(--tx2)}
.rail-foot .hm-navlogout:hover{color:var(--orange)}
.rail-ver{text-align:center;font-size:10.5px;color:var(--tx3);margin-top:9px;letter-spacing:.5px}

/* 中列 */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage);border-right:1px solid var(--line2)}
.topbar{height:56px;flex:none;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:11px;padding:0 18px;background:rgba(17,23,35,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5}
.tb-task{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tb-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--orange-soft);flex:none}
.tb-avatar svg{width:18px;height:18px;color:var(--orange)}
.tb-avatar.p-awen{background:rgba(37,99,235,.12)}.tb-avatar.p-awen svg{color:var(--awen)}
.tb-avatar.p-ashi{background:rgba(219,39,119,.12)}.tb-avatar.p-ashi svg{color:var(--ashi)}
.tb-avatar.p-afa{background:rgba(22,163,74,.12)}.tb-avatar.p-afa svg{color:var(--afa)}
.tb-avatar.p-agu{background:rgba(147,51,234,.12)}.tb-avatar.p-agu svg{color:var(--agu)}
.tb-avatar.p-atu{background:rgba(234,88,12,.12)}.tb-avatar.p-atu svg{color:var(--atu)}
.tb-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.tb-sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.skill-chip{font-size:11.5px;color:var(--orange);border:1px solid rgba(234,88,12,.32);background:var(--orange-soft);border-radius:999px;padding:5px 11px;white-space:nowrap;font-weight:600;cursor:pointer;transition:.16s}
.skill-chip:hover{background:rgba(234,88,12,.18)}
.btn-partner{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;font-size:12px;font-weight:600;padding:6px 12px;transition:.16s;box-shadow:var(--shadow-s)}
.btn-partner:hover{border-color:var(--orange);color:var(--orange)}
.only-mobile{display:none!important}
.chat{flex:1;min-height:0;overflow-y:auto;padding:26px 0 14px;scroll-behavior:smooth;display:flex;flex-direction:column;align-items:center}
.chat-inner{width:100%;max-width:880px;margin:0 auto;padding:0 22px;box-sizing:border-box}
.msg{display:flex;gap:11px;margin:18px 0;animation:msgIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg .m-avatar{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--orange-soft);margin-top:2px}
.msg .m-avatar svg{width:18px;height:18px;color:var(--orange)}
.msg.user{flex-direction:row-reverse}
.msg.user .m-avatar{background:rgba(255,255,255,.08)}.msg.user .m-avatar svg{color:var(--tx2)}
.m-body{min-width:0;max-width:calc(100% - 52px)}
.bubble{display:inline-block;padding:11px 15px;border-radius:6px 15px 15px 15px;background:var(--panel);border:1px solid var(--line2);color:var(--tx);font-size:13.8px;line-height:1.7;box-shadow:var(--shadow-s)}
.msg.user .bubble{background:var(--orange-d);border-color:transparent;color:#fff;border-radius:15px 6px 15px 15px;box-shadow:0 8px 20px rgba(234,88,12,.22)}
.bubble b{color:var(--orange)}.msg.user .bubble b{color:#fff}
.typing{display:inline-flex;gap:4px;padding:3px 2}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 4px 45px}
.quick button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;transition:.16s;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-s)}
.quick button svg{width:15px;height:15px}
.quick button:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);transform:translateY(-1px)}

/* 品牌欢迎空态 */
.hw{max-width:720px;margin:6vh auto 0;text-align:center;animation:hwIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes hwIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hw-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--tx2);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;margin-bottom:20px}
.hw-badge .dot-live{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.hw-title{font-size:40px;line-height:1.18;font-weight:800;letter-spacing:-.5px;color:var(--tx)}
.hw-title .hl{color:var(--tx)}
.hw-sub{margin:16px auto 0;max-width:560px;font-size:14.5px;line-height:1.85;color:var(--tx2)}
.hw-team{display:flex;justify-content:center;gap:10px;margin:28px 0 6px;flex-wrap:wrap}
.hw-mate{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,#20232b,#191b21);border-radius:16px;padding:15px 12px 13px;width:128px;display:flex;flex-direction:column;align-items:center;gap:9px;transition:.22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.hw-mate:hover{transform:translateY(-5px);border-color:rgba(249,115,22,.55);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.hw-mate:hover .hm-ic{transform:scale(1.08)}
.hw-mate .hm-ic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:.22s}
.hw-mate .hm-ic svg{width:25px;height:25px}
.hw-mate b{font-size:13px;font-weight:800}
.hw-mate span{font-size:10.5px;color:var(--tx3);line-height:1.4}
.hw-mate.p-atu .hm-ic{background:rgba(234,88,12,.12);color:var(--atu)}.hw-mate.p-atu:hover{border-color:rgba(234,88,12,.5)}
.hw-mate.p-awen .hm-ic{background:rgba(37,99,235,.11);color:var(--awen)}.hw-mate.p-awen:hover{border-color:rgba(37,99,235,.5)}
.hw-mate.p-ashi .hm-ic{background:rgba(219,39,119,.11);color:var(--ashi)}.hw-mate.p-ashi:hover{border-color:rgba(219,39,119,.5)}
.hw-mate.p-afa .hm-ic{background:rgba(22,163,74,.11);color:var(--afa)}.hw-mate.p-afa:hover{border-color:rgba(22,163,74,.5)}
.hw-mate.p-agu .hm-ic{background:rgba(147,51,234,.11);color:var(--agu)}.hw-mate.p-agu:hover{border-color:rgba(147,51,234,.5)}
.hw-hint{margin:22px auto 0;font-size:12.5px;color:var(--tx3);display:flex;align-items:center;justify-content:center;gap:8px}
.hw-hint svg{width:15px;height:15px;color:var(--orange)}
.hw-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.hw-actions button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:999px;padding:11px 19px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-s);transition:.18s cubic-bezier(.2,.8,.2,1);font-family:inherit}
.hw-actions button svg{width:16px;height:16px;color:var(--orange)}
.hw-actions button:hover{border-color:var(--orange);background:var(--orange-soft);transform:translateY(-2px);box-shadow:var(--shadow)}
.hw-actions button.primary{background:var(--orange-d);border-color:var(--orange-d);color:#fff;box-shadow:0 10px 24px rgba(234,88,12,.28)}
.hw-actions button.primary svg{color:#fff}
.hw-actions button.primary:hover{background:var(--orange);border-color:var(--orange)}
@media(max-width:560px){.hw{margin-top:3vh}.hw-title{font-size:30px}.hw-sub{font-size:13.5px}.hw-mate{width:calc(33.33% - 8px);padding:11px 6px}.hw-team{gap:8px}.hw-actions button{padding:10px 15px;font-size:12.5px}}

/* 对话卡片 */
.m-card{border:1px solid var(--line2);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.card-pad{padding:17px 18px}
.card-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.card-title svg{width:17px;height:17px;color:var(--orange);flex:none}
.card-desc{font-size:12.8px;color:var(--tx2);line-height:1.65;margin-bottom:13px}
.card-desc b{color:var(--tx)}
.card-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.btn{appearance:none;border-radius:11px;font-size:13px;font-weight:700;padding:10px 16px;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;transition:.16s;line-height:1}
.btn-orange{background:linear-gradient(180deg,#fb8233,#f2630d);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(234,88,12,.28)}
.btn-orange:hover{background:linear-gradient(180deg,#fb7a22,#ea580c);color:#fff;border-color:transparent}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--orange-d);color:#fff;box-shadow:0 8px 20px rgba(234,88,12,.24)}
.btn-primary:hover{background:var(--orange);transform:translateY(-1px)}
.btn-dark{background:#fff;color:#111}.btn-dark:hover{background:#e6e7ea}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--tx2);box-shadow:var(--shadow-s)}.btn-ghost:hover{border-color:rgba(255,255,255,.3);color:var(--tx)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.chip{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px 12px;color:var(--tx);transition:.15s;display:flex;gap:9px;align-items:flex-start;box-shadow:var(--shadow-s)}
.chip:hover{border-color:rgba(234,88,12,.5);background:var(--orange-soft)}
.chip.on{border-color:var(--orange);background:var(--orange-soft);box-shadow:inset 0 0 0 1px var(--orange)}
.chip-ico{color:var(--orange);flex:none;display:flex;margin-top:1px}.chip-ico svg{width:18px;height:18px}
.chip .chip-sub{display:block;font-size:11px;color:var(--tx3);margin-top:2px;font-weight:400;line-height:1.4}
.chip.on .chip-sub{color:var(--tx2)}
.chip-block{margin-bottom:14px}
.cb-label{font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.opt{font-size:10.5px;font-weight:600;color:var(--orange);border:1px solid rgba(234,88,12,.4);border-radius:999px;padding:1px 8px}
.drop{border:1.5px dashed rgba(255,255,255,.22);border-radius:15px;padding:26px 16px;text-align:center;color:var(--tx2);transition:.18s;cursor:pointer;background:var(--panel2)}
.drop:hover,.drop.drag{border-color:var(--orange);background:var(--orange-soft);color:var(--tx)}
.drop-ico{display:flex;justify-content:center;margin-bottom:9px;color:var(--orange)}.drop-ico svg{width:40px;height:40px;flex:none}
.drop h4{font-size:13.5px;font-weight:700;color:var(--tx);margin-bottom:4px}
.drop p{font-size:11.5px;color:var(--tx3)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:13px}
.shot{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:#0f1013}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .q{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(16,17,21,.82);color:#fff;border:1px solid rgba(255,255,255,.14)}
.shot .q.ok{color:var(--ok);border-color:rgba(22,163,74,.4)}
.shot .q.warn{color:var(--warn);border-color:rgba(217,119,6,.4)}
.shot .q.bad{color:var(--bad);border-color:rgba(220,38,38,.4)}
.shot .del{position:absolute;right:4px;top:4px;width:21px;height:21px;border-radius:50%;border:0;background:rgba(16,17,21,.82);color:#fff;font-size:13px;line-height:1;opacity:0;transition:.15s}
.shot:hover .del{opacity:1}
.tip-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--tx2);margin-top:11px;background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.26);border-radius:11px;padding:9px 11px}
.tip-line svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:1px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;transition:border .15s,box-shadow .15s}
.fld textarea{resize:vertical;line-height:1.6}
.fld input::placeholder,.fld textarea::placeholder{color:var(--tx3)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld select option{background:#20232a;color:var(--tx)}
.car-tabs,.car-abc{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.car-tabs button,.car-abc button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;transition:.14s;box-shadow:var(--shadow-s)}
.car-abc button{min-width:30px;padding:5px 7px}
.car-tabs button.sel,.car-abc button.sel{background:var(--orange-d);border-color:var(--orange-d);color:#fff;box-shadow:none}
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:196px;overflow-y:auto;border:1px solid var(--line2);border-radius:11px;padding:8px;background:var(--panel2)}
.car-grid button{appearance:none;border:1px solid transparent;background:transparent;color:var(--tx2);border-radius:7px;padding:6px 4px;font-size:12px;transition:.13s}
.car-grid button:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.car-grid button.sel{background:var(--orange-soft);color:var(--orange);border-color:rgba(234,88,12,.4);font-weight:700}
.sell-chips{display:flex;flex-wrap:wrap;gap:7px}
.sell-chips button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px;transition:.14s}
.sell-chips button:hover{border-color:rgba(234,88,12,.5)}
.sell-chips button.on{background:var(--orange-soft);border-color:var(--orange);color:var(--orange);font-weight:600}
.compliance{display:flex;gap:8px;align-items:flex-start;font-size:11.8px;color:var(--tx3);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px;margin-top:13px}
.compliance svg{width:15px;height:15px;color:var(--orange);flex:none;margin-top:1px}
.prog-task{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;background:var(--panel);box-shadow:var(--shadow-s)}
.prog-task .pt-ico{color:var(--tx2);display:flex}.prog-task .pt-ico svg{width:18px;height:18px;flex:none}
.prog-task.run .pt-ico{color:var(--orange)}.prog-task.done .pt-ico{color:var(--ok)}
.prog-task .pt-name{font-size:13px;font-weight:600}
.prog-task .pt-sub{font-size:11px;color:var(--tx3)}
.prog-task .pt-state{margin-left:auto;font-size:11.5px;color:var(--tx3);font-weight:600;flex:none}
.prog-task.run .pt-state{color:var(--orange)}.prog-task.done .pt-state{color:var(--ok)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 输入区 */
.composer{flex:none;padding:12px 22px 14px;background:linear-gradient(180deg,rgba(20,21,25,0),var(--stage) 30%);display:flex;flex-direction:column;align-items:center}
.composer-inner{width:100%;max-width:880px;margin:0 auto;box-sizing:border-box}
.cmp-attach{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.cmp-attach .at{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px 4px 4px;font-size:11.5px;color:var(--tx2);box-shadow:var(--shadow-s)}
.cmp-attach .at img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.cmp-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 10px;transition:border .16s,box-shadow .16s;box-shadow:var(--shadow)}
.cmp-box:focus-within{border-color:rgba(234,88,12,.55);box-shadow:var(--shadow),0 0 0 3px var(--orange-soft)}
.cmp-plus{appearance:none;border:0;background:rgba(255,255,255,.06);color:var(--tx2);width:34px;height:34px;border-radius:11px;font-size:20px;line-height:1;flex:none;transition:.15s;display:flex;align-items:center;justify-content:center}
.cmp-plus:hover{background:var(--orange);color:#fff}
#composerInput{flex:1;background:transparent;border:0;resize:none;color:var(--tx);font-family:inherit;font-size:14px;font-weight:300;line-height:1.6;min-height:80px;max-height:220px;padding:10px 4px;outline:none}
#composerInput::placeholder{color:var(--tx3)}
.cmp-q{appearance:none;border:1px solid var(--line);background:transparent;color:var(--tx2);border-radius:10px;font-size:11.5px;font-weight:700;width:42px;height:34px;flex:none;transition:.15s}
.cmp-q:hover{border-color:rgba(255,255,255,.42);color:var(--tx)}
.cmp-send{appearance:none;border:1px solid rgba(251,122,34,.5);background:rgba(251,122,34,.10);color:#fd9248;width:36px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;transition:.16s}
.cmp-send:hover{background:rgba(251,122,34,.20);border-color:#fb7a22}.cmp-send.ready{background:linear-gradient(180deg,#fd8f43,#ef5f0a);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(242,99,13,.4)}.cmp-send.ready:hover{filter:brightness(1.07)}.cmp-send svg{width:17px;height:17px}
.cmp-hint{text-align:center;font-size:11px;color:var(--tx3);margin-top:8px;line-height:1.5}

/* + 菜单 */
.pop{position:fixed;z-index:80;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-l);padding:6px;min-width:214px}
.pop.show{display:flex;animation:msgIn .18s}
.pop button{appearance:none;border:0;background:transparent;text-align:left;color:var(--tx2);font-size:13px;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;transition:.13s}
.pop button svg{width:16px;height:16px;color:var(--orange)}
.pop .pavatar{width:24px;height:24px;margin:0;flex:none;border-radius:7px}
.pop .pavatar svg{width:14px;height:14px}
.pop-on{margin-left:auto;font-size:10px;font-weight:700;color:var(--orange);border:1px solid rgba(234,88,12,.4);background:var(--orange-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pop button:hover{background:rgba(255,255,255,.05);color:var(--tx)}

/* 右列 交付物 */
.deliver{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line2)}
.dl-top{flex:none;height:56px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.dl-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:9px}
.dl-count{font-size:11px;font-weight:700;color:var(--orange);background:var(--orange-soft);border-radius:999px;padding:2px 9px;display:none}
.dl-count.show{display:inline-block}
.dl-actions{display:flex;gap:7px;align-items:center}
.mini{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:10px;font-size:12px;font-weight:600;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;transition:.15s;box-shadow:var(--shadow-s)}
.mini svg{width:14px;height:14px}
.mini:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.dl-tabs{flex:none;display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line2);overflow-x:auto}
.dl-tabs button{appearance:none;border:0;background:transparent;color:var(--tx3);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;transition:.14s;position:relative;white-space:nowrap}
.dl-tabs button:hover{color:var(--tx)}
.dl-tabs button.on{color:var(--orange);background:var(--orange-soft)}
.dl-tabs button .n{font-size:10px;margin-left:3px;opacity:.8}
.dl-body{flex:1;overflow-y:auto;padding:14px}
.dl-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--tx3);padding:30px}
.dl-empty .de-ico{width:78px;height:78px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);margin-bottom:18px;background:var(--panel2)}
.dl-empty .de-ico svg{width:34px;height:34px}
.dl-empty h4{color:var(--tx2);font-size:14px;margin-bottom:7px;font-weight:700}
.dl-empty p{font-size:12px;line-height:1.7;max-width:244px}
.dl-sec{margin-bottom:18px}
.dl-sec h5{font-size:11.5px;letter-spacing:.6px;color:var(--tx3);text-transform:uppercase;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:7px}
.dl-sec h5 svg{width:14px;height:14px;color:var(--orange)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);transition:.16s;box-shadow:var(--shadow-s)}
.res:hover{border-color:rgba(234,88,12,.45);transform:translateY(-2px);box-shadow:var(--shadow)}
.res-img{position:relative;aspect-ratio:1/1;cursor:pointer;background:#0f1013}
.res-img img{width:100%;height:100%;object-fit:cover}
.res-tag{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;color:#fff;background:rgba(16,17,21,.80);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 8px;max-width:82%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-ai{position:absolute;right:6px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.80);background:rgba(16,17,21,.75);border-radius:6px;padding:1px 6px}
.res-meta{padding:8px 9px 9px}
.res-name{font-size:12px;font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-acts{display:flex;gap:5px}
.res-acts button{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);border-radius:8px;padding:6px 0;display:flex;align-items:center;justify-content:center;transition:.14s}
.res-acts button:hover{border-color:var(--orange);color:var(--orange)}
.res-acts button svg{width:14px;height:14px}
.copy-box,.reach-box,.dyn-box{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:13px;margin-bottom:12px;box-shadow:var(--shadow-s)}
.copy-head,.reach-head,.dyn-head{font-size:12.8px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.copy-head svg,.reach-head svg,.dyn-head svg{width:15px;height:15px;color:var(--awen)}
.reach-head svg{color:var(--afa)}.dyn-head svg{color:var(--atu)}
.rh-sub,.dh-sub{font-weight:400;font-size:10.8px;color:var(--tx3);width:100%;margin-top:2px}
.copy-chans{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.copy-chan{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:8px;font-size:11.5px;font-weight:600;padding:6px 10px;transition:.14s}
.copy-chan.on{background:var(--awen);border-color:var(--awen);color:#fff}
.copy-warn{display:none;gap:7px;align-items:flex-start;font-size:11.5px;color:#fcd34d;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.28);border-radius:10px;padding:8px 10px;margin-bottom:9px;line-height:1.55}
.copy-box textarea{width:100%;min-height:172px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:12.3px;line-height:1.7;padding:10px 11px;font-family:inherit;resize:vertical}
.copy-box textarea:focus{outline:none;border-color:var(--awen)}
.copy-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.copy-ok{font-size:11px;color:var(--ok)}
.reach-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.reach-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;font-size:12px;font-weight:600;padding:9px 8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.14s;box-shadow:var(--shadow-s)}
.reach-btn svg{width:13px;height:13px;color:var(--tx3)}
.reach-btn:hover{border-color:var(--afa);color:var(--afa);background:rgba(22,163,74,.08)}
.reach-tip{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:9px}
.dyn-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.dyn-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;font-size:11.8px;font-weight:600;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.14s;box-shadow:var(--shadow-s)}
.dyn-btn svg{width:14px;height:14px;color:var(--atu)}
.dyn-btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.dyn-btn:disabled{opacity:.6;cursor:wait}
.dyn-hint{font-size:10.8px;color:var(--tx3);line-height:1.55;margin-bottom:10px}
.dyn-out{display:flex;flex-direction:column;gap:9px}
.dyn-item{border:1px solid var(--line2);border-radius:11px;padding:9px;background:var(--panel2)}
.di-view{border-radius:9px;overflow:hidden;background:#14110c;margin-bottom:8px}
.di-view img{width:100%}
.di-nine{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.di-nine img{width:100%;aspect-ratio:1/1;object-fit:cover}
.di-meta{font-size:11px;color:var(--tx3);margin-bottom:7px}
.di-name{color:var(--tx2);font-weight:600;font-size:12px;margin-bottom:2px}
.di-btns{display:flex}
.di-btn{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:8px;font-size:11.5px;font-weight:600;padding:7px;display:flex;gap:6px;align-items:center;justify-content:center;transition:.14s}
.di-btn:hover{border-color:var(--orange);color:var(--orange)}
.di-btn svg{width:13px;height:13px}

/* 阿视 · 图文成片（视频画布保留深色，便于看片） */
.vid-box{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:13px;margin-bottom:12px;box-shadow:var(--shadow-s)}
.vid-head{font-size:12.8px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vid-head svg{width:15px;height:15px;color:var(--ashi)}
.vid-sub{font-size:10.8px;color:var(--tx3);line-height:1.6;margin-bottom:8px}
.vid-row{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0;align-items:center}
.vid-row .vl{font-size:11px;color:var(--tx2);width:100%}
.vid-chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:600;font-family:inherit;transition:.14s}
.vid-chip:hover{border-color:var(--ashi);color:var(--ashi)}
.vid-chip.on{background:var(--ashi);border-color:var(--ashi);color:#fff}
.vid-stage{display:none;position:relative;margin:10px 0 4px;border-radius:12px;overflow:hidden;background:#14110c;border:1px solid var(--line)}
.vid-stage.show{display:block}
.vid-stage canvas{display:block;width:100%;height:auto;background:#14110c}
.vid-prog{height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.vid-prog.show{display:block}
.vid-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ashi),var(--orange));border-radius:99px;transition:width .12s linear}
.vid-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vid-btn{appearance:none;border-radius:11px;font-size:12px;font-weight:700;padding:9px 13px;font-family:inherit;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:inline-flex;align-items:center;gap:6px;transition:.15s;box-shadow:var(--shadow-s)}
.vid-btn svg{width:14px;height:14px}
.vid-btn:hover{border-color:var(--ashi);color:var(--ashi)}
.vid-btn.primary{background:var(--ashi);border-color:var(--ashi);color:#fff;box-shadow:0 8px 20px rgba(219,39,119,.22)}
.vid-btn.primary:hover{background:#be185d;color:#fff}
.vid-btn.primary:disabled{opacity:.55;cursor:not-allowed}
.vid-btn.ghost{color:var(--tx3);box-shadow:none}
.vid-soon{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--tx3);line-height:1.6;border:1px dashed var(--line);border-radius:11px;padding:9px 11px;margin-top:10px}
.vid-soon svg{width:15px;height:15px;flex:none;color:var(--ashi)}
.vid-soon b{color:var(--tx2)}
.vid-item{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#14110c;margin-bottom:10px}
.vid-item video{display:block;width:100%;background:#000}
.vi-meta{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--panel2)}
.vi-name{flex:1;min-width:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi-spec{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.vi-dl{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:5px;flex:none}
.vi-dl svg{width:13px;height:13px}.vi-dl:hover{border-color:var(--ashi);color:var(--ashi)}
.pub-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.pub-thumb{width:54px;height:54px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.pub-thumb img{width:100%;height:100%;object-fit:cover}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;width:148px;height:148px;display:flex;align-items:center;justify-content:center;flex:none}
.qrbox svg{width:100%;height:100%}
.pub-result{display:flex;gap:14px;flex-wrap:wrap}
.pub-info{flex:1;min-width:200px}
.pub-info label{display:block;font-size:11.5px;color:var(--tx2);margin:8px 0 5px}
.pub-link{display:flex;gap:6px}
.pub-link input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--tx);font-size:11.5px;padding:8px 10px}
.pub-cover{width:100%;border-radius:11px;overflow:hidden;margin-bottom:6px;border:1px solid var(--line2)}
.pub-cover img{width:100%}
.pub-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.pub-more{display:flex;gap:7px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--tx3);flex-wrap:wrap}
.pub-more select{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font-size:11.5px}

/* 实验室弹窗 */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.62);backdrop-filter:blur(5px)}
.modal.show{display:flex;animation:msgIn .2s}
.modal-card{width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-l)}
.modal-card>header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line2)}
.m-title{font-size:16px;font-weight:800}
.m-tabs{flex:none;display:flex;gap:4px;padding:12px 20px 0}
.m-tabs button{appearance:none;border:0;background:transparent;color:var(--tx3);font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:10px 10px 0 0;border-bottom:2px solid transparent;transition:.15s}
.m-tabs button.on{color:var(--orange);border-bottom-color:var(--orange)}
.modal .m-body{flex:1;overflow-y:auto;padding:18px 20px 22px}
.lab-note{font-size:12px;color:var(--tx2);line-height:1.65;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:15px}
.lab-item{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;background:var(--panel);transition:.15s;box-shadow:var(--shadow-s)}
.lab-item:hover{border-color:rgba(255,255,255,.22);box-shadow:var(--shadow)}
.li-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--tx2);flex:none}
.li-ico svg{width:20px;height:20px}
.li-main{flex:1;min-width:0}
.li-main b{font-size:13.5px;display:block}
.li-main span{font-size:11.5px;color:var(--tx3);line-height:1.5;display:block;margin-top:2px}
.li-state{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;flex:none}
.st-on{color:#fdba74;background:rgba(251,122,34,.16);border:1px solid rgba(251,122,34,.42)}
.st-soon{color:var(--tx3);background:var(--panel2);border:1px solid var(--line)}
.li-use{flex:none;font-size:11.5px;font-weight:700;color:var(--orange);background:transparent;border:1px solid rgba(251,122,34,.45);border-radius:999px;padding:5px 13px;cursor:pointer;transition:.15s}
.li-use:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
.st-kit{color:var(--afa);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.28)}
.st-oauth{color:var(--warn);background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.3)}
.li-btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;font-size:12px;font-weight:600;padding:8px 13px;flex:none;transition:.15s;white-space:nowrap}
.li-btn:hover{border-color:var(--orange);color:var(--orange)}
.li-btn.primary{background:var(--orange-d);border-color:var(--orange-d);color:#fff}
.li-btn.primary:hover{background:var(--orange);color:#fff}
.li-btn:disabled{opacity:.5;cursor:default}
.lab-group{font-size:11.5px;letter-spacing:1px;color:var(--tx3);font-weight:700;margin:16px 2px 9px;text-transform:uppercase}

/* lightbox（看图保留深色） / toast */
.lightbox{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(18,15,10,.92);padding:34px;animation:msgIn .2s}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.lb-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.lb-close:hover{background:rgba(255,255,255,.22)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:400;background:#24272f;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600;padding:11px 19px;border-radius:999px;box-shadow:var(--shadow-l);opacity:0;pointer-events:none;transition:.26s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(248,113,113,.5);background:#3a1d1a;color:#fecaca}

/* 响应式 */
.rail-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.60);z-index:40}

/* ===== 纳米式大输入卡：顶部书签 + 左上大上传方块 ===== */
.cmp-card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.09);transition:border-color .16s,box-shadow .16s;overflow:hidden}

.cmp-tabs{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0))}
.cmp-tabs::-webkit-scrollbar{display:none}
.cmp-tab{appearance:none;background:transparent;border:1px solid transparent;border-bottom:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--tx3);padding:10px 17px 11px;border-radius:11px 11px 0 0;white-space:nowrap;position:relative;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s,color .18s,box-shadow .18s;display:inline-flex;align-items:center}

.cmp-upload span{display:none}

/* ============================================================
   第三轮重构：深色点阵质感 + 品牌色克制点缀（覆盖前述规则）
   ============================================================ */
/* 中央舞台：点阵纹理 + 顶部暖光，破除纯黑白 */
.stage{position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
 background:
  radial-gradient(1100px 580px at 50% -18%, rgba(251,122,34,.20), rgba(251,122,34,0) 64%),
  radial-gradient(920px 660px at 95% -10%, rgba(96,165,250,.16), rgba(96,165,250,0) 62%),
  radial-gradient(840px 620px at -2% 4%, rgba(167,139,250,.13), rgba(167,139,250,0) 60%),
  radial-gradient(900px 520px at 50% 120%, rgba(251,122,34,.09), rgba(251,122,34,0) 66%);}
.stage::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.38;
 background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);
 background-size:26px 26px;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,.1) 44%,transparent 74%);
 mask-image:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,.1) 44%,transparent 74%);}
.topbar{position:relative;z-index:5}
.chat{position:relative;z-index:1}
.composer{position:relative;z-index:50}
/* 左栏：顶部一丝暖光 + 菜单选中品牌橙（对标纳米选中态） */
.rail{background:linear-gradient(180deg,rgba(251,122,34,.07),rgba(120,150,255,.035) 320px,transparent),var(--bg)}
.rmenu button.on{background:rgba(255,255,255,.10);color:#fff;font-weight:600;box-shadow:none}
.rmenu button.on svg{color:#fff}
.rmenu button.on:hover{background:rgba(255,255,255,.15);color:#fff}
.rmenu button.on:hover svg{color:#fff}
/* 任务分组标题 + 小新建钮 */
.rgroup{display:flex;align-items:center;justify-content:space-between;align-self:stretch;margin:16px 6px 8px;font-size:14px;font-weight:600;letter-spacing:.2px;color:var(--tx2);text-transform:none}
.rgroup-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasklist{align-self:stretch;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:1px}
.tasklist .task-item{margin:0}
#taskList .task-item .tk-ico{color:var(--tx3)}
#taskList .task-item.active .tk-ico{color:var(--orange)}
.rmenu .rgroup-add{appearance:none;border:0;background:transparent;color:var(--tx3);width:24px;height:24px;min-width:24px;flex:none;margin:0;padding:0;gap:0;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.rmenu .rgroup-add svg{width:15px;height:15px;flex:none}
.rmenu .rgroup-add:hover{color:var(--orange);background:var(--orange-soft)}
body[data-rail="mini"] .rail:hover .rgroup{display:flex}
.task-item .tk-name{font-size:13px}

function newTaskId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
var taskCache=[];
function loadTasks(){return taskCache;}
function readLocalTasks(){try{var v=JSON.parse(localStorage.getItem('hogee_tasks_local')||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}
function writeLocalTasks(){try{localStorage.setItem('hogee_tasks_local',JSON.stringify(taskCache));}catch(e){}}
function saveTasks(a){
 taskCache=a.slice(0,30);
 writeLocalTasks();
 // 异步同步到后端（fire and forget）
 try{
  fetch(API+'/api/tasks/sync',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({tasks:taskCache})})
   .then(function(r){return r.json();}).then(function(j){if(!(j&&j.ok))console.warn('tasks sync fail',j);}).catch(function(){});
 }catch(e){}
}
function loadTasksRemote(){
 if(!localStorage.getItem('hogee_mtoken')){var lt0=readLocalTasks();if(lt0.length)taskCache=lt0;renderTaskList();return Promise.resolve();}
 return fetch(API+'/api/tasks',{headers:authHeaders()})
  .then(function(r){return r.json();})
  .then(function(j){
   var local=readLocalTasks();
   if(j&&j.ok&&Array.isArray(j.tasks)&&j.tasks.length){taskCache=j.tasks;writeLocalTasks();}
   else if(local.length){taskCache=local;
     try{fetch(API+'/api/tasks/sync',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({tasks:taskCache})}).catch(function(){});}catch(e){}}
   renderTaskList();
  })
  .catch(function(){var lt1=readLocalTasks();if(lt1.length)taskCache=lt1;renderTaskList();});
}

/* ================= 图片处理 ================= */
function fileToDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}
function loadImage(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function prepareImage(file){
 return fileToDataURL(file).then(function(src){
  var p=window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return loadImage(src);}):loadImage(src);
  return p.then(function(img){
   var max=2048,w=img.width,h=img.height;
   if(Math.max(w,h)>max){var r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
   var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
   x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   try{img.close&&img.close();}catch(e){}
   return c.toDataURL('image/jpeg',.92);
  });
 });
}
function analyzeImage(dataUrl){
 return loadImage(dataUrl).then(function(img){
  var max=480,sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(8,Math.round(img.width*sc)),h=Math.max(8,Math.round(img.height*sc));
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  var d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h),bright=0;
  for(var i=0,j=0;i<d.length;i+=4,j++){var v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;bright+=v;}
  bright/=(w*h);var mean=0,n=0,lap=[];
  for(var y=1;y<h-1;y++)for(var xx=1;xx<w-1;xx++){var idx=y*w+xx,vv=4*g[idx]-g[idx-w]-g[idx+w]-g[idx-1]-g[idx+1];lap.push(vv);mean+=vv;n++;}
  mean/=n;var va=0;for(var k=0;k<lap.length;k++)va+=(lap[k]-mean)*(lap[k]-mean);va/=n;
  var sharp=va<55?'bad':(va<150?'warn':'ok');
  var exp=bright<48?'bad':(bright>212?'bad':(bright<72||bright>192?'warn':'ok'));
  var base={sharp:sharp,exp:exp};
  // 异步调后端 vision 细判（遮挡/完整度/构图），失败不影响主流程
  return callQcVision(dataUrl).then(function(v){
   if(v&&v.available){
    base.occlusion=v.checks.occlusion;
    base.completeness=v.checks.completeness;
    base.framing=v.checks.framing;
    base.level=v.level;
    base.tip=v.tip;
   }
   return base;
  }).catch(function(){return base;});
 });
}
function callQcVision(dataUrl){
 return fetch(API+'/qc',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({image:dataUrl})})
  .then(function(r){return r.json();})
  .then(function(j){return (j&&j.ok&&j.qc)?j.qc:null;});
}

function callGenerate(prompt,imagePayload,size){

 return fetch(API+'/generate',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),signal:ctrl.signal,
  body:JSON.stringify({prompt:prompt,image:imagePayload,size:size||'2048x2048'})})
 .then(function(resp){clearTimeout(timer);return resp.json().catch(function(){return null;}).then(function(j){
  if(resp.ok&&j&&j.ok&&j.b64)return 'data:image/jpeg;base64,'+j.b64;
  var code=j&&j.error&&j.error.code,msg=j&&j.error&&j.error.message;
  if(resp.status===401||(code&&code.indexOf('member')===0)){
   if(code!=='member_suspended'&&window.HogeeMember&&HogeeMember.logout)HogeeMember.logout();
   var e=new Error(code==='member_suspended'?(msg||'账号已停用，请联系客服'):'登录已失效，请重新登录后再生成');e.code=code||'member_unauthorized';throw e;
  }

  throw new Error(msg||('图像服务返回 '+resp.status));
 });}).catch(function(e){clearTimeout(timer);throw e;});

function callGenerateRetry(prompt,imagePayload,size,onTick){

  if(e&&typeof e.code==='string'&&e.code.indexOf('member')===0)throw e;
  if(e&&e.code==='rate_limited')return sleep(2600).then(function(){return attempt(n);});
  if(n>=2)throw e;return sleep(1300).then(function(){onTick&&onTick();return attempt(n+1);});
 });}

/* ================= TOS 跨端云盘（登录用户原图/成品直传；任何失败静默降级本地，绝不阻断出图） ================= */
function _tosLoggedIn(){return !!(window.HogeeMember&&HogeeMember.isLoggedIn&&HogeeMember.isLoggedIn());}
function _dataUrlToBlob(d){
 try{
  var parts=String(d).split(','),mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  var bin=atob(parts[1]||''),len=bin.length,ua=new Uint8Array(len);
  for(var i=0;i<len;i++)ua[i]=bin.charCodeAt(i);
  return new Blob([ua],{type:mime});
 }catch(e){return null;}
}
function _tosExt(d){var m=String(d).match(/data:image\/([a-zA-Z0-9]+)/);m=m?m[1].toLowerCase():'jpeg';if(m==='jpeg')return 'jpg';return (['png','webp','gif'].indexOf(m)>=0?m:'jpg');}
function tosPutObject(dataUrl,kind){
 if(!dataUrl||typeof dataUrl!=='string'||dataUrl.indexOf('data:image')!==0)return Promise.resolve(null);
 if(!_tosLoggedIn())return Promise.resolve(null);
 var ext=_tosExt(dataUrl);
 return authPost('/api/storage',{action:'put',ext:ext,kind:kind||'result'}).then(function(j){
  if(!j||!j.ok||!j.putUrl)return null;
  var blob=_dataUrlToBlob(dataUrl);if(!blob)return null;
  return fetch(j.putUrl,{method:'PUT',headers:{'Content-Type':(j.headers&&j.headers['Content-Type'])||blob.type||('image/'+ext)},body:blob})
   .then(function(r){return r.ok?{key:j.key,getUrl:j.getUrl}:null;}).catch(function(){return null;});
 }).catch(function(){return null;});
}
function tosGetUrl(key){
 if(!key||!_tosLoggedIn())return Promise.resolve(null);
 return authPost('/api/storage',{action:'get',key:key}).then(function(j){return (j&&j.ok&&j.getUrl)?j.getUrl:null;}).catch(function(){return null;});
}
function tosSyncImage(imgItem,kind){
 if(!imgItem||imgItem.tosKey||imgItem._tosBusy||!imgItem.dataUrl)return;
 imgItem._tosBusy=true;
 tosPutObject(imgItem.dataUrl,kind).then(function(o){
  imgItem._tosBusy=false;
  if(o){imgItem.tosKey=o.key;imgItem.tosUrl=o.getUrl;try{if(state.identity)markTaskProgress();}catch(e){}}
 });
}
function tosSyncResult(resItem){
 if(!resItem||resItem.tosKey||resItem._tosBusy||!resItem.url)return;
 resItem._tosBusy=true;
 tosPutObject(resItem.url,'result').then(function(o){
  resItem._tosBusy=false;
  if(o){resItem.tosKey=o.key;resItem.tosUrl=o.getUrl;try{markTaskProgress();}catch(e){}}
 });

 }
 root.querySelectorAll('.seg').forEach(function(b){b.addEventListener('click',function(){

  var lab=root.querySelector('#kbpCompanyLabel');if(lab)lab.textContent=b.getAttribute('data-type')==='personal'?'店铺 / 个体名称':'公司 / 商户名称';
 });});
 var sv=root.querySelector('#kbpSave');
 if(sv)sv.addEventListener('click',function(){
  var o=collect();
  if(o.email&&!(o.email.indexOf('@')>0&&o.email.indexOf('.')>o.email.indexOf('@'))){if(window.toast)toast('邮箱格式好像不对','err');return;}
  if(o.phone&&!/^[0-9+\-\s]{6,}$/.test(o.phone)){if(window.toast)toast('手机号格式好像不对','err');return;}
  kbProfSave(o);prof=o;
  var tip=root.querySelector('#kbpSaved');if(tip)tip.textContent='已保存 · 五个伙计已更新档案';
  if(window.toast)toast('基础信息已保存，行业能力已切换到「'+o.industry+'」');
 });
 var inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.style.display='none';document.body.appendChild(inp);
 var pendingCat='other';
 function paint(){
  kbAll().then(function(docs){syncKbText(docs);var box=root.querySelector('#kbGroups');if(!box)return;
   docs.forEach(function(d){if(!d.cat)d.cat='other';});
   box.innerHTML=KB_CATS.map(function(c){

    var items=arr.length?arr.map(function(d){var on=kbTextExt(d.ext);return '<div class="kb-item"><span class="ki-ic">'+kbIcon(d.ext)+'</span><div class="ki-main"><div class="ki-name">'+esc(d.name)+'</div><div class="ki-sub">'+kbFmtSize(d.size)+' · '+(d.ext||'file').toUpperCase()+' · '+fmtWTime(d.ts)+'</div></div><span class="ki-state '+(on?'on':'wait')+'">'+(on?'已用于文案参考':'已收录 · 解析即将开放')+'</span><button class="kb-del" type="button" data-kbdel="'+d.id+'" aria-label="删除">'+kbTrash()+'</button></div>';}).join(''):'<div class="kb-grp-empty">暂无，点上方卡片上传</div>';
    return '<div class="kb-grp"><div class="kb-grp-h"><span class="kc-ic" style="width:26px;height:26px;border-radius:8px">'+kbCatIcon(c.ic)+'</span>'+c.n+'<span class="cnt">'+arr.length+'</span></div>'+items+'</div>';
   }).join('');
  }).catch(function(){var box=root.querySelector('#kbGroups');if(box)box.innerHTML='<div class="kb-empty">当前浏览器无法启用本地资料库</div>';});
 }
 paint();
 root.addEventListener('click',function(e){
  var cat=e.target.closest('.kb-cat');if(cat){pendingCat=cat.getAttribute('data-cat');var cc=KB_CATS.filter(function(x){return x.id===pendingCat;})[0];inp.accept=cc?cc.accept:'';inp.click();return;}
  var del=e.target.closest('[data-kbdel]');if(del){kbDel(del.getAttribute('data-kbdel')).then(paint).catch(paint);}
 });
 inp.addEventListener('change',function(){
  var fs=Array.prototype.slice.call(inp.files||[]);if(!fs.length)return;
  var n=0;
  fs.forEach(function(f){var ext=kbExt(f.name),isText=kbTextExt(ext);var rec={id:'kb'+Date.now()+Math.random().toString(36).slice(2,7),name:f.name,size:f.size,ext:ext||'file',mime:f.type||'',ts:Date.now(),text:'',blob:f,cat:pendingCat};

 });

/* ================= rework5：作品墙 / 我的作品库 / 企业资料库 ================= */
/* ================= 我的作品：持久化作品库（本地 IndexedDB + TOS + 云端 /api/state） =================
 * 可复用：作品元数据统一存 localStorage(hogee_works)，绝不存 data:/blob: 大字段；
 *         图片/视频本体——登录会员传 TOS（存 tosKey，展示时按需换新预签名），未登录存 IndexedDB（存 localId）；
 *         文案/画册只存文本与链接；登录后经 /api/state 跨设备恢复。Web 专用适配集中在 HGIDB，未来小程序替换为 wx 文件 API。 */
var WORKS_LS='hogee_works';
var WK_PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="9"></svg>');
var wkCurList=[];
function newWid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function readWorksRaw(){
 var arr;
 try{var o=JSON.parse(localStorage.getItem(WORKS_LS)||'{"items":[]}');arr=(o&&Array.isArray(o.items))?o.items:[];}catch(e){arr=[];}
 arr.forEach(function(w){if(!w.id)w.id=newWid();if(!w.threadId)w.threadId='legacy';});
 return arr;
}
function writeWorksRaw(items){try{localStorage.setItem(WORKS_LS,JSON.stringify({items:items.slice(0,300)}));}catch(e){}}
function curThread(){return {threadId:(state&&state.taskId)||'legacy',threadTitle:(state&&state.taskTitle)||((state&&state.product&&state.product.name)||''),skill:((state&&state.identity&&state.identity.type)||'general')};}
function workFingerprint(w){return (w.tosKey||w.localId||w.url||(w.type==='copy'?('c:'+(w.text||'').slice(0,80)):(w.type==='showcase'?('sc:'+(w.code||'')):(w.type==='video'?('v:'+(w.label||'')):('i:'+(w.label||''))))));}
function addWork(rec){
 try{
  var items=readWorksRaw(),th=curThread(),w=Object.assign({id:newWid(),ts:Date.now()},th,rec),fp=workFingerprint(w),dup=-1;
  if(fp){for(var i=0;i<items.length;i++){if(items[i].type===w.type&&workFingerprint(items[i])===fp){dup=i;break;}}}
  if(dup>=0){w=Object.assign(items[dup],rec,{id:items[dup].id,ts:items[dup].ts||rec.ts||Date.now()});}
  else{items.unshift(w);}
  writeWorksRaw(items);if(typeof HGCloud!=='undefined')HGCloud.schedulePush();return w;
 }catch(e){return rec;}
}
function removeWorkById(id){writeWorksRaw(readWorksRaw().filter(function(x){return x.id!==id;}));if(typeof HGCloud!=='undefined')HGCloud.schedulePush();}
function getStoredWorks(){return readWorksRaw();}
function removeStoredWork(i){var a=readWorksRaw();if(i>=0&&i<a.length){var w=a[i];if(w.localId&&typeof HGIDB!=='undefined')HGIDB.del(w.localId);a.splice(i,1);writeWorksRaw(a);if(typeof HGCloud!=='undefined')HGCloud.schedulePush();}}
/* 兼容旧调用 rememberWork(type,item) */
function rememberWork(type,item){
 item=item||{};
 if(type==='copy')return addWork({type:'copy',text:item.text||'',label:item.label||'分渠道文案'});
 if(type==='img'){
  if(item.tosKey)return addWork({type:'img',url:item.url||'',tosKey:item.tosKey,label:item.label||'商品图'});
  if(item.url&&/^https?:/.test(item.url))return addWork({type:'img',url:item.url,label:item.label||'商品图'});
  if(item.url&&/^data:image/.test(item.url))return persistDataImage(item.url,item.label||'商品图');
 }
 if(type==='video'){
  if(item.tosKey)return addWork({type:'video',url:item.url||'',tosKey:item.tosKey,label:item.label||'营销视频'});
  if(item.url&&/^https?:/.test(item.url))return addWork({type:'video',url:item.url,label:item.label||'营销视频'});
 }
}
/* ---- IndexedDB 二进制适配层（Web 专用）---- */
var HGIDB={db:null,p:null,
 open:function(){if(this.p)return this.p;var self=this;this.p=new Promise(function(res){
  if(!window.indexedDB){res(null);return;}
  var rq;try{rq=indexedDB.open('hogee_assets',1);}catch(e){res(null);return;}
  rq.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('blobs'))db.createObjectStore('blobs',{keyPath:'id'});};
  rq.onsuccess=function(e){self.db=e.target.result;res(self.db);};rq.onerror=function(){res(null);};
 });return this.p;},
 put:function(blob){return this.open().then(function(db){if(!db)return null;var id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);return new Promise(function(res){try{var tx=db.transaction('blobs','readwrite');tx.objectStore('blobs').put({id:id,blob:blob});tx.oncomplete=function(){res(id);};tx.onerror=function(){res(null);};}catch(e){res(null);}});});},
 get:function(id){return this.open().then(function(db){if(!db||!id)return null;return new Promise(function(res){try{var rq=db.transaction('blobs','readonly').objectStore('blobs').get(id);rq.onsuccess=function(){res(rq.result?rq.result.blob:null);};rq.onerror=function(){res(null);};}catch(e){res(null);}});});},
 del:function(id){return this.open().then(function(db){if(!db||!id)return;try{db.transaction('blobs','readwrite').objectStore('blobs').delete(id);}catch(e){}});},
 clear:function(){return this.open().then(function(db){if(!db)return;try{db.transaction('blobs','readwrite').objectStore('blobs').clear();}catch(e){}});}
};
/* ---- 成品图 / 视频持久化（登录 TOS，未登录 IndexedDB）---- */
function persistDataImage(dataUrl,label){
 if(!dataUrl||dataUrl.indexOf('data:image')!==0)return;
 var blob;try{blob=_dataUrlToBlob(dataUrl);}catch(e){blob=null;}
 if(!blob)return;
 HGIDB.put(blob).then(function(id){if(id)addWork({type:'img',localId:id,url:'',label:label||'商品图'});});
}
function persistResult(resItem,label){
 if(!resItem)return;var dataUrl=resItem.url||'';
 if(typeof _tosLoggedIn==='function'&&_tosLoggedIn()&&dataUrl.indexOf('data:image')===0&&!resItem.tosKey&&!resItem._tosBusy){
  resItem._tosBusy=true;
  tosPutObject(dataUrl,'result').then(function(o){
   resItem._tosBusy=false;
   if(o){resItem.tosKey=o.key;resItem.tosUrl=o.getUrl;try{markTaskProgress();}catch(e){}addWork({type:'img',url:o.getUrl,tosKey:o.key,label:label||resItem.label||'商品图'});}
   else{persistDataImage(dataUrl,label||resItem.label||'商品图');}
  }).catch(function(){resItem._tosBusy=false;persistDataImage(dataUrl,label||resItem.label||'商品图');});
 }else if(dataUrl.indexOf('data:image')===0&&!resItem.tosKey){
  persistDataImage(dataUrl,label||resItem.label||'商品图');
 }
}
function tosPutBlob(blob,ext,kind){
 if(!blob||typeof _tosLoggedIn!=='function'||!_tosLoggedIn())return Promise.resolve(null);
 ext=(ext||'mp4').toLowerCase();
 return authPost('/api/storage',{action:'put',ext:ext,kind:kind||'video'}).then(function(j){
  if(!j||!j.ok||!j.putUrl)return null;
  var ct=(j.headers&&j.headers['Content-Type'])||blob.type||'video/mp4';
  return fetch(j.putUrl,{method:'PUT',headers:{'Content-Type':ct},body:blob}).then(function(r){return r.ok?{key:j.key,getUrl:j.getUrl}:null;}).catch(function(){return null;});
 }).catch(function(){return null;});

function migrateLocalToTOS(){
 try{
  if(typeof _tosLoggedIn!=='function'||!_tosLoggedIn()||typeof HGIDB==='undefined')return;
  var items=readWorksRaw(),jobs=[];
  items.forEach(function(w){
   if((w.type==='img'||w.type==='video')&&w.localId&&!w.tosKey){
    var oldLocal=w.localId;
    jobs.push(HGIDB.get(oldLocal).then(function(blob){
     if(!blob)return;
     var ext;
     if(w.type==='video')ext=(blob.type&&blob.type.indexOf('webm')>=0)?'webm':'mp4';
     else ext=(blob.type&&blob.type.indexOf('png')>=0)?'png':((blob.type&&blob.type.indexOf('webp')>=0)?'webp':'jpg');
     return tosPutBlob(blob,ext,w.type==='video'?'video':'result').then(function(o){
      if(o&&o.key){
       var all=readWorksRaw();
       for(var i=0;i<all.length;i++){if(all[i].id===w.id){all[i].tosKey=o.key;all[i].url=o.getUrl;delete all[i].localId;break;}}
       writeWorksRaw(all);HGIDB.del(oldLocal);
      }
     }).catch(function(){});
    }).catch(function(){}));
   }
  });
  if(jobs.length)Promise.all(jobs).then(function(){try{if(document.getElementById('worksView'))renderWorks();}catch(e){}if(typeof HGCloud!=='undefined')HGCloud.schedulePush();});
 }catch(e){}
}

  if(t=e.target.closest('[data-wresume]')){var id=t.getAttribute('data-wresume');if(typeof openTask==='function')openTask(id);return;}
  if(t=e.target.closest('[data-wl]')){openWkLightbox(wkCurList[parseInt(t.getAttribute('data-wl'),10)]);return;}
  if(t=e.target.closest('[data-wdl]')){wkDownload(wkCurList[parseInt(t.getAttribute('data-wdl'),10)]);return;}
  if(t=e.target.closest('[data-wcp]')){var wc=wkCurList[parseInt(t.getAttribute('data-wcp'),10)];copyPlain(wc.text).then(function(){toast('文案已复制');});return;}
  if(t=e.target.closest('[data-wre]')){wkRecreate(wkCurList[parseInt(t.getAttribute('data-wre'),10)]);return;}
  if(t=e.target.closest('[data-wurl]')){var wu=wkCurList[parseInt(t.getAttribute('data-wurl'),10)];if(wu&&wu.url)window.open(wu.url,'_blank','noopener');return;}
  if(t=e.target.closest('[data-wcurl]')){var wl=wkCurList[parseInt(t.getAttribute('data-wcurl'),10)];copyPlain(wl.url).then(function(){toast('画册链接已复制');});return;}
  if(t=e.target.closest('[data-wdel]')){
   var id=t.getAttribute('data-wdel');
   if(t.dataset.confirm==='1'){removeWorkById(id);toast('已删除');renderWorks();}
   else{t.dataset.confirm='1';var orig=t.textContent;t.textContent='确认删除？';var btn=t;setTimeout(function(){delete btn.dataset.confirm;btn.textContent=orig;},2200);}
   return;
  }
 });
}

function openAccountView(tab){
 tab=(tab==='quota'||tab==='help'||tab==='update')?tab:'profile';
 if(!(window.HogeeMember&&HogeeMember.isLoggedIn&&HogeeMember.isLoggedIn())){if(window.toast)toast('请先登录后查看账号信息');if(window.HogeeMember)HogeeMember.open('login');return;}
 closeAnalytics();try{closeDeliver();}catch(e){}
 setMenuActive(null);
 placeComposer(false);document.body.dataset.stage='account';
 scroll.innerHTML='';
 var meta={profile:['账号管理','管理头像、店铺资料、登录方式与账号安全。资料内测期保存在本机，正式版将同步到账号云端。'],
  quota:['会员状态','查看套餐、出图额度、内测权益与本机用量。内测阶段注册登录即可使用，不限出图数量。'],
  help:['帮助中心','常见问题、使用教程与反馈通道。遇到问题先看这里，也可以随时联系伙计团队。'],
  update:['版本更新','网页版自动保持最新，刷新即为最新版本；这里记录每次迭代带来的新能力。']}[tab];
 var v=document.createElement('div');v.className='view';v.id='accountView';
 var tabs='<div class="atabs">'+AC_TABS.map(function(t){return '<button class="atab'+(t.k===tab?' on':'')+'" data-atab="'+t.k+'">'+t.n+'</button>';}).join('')+'</div>';
 v.innerHTML='<div class="view-head"><div><div class="view-title">'+meta[0]+'</div><div class="view-sub">'+meta[1]+'</div></div><div class="view-actions">'+tabs+'</div></div>'
  +'<div class="apanel" id="acPanel">'+({profile:acPanelProfile,quota:acPanelQuota,help:acPanelHelp,update:acPanelUpdate}[tab])()+'</div>';
 scroll.appendChild(v);scrollBox.scrollTop=0;
 acBind(v);acFillKb();
}
function acFillKb(){var el=document.getElementById('acKbCount');if(!el)return;if(typeof kbAll!=='function'){el.textContent='—';return;}kbAll().then(function(a){el.textContent=(a?a.length:0)+' 份';}).catch(function(){el.textContent='—';});}
function acCompress(dataUrl,cb){var img=new Image();img.onload=function(){var sz=256,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;var ctx=cv.getContext('2d');var k=Math.min(img.width,img.height)||sz;ctx.drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,sz,sz);try{cb(cv.toDataURL('image/jpeg',.85));}catch(e){cb(dataUrl);}};img.onerror=function(){cb(dataUrl);};img.src=dataUrl;}
function acBind(v){
 v.addEventListener('click',function(e){
  var tb=e.target.closest('[data-atab]');if(tb){openAccountView(tb.getAttribute('data-atab'));return;}
  var go=e.target.closest('[data-acgo]');if(go){var g=go.getAttribute('data-acgo');
    if(g==='connect')openConnect();else if(g==='analytics')openAnalytics();else if(g==='home')goHome();
    else if(g==='logout'){if(window.HogeeMember){HogeeMember.logout();if(window.toast)toast('已退出登录');}goHome();}
    return;}
  if(e.target.closest('#acReload')){location.href=location.pathname+'?cb='+Date.now();return;}
  if(e.target.closest('#acClear')){if(window.confirm('将清除本机的作品、辅助发布记录与账号连接登记，不影响登录和基本资料，且不可恢复。确定清除吗？')){['hogee_works','hogee_publish','hogee_connections','hogee_kb_text','hogee_gen_count'].forEach(function(k){try{localStorage.removeItem(k);}catch(x){}});try{if(typeof HGIDB!=='undefined')HGIDB.clear();}catch(x){}if(window.toast)toast('本机作品与记录已清除');openAccountView('profile');}return;}
 });
 var up=v.querySelector('#acAvaUp'),rm=v.querySelector('#acAvaRm'),save=v.querySelector('#acSave');
 if(up){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';v.appendChild(inp);
  inp.addEventListener('change',function(){var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){acCompress(rd.result,function(d){var el=v.querySelector('#acAva');if(el){el.innerHTML='<img src="'+d+'" alt="头像">';el.setAttribute('data-new',d);el.removeAttribute('data-rm');}});};rd.readAsDataURL(f);});
  up.addEventListener('click',function(){inp.click();});}
 if(rm)rm.addEventListener('click',function(){var el=v.querySelector('#acAva');if(el){el.removeAttribute('data-new');el.setAttribute('data-rm','1');el.textContent=acInitial();}});
 if(save)save.addEventListener('click',function(){
  var prof={contactName:(v.querySelector('#acContact')||{}).value?(v.querySelector('#acContact').value.trim()):'',merchantName:(v.querySelector('#acMerchant')||{}).value?v.querySelector('#acMerchant').value.trim():'',industry:(v.querySelector('#acIndustry')||{}).value?v.querySelector('#acIndustry').value:'通用电商',avatar:acProf().avatar||''};
  var ae=v.querySelector('#acAva');
  if(ae&&ae.getAttribute('data-new'))prof.avatar=ae.getAttribute('data-new');
  else if(ae&&ae.hasAttribute('data-rm'))prof.avatar='';
  try{localStorage.setItem('hogee_profile',JSON.stringify(prof));}catch(e){}
  if(window.HG_renderAccount)HG_renderAccount();if(window.toast)toast('资料已保存在本机');openAccountView('profile');
 });
}

 try{

var KB_DB='hogee-kb',KB_STORE='docs';
function kbOpenDB(){return new Promise(function(res,rej){try{var r=indexedDB.open(KB_DB,1);r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains(KB_STORE))db.createObjectStore(KB_STORE,{keyPath:'id'});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function kbTx(mode,fn){return kbOpenDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(KB_STORE,mode);fn(tx.objectStore(KB_STORE));tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};});});}
function kbPut(rec){return kbTx('readwrite',function(st){st.put(rec);});}
function kbDel(id){return kbTx('readwrite',function(st){st.delete(id);});}
function kbAll(){return kbOpenDB().then(function(db){return new Promise(function(res,rej){var rq=db.transaction(KB_STORE).objectStore(KB_STORE).getAll();rq.onsuccess=function(){res((rq.result||[]).sort(function(a,b){return b.ts-a.ts;}));};rq.onerror=function(){rej(rq.error);};});}).catch(function(){return [];});}
function kbExt(name){var m=/\.([a-z0-9]+)$/i.exec(name||'');return m?m[1].toLowerCase():'';}
function kbTextExt(ext){return ['txt','md','markdown','csv','json','log','text'].indexOf(ext)>=0;}
function kbFmtSize(n){n=n||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function kbIcon(ext){var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';if(/jpg|jpeg|png|webp|gif|bmp|svg/.test(ext))return s+'<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="1.7"/><path d="m21 15-4.5-4.5L7 21"/></svg>';if(/mp4|mov|avi|mkv|webm/.test(ext))return s+'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m10 9 5 3-5 3Z"/></svg>';if(/xls|xlsx|csv/.test(ext))return s+'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>';if(/ppt|pptx/.test(ext))return s+'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v3M8 20h8"/></svg>';return s+'<path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M8 13h8M8 17h6"/></svg>';}
function kbTrash(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';}

 }

   if(k==='studio')jobs.push({k:k,label:'摄影棚背景图',prompt:carAnchor+P_studio+extra,image:main});

    try{
     var url=await callGenerateRetry(jobs[i].prompt,jobs[i].image,genSize);
     if(token!==state.genToken)return;
     var __res={url:url,label:jobs[i].label,k:jobs[i].k,ts:Date.now()};state.results.push(__res);persistResult(__res,jobs[i].label);
     if(window.HG_bumpGen)window.HG_bumpGen();

     renderDeliver();scrollBottom();

     if(token!==state.genToken)return;
     if(row){$('.pt-state',row).textContent='失败';$('.pt-state',row).style.color='var(--bad)';}
     if(e&&typeof e.code==='string'&&e.code.indexOf('member')===0){toast(e.message,'err');return;}

    }
   }
   if(token===state.genToken)finishGenerate();
  })();
 };
 if(window.HogeeMember){HogeeMember.requireAuth().then(__go).catch(function(){});}else{__go();}
}

window.HogeeTyper=(function(){
 var inp=document.getElementById('composerInput'),si=0,ci=0,del=false,timer=null,key='host';
 function arr(){return CMP_PH[key]||CMP_PH.host;}
 function focused(){return document.activeElement===inp;}
 function tick(){
   if(!inp)return;
   if(focused()||inp.value){if(!inp.value)inp.placeholder=arr()[si%arr().length];return;}
   var a=arr(),s=a[si%a.length];
   if(!del){ci++;inp.placeholder=s.slice(0,ci);if(ci>=s.length){del=true;timer=setTimeout(tick,1700);return;}}
   else{ci--;inp.placeholder=s.slice(0,ci);if(ci<=0){del=false;si=(si+1)%a.length;timer=setTimeout(tick,340);return;}}
   timer=setTimeout(tick,del?26:54);
 }
 function start(){if(timer)clearTimeout(timer);ci=0;del=false;timer=setTimeout(tick,480);}
 function setTab(k){k=CMP_PH[k]?k:'host';var same=(k===key);key=k;si=0;
   if(!inp)return;
   if(focused()||inp.value){inp.placeholder=(CMP_PH[k]||CMP_PH.host)[0];}
   else if(!same||!timer){inp.placeholder='';start();}}
 if(inp){
  inp.addEventListener('blur',function(){if(!inp.value)start();});
  inp.addEventListener('focus',function(){if(!inp.value){if(timer)clearTimeout(timer);timer=null;inp.placeholder=arr()[si%arr().length];}});
 }
 return {setTab:setTab,start:start};
})();
