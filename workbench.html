<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkHogee 工作台 · 做生意，找伙计</title>
<meta name="description" content="WorkHogee 生意伙计工作台：拍几张手机图，阿图带你出商品图、场景图与图文，一次生成、多平台适配。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1917'/%3E%3Cpath d='M9 12h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z' fill='none' stroke='%23ea580c' stroke-width='2'/%3E%3Ccircle cx='16' cy='17.5' r='3.2' fill='none' stroke='%23ea580c' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --orange:#ea580c;--orange-deep:#c2410c;--orange-bg:#fff4ec;--orange-line:#fed7aa;
  --ink:#1c1917;--ink-soft:#44403c;--muted:#78716c;--faint:#a8a29e;
  --line:#e9e4db;--line2:#f0ece4;--bg:#faf9f7;--panel:#ffffff;--sand:#f5f3ef;
  --shadow:0 1px 2px rgba(28,25,23,.04),0 8px 28px -18px rgba(28,25,23,.18);
  --shadow-lg:0 24px 60px -28px rgba(28,25,23,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
.container{max-width:1240px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.container{padding:0 16px}}

/* ===== 顶部导航（与全站一致） ===== */
.nav{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;gap:18px}
.nav-logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.nav-logo svg{height:22px;width:auto;display:block}
.nav-tag{display:inline-flex;align-items:center;height:26px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-soft);white-space:nowrap;transition:border-color .25s,color .25s}
.nav-tag:hover{border-color:var(--orange);color:var(--orange-deep)}
@media(max-width:760px){.nav-tag{display:none}}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:10px}
.member-nav{display:flex;align-items:center;gap:10px}
.hm-btn{appearance:none;border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:700;transition:transform .15s,background .2s,color .2s,border-color .2s;white-space:nowrap}
.hm-btn-reg{background:var(--orange);color:#fff}
.hm-btn-reg:hover{background:var(--orange-deep);transform:translateY(-1px)}
.hm-btn-login{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.hm-btn-login:hover{border-color:var(--orange);color:var(--orange-deep)}
.nav-home{font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:9px;transition:color .2s}
.nav-home:hover{color:var(--orange-deep)}
@media(max-width:560px){.nav-home .nh-txt{display:none}}

/* ===== 应用布局 ===== */
.app{max-width:1240px;margin:0 auto;padding:22px 28px 8px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:920px){.app{grid-template-columns:1fr;padding:14px 14px 6px}}

/* 左栏 */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:sticky;top:86px}
@media(max-width:920px){.rail{display:none}}
.rail-id{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line2);border-radius:12px;background:var(--sand)}
.rail-avatar{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rail-id .ri-name{font-size:14px;font-weight:800;line-height:1.3}
.rail-id .ri-sub{font-size:11.5px;color:var(--muted);line-height:1.3}
.rail-change{margin-left:auto;appearance:none;background:none;border:0;color:var(--faint);padding:4px;border-radius:7px;display:flex}
.rail-change:hover{color:var(--orange-deep)}
.rail-btn{width:100%;margin-top:11px;appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.rail-btn:hover{border-color:var(--orange);color:var(--orange-deep)}
.rail-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.rail-btn.primary:hover{background:#000}
.rail-sep{height:1px;background:var(--line2);margin:15px 0}
.rail-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);margin-bottom:9px;text-transform:uppercase}
.rail-shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:30px}
.rail-shots .rs{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sand);border:1px solid var(--line2)}
.rail-shots .rs img{width:100%;height:100%;object-fit:cover}
.rail-empty{font-size:12px;color:var(--faint);grid-column:1/-1;padding:6px 2px}
.rail-link{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);padding:8px 9px;border-radius:9px;transition:.18s}
.rail-link:hover{background:var(--sand);color:var(--orange-deep)}
.rail-link svg{color:var(--muted)}

/* 对话区 */
.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:640px}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#fff,#fdfcfa)}
.ch-avatar{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-title{font-size:15px;font-weight:800}
.ch-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ch-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.chat-scroll{flex:1;overflow-y:auto;padding:24px 20px 12px;display:flex;flex-direction:column;gap:16px;min-height:440px;max-height:calc(100vh - 300px)}
@media(max-width:920px){.chat-scroll{max-height:calc(100vh - 268px);min-height:420px}}
.msg{display:flex;gap:11px;max-width:100%;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.m-avatar{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.msg.user .m-avatar{background:var(--orange);color:#fff}
.m-body{min-width:0;max-width:78%}
.bubble{padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.bot .bubble{background:var(--sand);border:1px solid var(--line2);border-top-left-radius:5px;color:var(--ink)}
.msg.user .bubble{background:var(--orange);color:#fff;border-top-right-radius:5px}
.m-card{width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:640px){.m-body{max-width:92%}}

/* 卡片通用 */
.card-pad{padding:16px 17px}
.card-title{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-desc{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:13px}
.chip-grid{display:flex;flex-wrap:wrap;gap:9px}
.chip{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;transition:.18s;text-align:left}
.chip:hover{border-color:var(--orange);color:var(--orange-deep);transform:translateY(-1px)}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chip.on .chip-sub{color:#ffe4d2}
.chip .chip-ico{color:var(--orange-deep);display:flex}
.chip.on .chip-ico{color:#fff}
.chip-sub{font-size:11px;color:var(--muted);font-weight:500}
.chip-block{margin-bottom:15px}
.chip-block:last-child{margin-bottom:0}
.cb-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.cb-label .opt{font-weight:500;color:var(--faint);font-size:11px}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
.btn{appearance:none;border:0;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;border:1.5px solid transparent;white-space:nowrap}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-deep);transform:translateY(-1px)}
.btn-primary:disabled{background:#d6d3d1;cursor:not-allowed;transform:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange-deep)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
/* 让图动起来 */
.dyn-box{margin-top:14px;border:1px solid var(--orange-line);background:linear-gradient(180deg,#fffaf6,#fff);border-radius:14px;padding:13px 14px}
.dyn-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--ink);flex-wrap:wrap}
.dyn-head .dh-ico{color:var(--orange-deep);display:flex}
.dyn-head .dh-sub{font-weight:500;font-size:11.5px;color:var(--muted)}
.dyn-actions{display:flex;flex-wrap:wrap;gap:9px;margin:11px 0 6px}
.dyn-btn{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:.18s}
.dyn-btn:hover{border-color:var(--orange);color:var(--orange-deep);transform:translateY(-1px)}
.dyn-btn:disabled{opacity:.62;cursor:wait;transform:none}
.dyn-btn svg{color:var(--orange-deep)}
.dyn-hint{font-size:11.5px;color:var(--faint);line-height:1.55}
.dyn-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:12px}
.dyn-item{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.dyn-item .di-view{background:var(--sand);aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dyn-item .di-view img{width:100%;height:100%;object-fit:contain}
.dyn-item .di-nine{display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:1;background:#fff}
.dyn-item .di-nine img{width:100%;height:100%;object-fit:cover}
.dyn-item .di-meta{padding:7px 9px 4px;font-size:11px;color:var(--muted);line-height:1.45}
.dyn-item .di-name{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:1px}
.dyn-item .di-btns{display:flex;gap:6px;padding:4px 9px 10px}
.di-btn{flex:1;appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
.di-btn:hover{border-color:var(--orange);color:var(--orange-deep)}
.di-btn svg{color:var(--orange-deep)}

/* 上传 */
.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--sand);padding:26px 18px;text-align:center;transition:.2s;cursor:pointer}
.drop:hover,.drop.drag{border-color:var(--orange);background:var(--orange-bg)}
.drop-ico{width:46px;height:46px;margin:0 auto 10px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--orange-deep);display:flex;align-items:center;justify-content:center}
.drop h4{font-size:14.5px;font-weight:800;margin-bottom:4px}
.drop p{font-size:12px;color:var(--muted)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-top:13px}
.shot{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line2);background:#fff}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .q{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;backdrop-filter:blur(3px)}
.q.ok{background:rgba(34,197,94,.85);color:#fff}
.q.warn{background:rgba(234,88,12,.9);color:#fff}
.q.bad{background:rgba(220,38,38,.9);color:#fff}
.shot .del{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(28,25,23,.6);color:#fff;font-size:12px;line-height:1;display:none;align-items:center;justify-content:center}
.shot:hover .del{display:flex}
.tip-line{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-soft);background:var(--orange-bg);border:1px solid var(--orange-line);border-radius:11px;padding:10px 12px;margin-top:12px;line-height:1.6}
.tip-line svg{color:var(--orange-deep);flex-shrink:0;margin-top:2px}

/* 表单 */
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.fld input,.fld select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:#fcfbf9;color:var(--ink);font-family:inherit;transition:border-color .2s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--orange);background:#fff}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brand-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.brand-quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-soft);transition:.15s}
.brand-quick button:hover{border-color:var(--orange);color:var(--orange-deep)}

/* 进度 */
.prog-task{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line2)}
.prog-task:last-child{border-bottom:0}
.pt-ico{width:30px;height:30px;border-radius:9px;background:var(--sand);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog-task.done .pt-ico{background:#ecfdf5;color:#16a34a}
.prog-task.run .pt-ico{background:var(--orange-bg);color:var(--orange-deep)}
.pt-name{font-size:13.5px;font-weight:700}
.pt-sub{font-size:11.5px;color:var(--muted)}
.pt-state{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.prog-task.done .pt-state{color:#16a34a}
.prog-task.run .pt-state{color:var(--orange-deep)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 结果 */
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.res{border:1px solid var(--line2);border-radius:13px;overflow:hidden;background:#fff;transition:.2s}
.res:hover{border-color:var(--orange-line);box-shadow:var(--shadow)}
.res-img{position:relative;aspect-ratio:1;background:var(--sand);cursor:zoom-in}
.res-img img{width:100%;height:100%;object-fit:cover}
.res-tag{position:absolute;left:7px;top:7px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(28,25,23,.62);padding:3px 9px;border-radius:999px;backdrop-filter:blur(3px)}
.res-ai{position:absolute;right:7px;bottom:7px;font-size:9.5px;font-weight:600;color:#fff;background:rgba(28,25,23,.5);padding:2px 7px;border-radius:5px}
.res-meta{padding:9px 10px}
.res-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-acts{display:flex;gap:6px;margin-top:7px}
.res-acts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
.res-acts button:hover{border-color:var(--orange);color:var(--orange-deep)}
.copy-box{margin-top:15px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.copy-head{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--sand);font-size:13px;font-weight:800}
.copy-head button{margin-left:auto}
.copy-box textarea{width:100%;border:0;resize:vertical;min-height:120px;padding:12px 13px;font-size:13px;line-height:1.75;color:var(--ink-soft);font-family:inherit;background:#fcfbf9}
.copy-box textarea:focus{outline:none}
.copy-chans{display:flex;flex-wrap:wrap;gap:7px;padding:9px 11px 2px}
.copy-chan{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;transition:.16s}
.copy-chan:hover{border-color:var(--orange);color:var(--orange-deep)}
.copy-chan.on{background:var(--ink);border-color:var(--ink);color:#fff}
.copy-warn{display:none;margin:9px 11px 0;padding:8px 11px;border-radius:9px;background:var(--orange-bg);border:1px solid var(--orange-line);color:var(--orange-deep);font-size:11.5px;line-height:1.55}
.copy-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px 9px}
.copy-ok{font-size:11px;color:#16a34a}
.copy-box textarea{min-height:108px}
.reach-box{margin-top:15px;border:1px solid var(--line2);border-radius:12px;padding:13px}
.reach-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;flex-wrap:wrap}
.reach-head>svg{color:var(--orange);flex-shrink:0}
.rh-sub{font-weight:600;font-size:11px;color:var(--faint)}
.reach-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.reach-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:700;transition:.16s;cursor:pointer}
.reach-btn svg{color:var(--faint);transition:.16s}
.reach-btn:hover{border-color:var(--orange);color:var(--orange-deep);transform:translateY(-1px)}
.reach-btn:hover svg{color:var(--orange)}
.reach-tip{margin-top:11px;font-size:11px;color:var(--faint);line-height:1.6}
.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.7;background:#fcfbf9;color:var(--ink);font-family:inherit;resize:vertical}
.fld textarea:focus{outline:none;border-color:var(--orange);background:#fff}
.pub-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:12px}
.pub-thumb{aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:var(--sand)}
.pub-thumb img{width:100%;height:100%;object-fit:cover}
.pub-result{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:14px}
.qrbox{width:168px;height:168px;flex-shrink:0;border:1px solid var(--line2);border-radius:14px;padding:11px;background:#fff}
.qrbox svg{width:100%;height:100%;display:block}
.pub-info{flex:1;min-width:240px}
.pub-cover{width:100%;max-width:300px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line2);margin-bottom:10px}
.pub-cover img{width:100%;height:100%;object-fit:cover}
.pub-info label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:6px 0}
.pub-link{display:flex;gap:8px;align-items:center}
.pub-link input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;background:#fcfbf9;color:var(--ink-soft)}
.pub-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pub-more{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line2);font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.pub-more select{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fcfbf9;font-family:inherit}
.compliance{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--muted);background:var(--sand);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.6}
.compliance svg{color:var(--ink-soft);flex-shrink:0;margin-top:1px}

/* 输入栏 */
.composer{border-top:1px solid var(--line2);padding:13px 16px;background:linear-gradient(0deg,#fff,#fdfcfa)}
.composer-row{display:flex;align-items:flex-end;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:8px 8px 8px 10px;transition:border-color .2s,box-shadow .2s}
.composer-row:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-bg)}
.c-up{appearance:none;border:0;background:var(--sand);color:var(--ink-soft);width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s}
.c-up:hover{background:var(--orange-bg);color:var(--orange-deep)}
.c-input{flex:1;min-width:0;width:100%;border:0;resize:none;max-height:120px;min-height:24px;padding:9px 4px;font-size:16px;font-family:inherit;line-height:1.5;background:transparent;color:var(--ink)}
@media(max-width:640px){.c-input{font-size:16px}.composer{padding:11px 12px}.composer-row{gap:8px;padding:7px}.composer-hint{font-size:10.5px}}
.c-input:focus{outline:none}
.c-send{appearance:none;border:0;background:var(--orange);color:#fff;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.18s}
.c-send:hover{background:var(--orange-deep)}
.composer-hint{font-size:11px;color:var(--faint);margin:8px 4px 0;text-align:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(28,25,23,.86);display:none;align-items:center;justify-content:center;padding:30px;animation:fade .2s}
.lb.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:92vw;max-height:86vh;border-radius:12px;box-shadow:var(--shadow-lg)}
.lb-close{position:absolute;top:22px;right:26px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.lb-close:hover{background:rgba(255,255,255,.24)}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:210;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#b91c1c}

.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ===== 页脚（与全站一致 · 深色） ===== */
.footer{background:#100d0a;margin-top:26px;color:rgba(255,255,255,.7)}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:30px;padding:46px 0 34px}
@media(max-width:820px){.footer-grid{grid-template-columns:1fr 1fr;gap:26px}}
.fb-logo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.footer-col h5{font-size:13px;font-weight:800;margin-bottom:14px;color:#fff}
.footer-col ul{list-style:none}
.footer-col li{margin-bottom:9px}
.footer-col a{font-size:13px;color:rgba(255,255,255,.6);transition:color .2s}
.footer-col a:hover{color:#fb923c}
.foot-tag{height:24px;padding:0 11px;font-size:11.5px;border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.78);background:transparent}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.43)}
.footer-links{display:flex;gap:18px}
.footer-links a{color:rgba(255,255,255,.55)}
.footer-links a:hover{color:#fb923c}
</style>

/* ---------- 图片处理 ---------- */
function fileToDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}
function loadImage(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function prepareImage(file){
 return fileToDataURL(file).then(function(src){
  var p=window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return loadImage(src);}):loadImage(src);
  return p.then(function(img){
   var max=2048,w=img.width,h=img.height;
   if(Math.max(w,h)>max){var r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
   var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
   x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   try{img.close&&img.close();}catch(e){}
   return c.toDataURL('image/jpeg',.92);
  });
 });
}
function analyzeImage(dataUrl){
 return loadImage(dataUrl).then(function(img){
  var max=480,sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(8,Math.round(img.width*sc)),h=Math.max(8,Math.round(img.height*sc));
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  var d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h),bright=0;
  for(var i=0,j=0;i<d.length;i+=4,j++){var v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;bright+=v;}
  bright/=(w*h);var mean=0,n=0,lap=[];
  for(var y=1;y<h-1;y++)for(var xx=1;xx<w-1;xx++){var idx=y*w+xx,vv=4*g[idx]-g[idx-w]-g[idx+w]-g[idx-1]-g[idx+1];lap.push(vv);mean+=vv;n++;}
  mean/=n;var va=0;for(var k=0;k<lap.length;k++)va+=(lap[k]-mean)*(lap[k]-mean);va/=n;
  var sharp=va<55?'bad':(va<150?'warn':'ok');
  var exp=bright<48?'bad':(bright>212?'bad':(bright<72||bright>192?'warn':'ok'));
  return {sharp:sharp,exp:exp};
 });
}
function authHeaders(){return (window.HogeeMember&&HogeeMember.authHeaders)?HogeeMember.authHeaders():{};}
function callGenerate(prompt,imagePayload,size){
 var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort();},110000);
 return fetch(API+'/generate',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),signal:ctrl.signal,
  body:JSON.stringify({prompt:prompt,image:imagePayload,size:size||'2048x2048'})})
 .then(function(resp){clearTimeout(timer);return resp.json().catch(function(){return null;}).then(function(j){
  if(resp.ok&&j&&j.ok&&j.b64)return 'data:image/jpeg;base64,'+j.b64;
  var code=j&&j.error&&j.error.code,msg=j&&j.error&&j.error.message;
  if(resp.status===401||(code&&code.indexOf('member')===0)){
   if(code!=='member_suspended'&&window.HogeeMember&&HogeeMember.logout)HogeeMember.logout();
   var e=new Error(code==='member_suspended'?(msg||'账号已停用，请联系客服'):'登录已失效，请重新登录后再生成');e.code=code||'member_unauthorized';throw e;
  }
  if(code==='rate_limited'){var re=new Error(msg||'生成过于频繁，请稍后再试');re.code='rate_limited';throw re;}
  throw new Error(msg||('图像服务返回 '+resp.status));
 });}).catch(function(e){clearTimeout(timer);throw e;});
}
function callGenerateRetry(prompt,imagePayload,size,onTick){
 function attempt(n){return callGenerate(prompt,imagePayload,size).catch(function(e){
  if(e&&typeof e.code==='string'&&e.code.indexOf('member')===0)throw e;
  if(e&&e.code==='rate_limited')return sleep(2600).then(function(){return attempt(n);});
  if(n>=2)throw e;return sleep(1300).then(function(){onTick&&onTick();return attempt(n+1);});
 });}
 return attempt(1);
}

function buildJobs(){
 var used=state.identity.type==='usedcar',jobs=[];
 var main=state.images[0].dataUrl;
 var extra=state.extra?('；额外要求：'+state.extra.slice(0,120)):'';
 state.outputs.forEach(function(k){

   if(k==='showroom')jobs.push({k:k,label:'AI 展厅背景图',prompt:P_showroom+extra,image:main});
   if(k==='studio')jobs.push({k:k,label:'摄影棚背景图',prompt:P_studio+extra,image:main});
   if(k==='onsite'&&state.bgImage)jobs.push({k:k,label:'实地展厅合成图',prompt:P_onsite+extra,image:[main,state.bgImage]});

var DYN_EDGE=440;
function dynTick(){return new Promise(function(r){setTimeout(r,0);});}
function dynRatio(){var s=SIZES.filter(function(x){return state.sizes.has(x.k);})[0]||SIZES[0];return s.w/s.h;}
function dynSize(ratio,edge){return ratio>=1?{w:edge,h:Math.max(8,Math.round(edge/ratio))}:{h:edge,w:Math.max(8,Math.round(edge*ratio))};}
function dynPaint(x,img,w,h,scale,px,py){x.fillStyle='#fff';x.fillRect(0,0,w,h);var ir=img.width/img.height,tr=w/h,bw,bh;if(ir>tr){bh=h;bw=h*ir;}else{bw=w;bh=w/ir;}bw*=scale;bh*=scale;var ox=(bw-w)/2,oy=(bh-h)/2;x.drawImage(img,(w-bw)/2+px*ox,(h-bh)/2+py*oy,bw,bh);}
function dynFrame(img,w,h,scale,px,py,delay,newPal){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');dynPaint(x,img,w,h,scale,px,py);return {data:x.getImageData(0,0,w,h).data,delay:delay,newPalette:!!newPal};}
function dynEase(t){return t*t*(3-2*t);}
async function dynBuildGif(frames,w,h,onProg){var gif=HGif.GIFEncoder(),palette=null;for(var i=0;i<frames.length;i++){if(frames[i].newPalette||!palette){palette=HGif.quantize(frames[i].data,256,{format:'rgb444'});}var idx=HGif.applyPalette(frames[i].data,palette,'rgb444');gif.writeFrame(idx,w,h,{palette:palette,delay:frames[i].delay,dispose:2});if(onProg)onProg(i+1,frames.length);await dynTick();}gif.finish();var b=gif.bytes();return new Blob([b],{type:'image/gif'});}
async function dynKen(img,ratio,setP){var z=dynSize(ratio,DYN_EDGE),N=22,fr=[];for(var i=0;i<N;i++){var ph=i/(N-1),k=ph<.5?ph*2:(1-ph)*2,e=dynEase(k);fr.push(dynFrame(img,z.w,z.h,1+0.10*e,-0.7+1.4*e,-0.5+1.0*e,70,i===0));if(i%4===0)setP(i+1,N);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:N};}
async function dynShow(imgs,ratio,setP){var z=dynSize(ratio,DYN_EDGE),fr=[],per=7,n=0;for(var g=0;g<imgs.length;g++){for(var f=0;f<per;f++){var e=f/(per-1);fr.push(dynFrame(imgs[g],z.w,z.h,1+0.06*e,0,0,110,f===0));n++;setP(n,imgs.length*per);}}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:n};}
async function dynSpin(imgs,setP){var z=dynSize(1,DYN_EDGE),fr=[];for(var g=0;g<imgs.length;g++){for(var f=0;f<2;f++){fr.push(dynFrame(imgs[g],z.w,z.h,1.08,0,0,95,f===0));}setP(g+1,imgs.length);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:fr.length};}

function exportRatio(url,w,h,mode,fmt){
 return loadImage(url).then(function(img){
  var base=state.quality==='hd'?2048:1600;
  var cw,ch;
  if(w>=h){cw=base;ch=Math.round(base*h/w);}else{ch=base;cw=Math.round(base*w/h);}
  var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
  var ir=img.width/img.height,tr=cw/ch;
  if(mode==='cover'){
   var sw,sh,sx,sy;
   if(ir>tr){sh=img.height;sw=img.height*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=img.width/tr;sx=0;sy=(img.height-sh)/2;}
   x.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
  }else{
   var dw,dh;if(ir>tr){dw=cw;dh=cw/ir;}else{dh=ch;dw=ch*ir;}
   x.drawImage(img,(cw-dw)/2,(ch-dh)/2,dw,dh);
  }
  return fmt==='png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',state.quality==='hd'?.96:.9);
 });
}
function modeFor(k){return (k==='white')?'contain':'cover';}
function downloadDataUrl(dataUrl,filename){
 var a=document.createElement('a');a.href=dataUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
function safeName(s){return String(s).replace(/[\\/:*?"<>|\s]+/g,'_');}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function packAll(){
 if(window.HogeeMember){try{await HogeeMember.requireAuth();}catch(e){return;}}
 if(!state.results.length)return;
 toast('正在按尺寸导出…');
 var JSZip=window.JSZip;
 if(!JSZip){try{await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');JSZip=window.JSZip;}catch(e){JSZip=null;}}
 var sizeList=SIZES.filter(function(s){return state.sizes.has(s.k);});
 var stamp=new Date().toISOString().slice(0,10);
 if(JSZip){
  var zip=new JSZip();
  for(var i=0;i<state.results.length;i++){
   var r=state.results[i];
   for(var j=0;j<sizeList.length;j++){var s=sizeList[j];
    var du=await exportRatio(r.url,s.w,s.h,modeFor(r.k),state.fmt);
    zip.file(safeName(r.label)+'_'+s.k+'.'+state.fmt,du.split(',')[1],{base64:true});
   }
  }
  state.dyn.forEach(function(d){zip.folder('动图GIF').file(d.name,d.blob);});
  if(state.dynGrid){var gf=zip.folder('九宫格');state.dynGrid.items.forEach(function(u,i){gf.file('九宫格_'+String(i+1).padStart(2,'0')+'.jpg',u.split(',')[1],{base64:true});});}
  zip.file('配套文案.txt',$('#copyText')?$('#copyText').value:buildCopy());
  var blob=await zip.generateAsync({type:'blob'});
  var url=URL.createObjectURL(blob);downloadDataUrl(url,'WorkHogee_'+stamp+'.zip');setTimeout(function(){URL.revokeObjectURL(url);},4000);
  toast('打包好了，已开始下载');
 }else{
  for(var a=0;a<state.results.length;a++){var rr=state.results[a],ss=sizeList[0];
   var d=await exportRatio(rr.url,ss.w,ss.h,modeFor(rr.k),state.fmt);
   downloadDataUrl(d,safeName(rr.label)+'_'+ss.k+'.'+state.fmt);await sleep(400);
  }
  toast('已逐张下载（ZIP 组件未加载）');
 }
}

  var w=img.width,h=img.height,scale=Math.min(1,max/Math.max(w,h));
  var cw=Math.round(w*scale),ch=Math.round(h*scale);
  var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');
  x.drawImage(img,0,0,cw,ch);

document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-act]');if(!b)return;
 var act=b.dataset.act;
 if(act==='pickId'){setIdentity({type:b.dataset.type,cat:b.dataset.cat||'',label:b.dataset.label},b.dataset.label);}
 else if(act==='customId'){
  b.closest('.m-card').remove();
  botSay('行，你直接在下面输入框打出来，比如「卖手工皮具」「开花店的」，我就明白了。');
  state.stage='awaitCustomId';
 }
 else if(act==='changeId'){state.identity=null;try{localStorage.removeItem('hogee_identity');}catch(e){}userSay('换个行当');start();}
 else if(act==='resumeId'){userSay('对，开始传图');
  if(state.identity.type==='usedcar')botSay('好嘞，围着车拍一圈传上来，第一张左前 45° 整车图。');
  else botSay('好嘞，把商品拍几张传上来，第一张拍清整体。');
  renderUploadCard();state.stage='upload';}
 else if(act==='chooseFile'){$('#fileInput').click();}
 else if(act==='chooseBg'){$('#bgInput').click();}
 else if(act==='delShot'){var di=+b.dataset.i;state.images.splice(di,1);refreshShots();}
 else if(act==='toConfirm'){if(!state.images.length){toast('先传至少一张图','err');return;}userSay('传好了，共 '+state.images.length+' 张');var st=botTyping();setTimeout(function(){st();renderConfirmCard();},450);}
 else if(act==='backUpload'){renderUploadCard();state.stage='upload';refreshShots();}
 else if(act==='fillBrand'){$('#carBrand').value=b.dataset.b;}
 else if(act==='confirmProduct'){
  var used=state.identity.type==='usedcar';
  if(used){
   var brand=$('#carBrand').value.trim(),series=$('#carSeries').value.trim();
   if(!brand||!series){toast('品牌和车系至少填一下，阿图才认得准','err');return;}
   state.product={brand:brand,series:series,year:$('#carYear').value.trim(),trim:$('#carTrim').value.trim(),name:[$('#carYear').value.trim(),brand,series].filter(Boolean).join(' ')};
  }else{
   var nm=$('#productName').value.trim();
   if(!nm){toast('写一下商品名称，阿图才好出图','err');return;}
   state.product.name=nm;
  }
  state.extra=$('#extraInstr')?$('#extraInstr').value.trim():'';
  userSay(state.product.name);
  botSay('认下了：<b>'+esc(state.product.name||state.identity.label)+'</b>。下面挑这单要出哪些图。');
  renderOutputsCard();
 }
 else if(act==='toggleOutput'){
  var k=b.dataset.k;if(state.outputs.has(k)){if(state.outputs.size===1){toast('至少保留一种图');return;}state.outputs.delete(k);b.classList.remove('on');}else{state.outputs.add(k);b.classList.add('on');}
 }
 else if(act==='toScene'){
  var isUsed=state.identity.type==='usedcar';
  if(isUsed&&state.outputs.has('onsite')&&!state.bgImage){userSay('选了实地展厅');renderBgCard();}
  else if(!isUsed&&state.outputs.has('scene')){renderSceneCard();}
  else{renderSpecCard();}
 }
 else if(act==='pickScene'){state.scene=b.dataset.k;$$('[data-act="pickScene"]').forEach(function(c){c.classList.remove('on');});b.classList.add('on');}
 else if(act==='cancelOnsite'){state.outputs.delete('onsite');toast('已去掉实地展厅版');renderSpecCard();}
 else if(act==='toSpec'){
  if(state.stage==='bg'&&!state.bgImage){toast('先传一张展厅背景，或取消实地版','err');return;}
  renderSpecCard();
 }
 else if(act==='toggleSize'){var sk=b.dataset.k;if(state.sizes.has(sk)){if(state.sizes.size===1){toast('至少保留一个尺寸');return;}state.sizes.delete(sk);b.classList.remove('on');}else{state.sizes.add(sk);b.classList.add('on');}}
 else if(act==='pickFmt'){state.fmt=b.dataset.v;$$('[data-act="pickFmt"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.fmt);});}
 else if(act==='pickQuality'){state.quality=b.dataset.v;$$('[data-act="pickQuality"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.quality);});}
 else if(act==='startGen'){
  var summary=[];
  var outs=OUTPUTS[state.identity.type==='usedcar'?'usedcar':'general'];
  state.outputs.forEach(function(kk){var o=outs.filter(function(x){return x.k===kk;})[0];summary.push(o?o.t:kk);});
  userSay('开始出图：'+summary.join('、')+'，尺寸 '+Array.from(state.sizes).join('/'));
  var stopT=botTyping();setTimeout(function(){stopT();runGenerate();},450);
 }
 else if(act==='preview'){openLightbox(state.results[+b.dataset.i].url);}
 else if(act==='downloadOne'){var s0=SIZES.filter(function(s){return state.sizes.has(s.k);})[0];var rr=state.results[+b.dataset.i];
  exportRatio(rr.url,s0.w,s0.h,modeFor(rr.k),state.fmt).then(function(d){downloadDataUrl(d,safeName(rr.label)+'_'+s0.k+'.'+state.fmt);toast('已下载 '+s0.label);});}
 else if(act==='redo'){redoOne(+b.dataset.i);}
 else if(act==='pack'){packAll();}
 else if(act==='copyText'){var ta=$('#copyText');if(ta){ta.select();try{document.execCommand('copy');toast('文案已复制');}catch(e){toast('复制失败，可手动选择');}}}
 else if(act==='copyChan'){state.copyChannel=b.dataset.v;var cps0=state._cps||buildCopies();var ta0=$('#copyText');if(ta0)ta0.value=cps0[state.copyChannel]||cps0.general;$$('.copy-chan').forEach(function(x){x.classList.toggle('on',x.dataset.v===state.copyChannel);});refreshCopyScan();}
 else if(act==='copyClean'){var tac=$('#copyText');if(tac){var rr=cleanBanned(tac.value);tac.value=rr.text;refreshCopyScan();toast(rr.removed.length?('已净化 '+rr.removed.length+' 处绝对化词，请通读'):'未发现需净化词');}}
 else if(act==='reach'){
  var pf=b.dataset.p,x2=REACH_PLATFORMS.filter(function(y){return y.p===pf;})[0];
  if(!x2)return;
  var cps2=state._cps||buildCopies(),txt2=cps2[x2.ch]||cps2.general;
  copyPlain(txt2);
  if(x2.url){try{window.open(x2.url,'_blank','noopener');}catch(e){}toast(x2.name+'：文案已复制，打开发布页粘贴，图片传素材包');}
  else{toast(x2.name+'：文案已复制，请用手机微信发布（可用画册把图发到手机）');}
 }
 else if(act==='dynKen'){dynMake('ken',b);}
 else if(act==='dynShow'){dynMake('show',b);}
 else if(act==='dynSpin'){dynMake('spin',b);}
 else if(act==='dynGrid'){dynMake('grid',b);}
 else if(act==='dlDyn'){var dd=state.dyn[+b.dataset.i];if(dd){downloadDataUrl(dd.url,dd.name);toast('已下载 '+dd.name);}}
 else if(act==='dlGrid'){dlGridZip();}
 else if(act==='newOrder'){newOrder();}
 else if(act==='moreScene'){state.results=[];renderOutputsCard();}
 else if(act==='publishShowcase'){if(!state.results||!state.results.length){toast('先出图才能做画册','err');return;}userSay('做个分享画册');renderPublishCard();}
 else if(act==='backPublish'){var pc=$('#publishCard');if(pc){var mm=pc.closest('.msg');if(mm)mm.remove();}}
 else if(act==='doPublish'){doPublish();}
 else if(act==='dlQr'){downloadQr();}
 else if(act==='copyShowLink'){copyShowLink();}
 else if(act==='addChannelDo'){addChannel();}
});

/* 上传 input */
$('#fileInput').addEventListener('change',function(e){handleFiles(e.target.files);e.target.value='';});
$('#bgInput').addEventListener('change',function(e){handleBg(e.target.files);e.target.value='';});
function handleBg(files){
 var f=files[0];if(!f||!/^image\//.test(f.type))return;
 var stop=botTyping();
 prepareImage(f).then(function(d){stop();state.bgImage=d;
  var pv=$('#bgPreview');if(pv)pv.innerHTML='<div class="shot" style="max-width:240px;aspect-ratio:4/3"><img src="'+d+'" alt="展厅背景"></div>';
  var btn=$('#bgReady');if(btn)btn.disabled=false;
  toast('展厅背景已收到');});
}
/* 拖拽（卡片动态插入，捕获阶段代理） */
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('#drop,#bgDrop');if(d){e.preventDefault();d.classList.add('drag');}},true);
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('#drop,#bgDrop');if(d)d.classList.remove('drag');},true);
document.addEventListener('drop',function(e){
 var d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('drag');handleFiles(e.dataTransfer.files);}
 var bd=e.target.closest&&e.target.closest('#bgDrop');if(bd){e.preventDefault();bd.classList.remove('drag');handleBg(e.dataTransfer.files);}
},true);

/* 顶部上传按钮 */
$('#btnUpload').addEventListener('click',function(){
 if(!state.identity){toast('先告诉阿图你做什么生意');return;}
 if(state.stage==='welcome'){setIdentity(state.identity);setTimeout(function(){$('#fileInput').click();},300);return;}
 $('#fileInput').click();
});

/* 自由输入 */
function sendFreeText(){
 var inp=$('#composerInput'),txt=inp.value.trim();if(!txt)return;inp.value='';inp.style.height='auto';
 userSay(txt);
 if(state.stage==='welcome'||state.stage==='awaitCustomId'){
  setIdentity({type:'general',cat:'',label:txt},txt);
 }else if(state.stage==='confirm'){
  if(state.identity.type==='usedcar'){var cb=$('#carBrand');if(cb&&!cb.value)cb.value=txt;}
  else{var pn=$('#productName');if(pn&&!pn.value)pn.value=txt;}
  botSay('记下了：'+esc(txt)+'。确认无误就点卡片里的按钮。');
 }else{
  state.extra=(state.extra?state.extra+'；':'')+txt;
  botSay('收到，'+esc(txt)+'。我会在出图时按这个来。');
 }
}
$('#btnSend').addEventListener('click',sendFreeText);
$('#composerInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFreeText();}});
$('#composerInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});

/* 新的一单 */
function newOrder(){
 var id=state.identity;state=resetState();state.identity=id;updateRail();
 userSay('再来一单');
 botSay('好嘞，新的一单。把这一件货的图传上来，第一张拍清整体。');
 renderUploadCard();state.stage='upload';
}
$('#railNew').addEventListener('click',function(){
 if(!state.identity){toast('先选一下你做什么生意');return;}
 if(state.stage==='welcome'){setIdentity(state.identity);return;}
 newOrder();
});
$('#railChange').addEventListener('click',function(){state.identity=null;try{localStorage.removeItem('hogee_identity');}catch(e){}start();});

/* lightbox */
function openLightbox(src){$('#lbImg').src=src;$('#lightbox').classList.add('show');}
function closeLightbox(){$('#lightbox').classList.remove('show');$('#lbImg').src='';}
$('#lbClose').addEventListener('click',closeLightbox);
$('#lightbox').addEventListener('click',function(e){if(e.target.id==='lightbox')closeLightbox();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});

start();
})();
</script>
</body>
</html>
