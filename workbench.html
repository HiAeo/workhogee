<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkHogee · 生意伙计工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231c1917'/%3E%3Cpath d='M7 7h2.4v3.4h3.2V7H15v10h-2.4v-4.2H9.4V17H7z' fill='%23fff'/%3E%3Cpath d='M16.4 7h.4c1.5 0 2.5.8 2.5 2.2 0 .9-.4 1.5-1.1 1.8.9.3 1.4 1 1.4 2 0 1.6-1.1 2.5-2.8 2.5h-.4zm2.2 2.3c0-.6-.4-1-1.1-1h-.7v2.1h.7c.7 0 1.1-.4 1.1-1.1zm.2 3.5c0-.7-.4-1.1-1.2-1.1h-.8v2.3h.8c.8 0 1.2-.5 1.2-1.2z' fill='%23fb923c'/%3E%3C/svg%3E">
<style>
/* ============================================================
   WorkHogee · 对话式 Agent 工作台（深色三列）
   ============================================================ */
:root{
  --bg:#15130f; --stage:#1a1815; --panel:#201d19; --panel2:#26231d; --elev:#2e2a23;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.05);
  --tx:rgba(255,255,255,.92); --tx2:rgba(255,255,255,.60); --tx3:rgba(255,255,255,.38);
  --orange:#fb923c; --orange-d:#ea580c; --orange-soft:rgba(251,146,60,.14);
  --atu:#fb923c; --awen:#60a5fa; --ashi:#ec407a; --afa:#4ade80; --agu:#c084fc; --host:#fb923c;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --rail:248px; --deliver:402px;
  --font:"Trebuchet MS","Trebuchet","Lucida Sans Unicode","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
::-webkit-scrollbar-track{background:transparent}
.wm{font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1;white-space:nowrap}
.wm b{color:#fff;font-weight:800}.wm i{color:var(--orange);font-style:normal;font-weight:800}
.app{display:grid;grid-template-columns:var(--rail) 1fr var(--deliver);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}

/* 左列 */
.rail{background:var(--bg);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.rail-brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
.rail-brand .wm{font-size:19px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--tx2);width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;transition:background .16s,color .16s;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--tx)}
.rail-scroll{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
.btn-new{width:100%;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:11px;padding:10px 12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;transition:.16s;margin-bottom:10px}
.btn-new:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.btn-new .pl{width:18px;height:18px;flex:none}
.rmenu{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.rmenu button{appearance:none;border:0;background:transparent;text-align:left;color:var(--tx2);font-size:13.5px;font-weight:600;border-radius:9px;padding:9px 10px;display:flex;align-items:center;gap:10px;transition:.15s}
.rmenu button svg{width:17px;height:17px;flex:none}
.rmenu button:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.rgroup{margin:14px 0 6px;font-size:11px;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase;padding:0 4px;font-weight:700}
.skill-now{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:12px;padding:11px 12px;cursor:pointer;transition:.16s}
.skill-now:hover{border-color:rgba(251,146,60,.5)}
.skill-now .sn-t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.skill-now .sn-d{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.45}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);flex:none}
.partner{display:flex;align-items:center;gap:10px;width:100%;appearance:none;border:0;background:transparent;border-radius:10px;padding:7px 8px;text-align:left;transition:.15s;position:relative;cursor:pointer}
.partner:hover{background:rgba(255,255,255,.05)}
.partner.active{background:var(--panel2)}
.partner.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--orange)}
.pavatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.06)}
.pavatar svg{width:17px;height:17px}
.p-atu .pavatar{background:rgba(251,146,60,.16)}.p-atu .pavatar svg{color:var(--atu)}.p-atu.active .pavatar{box-shadow:0 0 0 1.5px var(--atu)}
.bubble.welcome{font-size:15px;line-height:1.85;padding:16px 18px}
.tasklist{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.task-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.15s;position:relative}
.task-item:hover{background:rgba(255,255,255,.05)}
.task-item.active{background:var(--panel2)}
.task-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--orange)}
.task-item .tk-ico{width:15px;height:15px;flex:none;color:var(--tx3);display:flex}
.task-item .tk-ico svg{width:15px;height:15px}
.task-item.active .tk-ico{color:var(--orange)}
.task-item .tk-name{flex:1;min-width:0;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item.active .tk-name{color:var(--tx);font-weight:600}
.task-item .tk-pin{flex:none;color:var(--orange);display:flex}
.task-item .tk-pin svg{width:12px;height:12px}
.task-item .tk-acts{display:none;gap:1px;flex:none}
.task-item:hover .tk-acts{display:flex}
.task-item .tk-acts button{appearance:none;border:0;background:transparent;color:var(--tx3);width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.task-item .tk-acts button:hover{background:rgba(255,255,255,.09);color:var(--tx)}
.task-item .tk-acts button.danger:hover{color:#f87171}
.task-item .tk-acts svg{width:13px;height:13px}
.task-empty{font-size:11.5px;color:var(--tx3);padding:2px 8px 8px;line-height:1.55}
.cmp-quick{display:flex;gap:7px;overflow-x:auto;padding:0 1px 9px;scrollbar-width:none}
.cmp-quick::-webkit-scrollbar{display:none}
.cmp-quick button{appearance:none;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;cursor:pointer;font-family:inherit}
.cmp-quick button svg{width:14px;height:14px}
.cmp-quick button:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);transform:translateY(-1px)}
@media(max-width:560px){.cmp-quick button{font-size:12px;padding:6px 11px}.task-item .tk-name{font-size:12px}.bubble.welcome{font-size:14.5px}}
.p-awen .pavatar{background:rgba(96,165,250,.16)}.p-awen .pavatar svg{color:var(--awen)}.p-awen.active .pavatar{box-shadow:0 0 0 1.5px var(--awen)}
.p-afa .pavatar{background:rgba(74,222,128,.15)}.p-afa .pavatar svg{color:var(--afa)}.p-afa.active .pavatar{box-shadow:0 0 0 1.5px var(--afa)}
.p-agu .pavatar{background:rgba(192,132,252,.16)}.p-agu .pavatar svg{color:var(--agu)}.p-agu.active .pavatar{box-shadow:0 0 0 1.5px var(--agu)}
.p-ashi .pavatar{background:rgba(236,64,122,.16)}.p-ashi .pavatar svg{color:var(--ashi)}.p-ashi.active .pavatar{box-shadow:0 0 0 1.5px var(--ashi)}
.partner .pn{flex:1;min-width:0}
.partner .pn b{display:block;font-size:13px;font-weight:700;color:var(--tx)}
.partner .pn span{display:block;font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hire{width:30px;height:18px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:.18s;border:0;padding:0}
.hire::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s}
.hire.on{background:var(--orange-d)}.hire.on::after{left:14px}
.rail-foot{border-top:1px solid var(--line2);padding:12px}
.rail-foot .member-nav{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.rail-foot .hm-navbtn{width:100%;padding:10px 14px;text-align:center;font-size:13px}
.rail-foot .hm-navuser{max-width:none;justify-content:center;padding:9px 12px;font-size:12.5px;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.rail-foot .hm-navlogout{text-align:center;color:var(--tx2)}
.rail-foot .hm-navlogout:hover{color:var(--orange)}
.rail-ver{text-align:center;font-size:10.5px;color:var(--tx3);margin-top:9px;letter-spacing:.5px}

/* 中列 */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage);border-right:1px solid var(--line2)}
.topbar{height:54px;flex:none;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:11px;padding:0 16px;background:rgba(26,24,21,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.tb-task{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tb-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--orange-soft);flex:none}
.tb-avatar svg{width:18px;height:18px;color:var(--orange)}
.tb-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.tb-sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.skill-chip{font-size:11.5px;color:var(--orange);border:1px solid rgba(251,146,60,.4);background:var(--orange-soft);border-radius:999px;padding:5px 11px;white-space:nowrap;font-weight:600;cursor:pointer;transition:.16s}
.skill-chip:hover{background:rgba(251,146,60,.22)}
.btn-partner{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);border-radius:999px;font-size:12px;font-weight:600;padding:6px 11px;transition:.16s}
.btn-partner:hover{border-color:var(--orange);color:var(--orange)}
.only-mobile{display:none!important}
.chat{flex:1;min-height:0;overflow-y:auto;padding:26px 0 14px;scroll-behavior:smooth}
.chat-inner{max-width:880px;margin:0 auto;padding:0 22px}
.msg{display:flex;gap:11px;margin:18px 0;animation:msgIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg .m-avatar{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(251,146,60,.16);margin-top:2px}
.msg .m-avatar svg{width:17px;height:17px;color:var(--orange)}
.msg.user{flex-direction:row-reverse}
.msg.user .m-avatar{background:rgba(255,255,255,.08)}.msg.user .m-avatar svg{color:var(--tx2)}
.m-body{min-width:0;max-width:calc(100% - 50px)}
.bubble{display:inline-block;padding:11px 14px;border-radius:4px 14px 14px 14px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);font-size:13.8px;line-height:1.7}
.msg.user .bubble{background:var(--orange-d);border-color:transparent;color:#fff;border-radius:14px 4px 14px 14px}
.bubble b{color:var(--orange)}.msg.user .bubble b{color:#fff}
.typing{display:inline-flex;gap:4px;padding:3px 2}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 4px 43px}
.quick button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;transition:.16s;display:inline-flex;align-items:center;gap:7px}
.quick button svg{width:15px;height:15px}
.quick button:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);transform:translateY(-1px)}

/* 对话卡片 */
.m-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.card-pad{padding:17px 18px}
.card-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.card-title svg{width:17px;height:17px;color:var(--orange);flex:none}
.card-desc{font-size:12.8px;color:var(--tx2);line-height:1.65;margin-bottom:13px}
.card-desc b{color:var(--tx)}
.card-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.btn{appearance:none;border-radius:10px;font-size:13px;font-weight:700;padding:10px 16px;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;transition:.16s;line-height:1}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--orange-d);color:#fff;box-shadow:0 8px 22px rgba(234,88,12,.28)}
.btn-primary:hover{background:#c2410c;transform:translateY(-1px)}
.btn-dark{background:#3a342b;color:var(--tx)}.btn-dark:hover{background:#474034}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--tx2)}.btn-ghost:hover{border-color:rgba(255,255,255,.3);color:var(--tx)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.chip{appearance:none;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:11px 12px;color:var(--tx);transition:.15s;display:flex;gap:9px;align-items:flex-start}
.chip:hover{border-color:rgba(251,146,60,.5);background:var(--orange-soft)}
.chip.on{border-color:var(--orange);background:var(--orange-soft);box-shadow:inset 0 0 0 1px var(--orange)}
.chip-ico{color:var(--orange);flex:none;display:flex;margin-top:1px}.chip-ico svg{width:18px;height:18px}
.chip .chip-sub{display:block;font-size:11px;color:var(--tx3);margin-top:2px;font-weight:400;line-height:1.4}
.chip.on .chip-sub{color:rgba(255,255,255,.7)}
.chip-block{margin-bottom:14px}
.cb-label{font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.opt{font-size:10.5px;font-weight:500;color:var(--orange);border:1px solid rgba(251,146,60,.4);border-radius:999px;padding:1px 8px}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:13px;padding:26px 16px;text-align:center;color:var(--tx2);transition:.18s;cursor:pointer;background:rgba(255,255,255,.02)}
.drop:hover,.drop.drag{border-color:var(--orange);background:var(--orange-soft);color:var(--tx)}
.drop-ico{display:flex;justify-content:center;margin-bottom:9px;color:var(--orange)}.drop-ico svg{width:40px;height:40px;flex:none}
.drop h4{font-size:13.5px;font-weight:700;color:var(--tx);margin-bottom:4px}
.drop p{font-size:11.5px;color:var(--tx3)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:13px}
.shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:#000}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .q{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(20,18,15,.82);color:#fff;border:1px solid var(--line)}
.shot .q.ok{color:var(--ok);border-color:rgba(74,222,128,.4)}
.shot .q.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
.shot .q.bad{color:var(--bad);border-color:rgba(248,113,113,.4)}
.shot .del{position:absolute;right:4px;top:4px;width:21px;height:21px;border-radius:50%;border:0;background:rgba(20,18,15,.82);color:#fff;font-size:13px;line-height:1;opacity:0;transition:.15s}
.shot:hover .del{opacity:1}
.tip-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--tx2);margin-top:11px;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:10px;padding:9px 11px}
.tip-line svg{width:15px;height:15px;color:var(--ok);flex:none;margin-top:1px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;appearance:none;border:1px solid var(--line);background:#191714;color:var(--tx);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;transition:border .15s,box-shadow .15s}
.fld textarea{resize:vertical;line-height:1.6}
.fld input::placeholder,.fld textarea::placeholder{color:var(--tx3)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld select option{background:#1c1917;color:var(--tx)}
.car-tabs,.car-abc{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.car-tabs button,.car-abc button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx2);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;transition:.14s}
.car-abc button{min-width:30px;padding:5px 7px}
.car-tabs button.sel,.car-abc button.sel{background:var(--orange-d);border-color:var(--orange-d);color:#fff}
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:196px;overflow-y:auto;border:1px solid var(--line2);border-radius:10px;padding:8px;background:#191714}
.car-grid button{appearance:none;border:1px solid transparent;background:transparent;color:var(--tx2);border-radius:7px;padding:6px 4px;font-size:12px;transition:.13s}
.car-grid button:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.car-grid button.sel{background:var(--orange-soft);color:var(--orange);border-color:rgba(251,146,60,.4);font-weight:700}
.sell-chips{display:flex;flex-wrap:wrap;gap:7px}
.sell-chips button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px;transition:.14s}
.sell-chips button:hover{border-color:rgba(251,146,60,.5)}
.sell-chips button.on{background:var(--orange-soft);border-color:var(--orange);color:var(--orange);font-weight:600}
.compliance{display:flex;gap:8px;align-items:flex-start;font-size:11.8px;color:var(--tx3);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px;margin-top:13px}
.compliance svg{width:15px;height:15px;color:var(--orange);flex:none;margin-top:1px}
.prog-task{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line2);border-radius:11px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.prog-task .pt-ico{color:var(--tx2);display:flex}.prog-task .pt-ico svg{width:18px;height:18px;flex:none}
.prog-task.run .pt-ico{color:var(--orange)}.prog-task.done .pt-ico{color:var(--ok)}
.prog-task .pt-name{font-size:13px;font-weight:600}
.prog-task .pt-sub{font-size:11px;color:var(--tx3)}

/* + 菜单 */

.dl-sec{margin-bottom:18px}

/* lightbox / toast */

function newTaskId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
var taskCache=[];
function loadTasks(){return taskCache;}
function saveTasks(a){
 taskCache=a.slice(0,30);
 // 异步同步到后端（fire and forget）
 try{
  fetch(API+'/api/tasks/sync',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({tasks:taskCache})})
   .then(function(r){return r.json();}).then(function(j){if(!(j&&j.ok))console.warn('tasks sync fail',j);}).catch(function(){});
 }catch(e){}
}
function loadTasksRemote(){
 return fetch(API+'/api/tasks',{headers:authHeaders()})
  .then(function(r){return r.json();})
  .then(function(j){
   if(j&&j.ok&&Array.isArray(j.tasks)){taskCache=j.tasks;}
   renderTaskList();
  })
  .catch(function(){renderTaskList();});
}
function taskSkillIco(t){return t==='usedcar'?IC.car:IC.shop;}
function markTaskProgress(){
 if(!state.identity)return;
 var arr=loadTasks(),i=arr.findIndex(function(t){return t.id===state.taskId;});
 var fallback=state.identity.type==='usedcar'?'二手车出图任务':'商品出图任务';
 var rec={id:state.taskId,title:state.taskTitle||(state.product&&state.product.name)||fallback,pinned:state.taskPinned,ts:Date.now(),skill:state.identity.type,product:state.product||{},imgs:(state.images||[]).length,results:(state.results||[]).length,partner:state.activePartner,inputKeys:(state.images||[]).map(function(x){return x.tosKey;}).filter(Boolean),resultKeys:(state.results||[]).map(function(x){return x.tosKey;}).filter(Boolean)};
 if(i>=0)arr[i]=Object.assign(arr[i],rec);else arr.unshift(rec);
 arr.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.ts-a.ts;});
 saveTasks(arr);renderTaskList();
}
function archiveCurrentTask(){if(state.identity&&((state.product&&state.product.name)||(state.results&&state.results.length)||state.images.length))markTaskProgress();}
function renderTaskList(){
 var box=document.getElementById('taskList');if(!box)return;var arr=loadTasks();
 if(!arr.length){box.innerHTML='<div class="task-empty">还没有任务，传张图开始第一单。</div>';return;}
 box.innerHTML=arr.map(function(t){
  return '<div class="task-item'+(t.id===state.taskId?' active':'')+'" data-tid="'+t.id+'" title="'+esc(t.title)+'">'
   +'<span class="tk-ico">'+taskSkillIco(t.skill)+'</span>'
   +'<span class="tk-name">'+esc(t.title)+'</span>'
   +(t.pinned?'<span class="tk-pin">'+IC.pin+'</span>':'')
   +'<span class="tk-acts">'
   +'<button data-tact="pin" title="置顶/取消置顶">'+IC.pin+'</button>'
   +'<button data-tact="rename" title="重命名">'+IC.pen+'</button>'
   +'<button data-tact="del" class="danger" title="删除">'+IC.trash+'</button>'
   +'</span></div>';
 }).join('');
}
function taskAct(act,id,e){
 e.stopPropagation();
 var arr=loadTasks(),i=arr.findIndex(function(t){return t.id===id;});if(i<0)return;
 if(act==='pin'){arr[i].pinned=!arr[i].pinned;if(arr[i].id===state.taskId)state.taskPinned=arr[i].pinned;toast(arr[i].pinned?'已置顶':'已取消置顶');}
 else if(act==='rename'){var v=window.prompt('给任务改个名字',arr[i].title);if(v&&v.trim()){arr[i].title=v.trim();if(arr[i].id===state.taskId)state.taskTitle=v.trim();}}
 else if(act==='del'){if(!window.confirm('删除这个任务记录？交付物仍保留在云盘。'))return;arr.splice(i,1);saveTasks(arr);renderTaskList();renderTopbar();return;}
 arr.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.ts-a.ts;});
 saveTasks(arr);renderTaskList();renderTopbar();
}

 archiveCurrentTask();
 var hires=state.hires;
 state=resetState();state.hires=hires;
 state.taskId=t.id;state.taskTitle=t.title;state.taskPinned=!!t.pinned;
 state.identity=t.skill?{type:t.skill,label:t.skill==='usedcar'?'二手车':'通用电商',cat:t.skill==='usedcar'?'二手车':''}:null;
 if(state.identity){saveId();state.bgImage=loadBg(state.identity.type);}

 renderPartners();renderTopbar();renderDeliver();renderCmpAttach();renderTaskList();
 userSay('打开任务：'+t.title);

/* ================= 图片处理 ================= */
function fileToDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}
function loadImage(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});}
function prepareImage(file){
 return fileToDataURL(file).then(function(src){
  var p=window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return loadImage(src);}):loadImage(src);
  return p.then(function(img){
   var max=2048,w=img.width,h=img.height;
   if(Math.max(w,h)>max){var r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
   var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
   x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   try{img.close&&img.close();}catch(e){}
   return c.toDataURL('image/jpeg',.92);
  });
 });
}
function analyzeImage(dataUrl){
 return loadImage(dataUrl).then(function(img){
  var max=480,sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(8,Math.round(img.width*sc)),h=Math.max(8,Math.round(img.height*sc));
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  var d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h),bright=0;
  for(var i=0,j=0;i<d.length;i+=4,j++){var v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;bright+=v;}
  bright/=(w*h);var mean=0,n=0,lap=[];
  for(var y=1;y<h-1;y++)for(var xx=1;xx<w-1;xx++){var idx=y*w+xx,vv=4*g[idx]-g[idx-w]-g[idx+w]-g[idx-1]-g[idx+1];lap.push(vv);mean+=vv;n++;}
  mean/=n;var va=0;for(var k=0;k<lap.length;k++)va+=(lap[k]-mean)*(lap[k]-mean);va/=n;
  var sharp=va<55?'bad':(va<150?'warn':'ok');
  var exp=bright<48?'bad':(bright>212?'bad':(bright<72||bright>192?'warn':'ok'));
  var base={sharp:sharp,exp:exp};
  // 异步调后端 vision 细判（遮挡/完整度/构图），失败不影响主流程
  return callQcVision(dataUrl).then(function(v){
   if(v&&v.available){
    base.occlusion=v.checks.occlusion;
    base.completeness=v.checks.completeness;
    base.framing=v.checks.framing;
    base.level=v.level;
    base.tip=v.tip;
   }
   return base;
  }).catch(function(){return base;});
 });
}
function callQcVision(dataUrl){
 return fetch(API+'/qc',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({image:dataUrl})})
  .then(function(r){return r.json();})
  .then(function(j){return (j&&j.ok&&j.qc)?j.qc:null;});
}

/* ================= API ================= */
function authHeaders(){return (window.HogeeMember&&HogeeMember.authHeaders)?HogeeMember.authHeaders():{};}
function callGenerate(prompt,imagePayload,size){
 var ctrl=new AbortController();var timer=setTimeout(function(){ctrl.abort();},110000);
 return fetch(API+'/generate',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),signal:ctrl.signal,
  body:JSON.stringify({prompt:prompt,image:imagePayload,size:size||'2048x2048'})})
 .then(function(resp){clearTimeout(timer);return resp.json().catch(function(){return null;}).then(function(j){
  if(resp.ok&&j&&j.ok&&j.b64)return 'data:image/jpeg;base64,'+j.b64;
  var code=j&&j.error&&j.error.code,msg=j&&j.error&&j.error.message;
  if(resp.status===401||(code&&code.indexOf('member')===0)){
   if(code!=='member_suspended'&&window.HogeeMember&&HogeeMember.logout)HogeeMember.logout();
   var e=new Error(code==='member_suspended'?(msg||'账号已停用，请联系客服'):'登录已失效，请重新登录后再生成');e.code=code||'member_unauthorized';throw e;
  }
  if(code==='rate_limited'){var re=new Error(msg||'生成过于频繁，请稍后再试');re.code='rate_limited';throw re;}
  throw new Error(msg||('图像服务返回 '+resp.status));
 });}).catch(function(e){clearTimeout(timer);throw e;});
}
function callGenerateRetry(prompt,imagePayload,size,onTick){
 function attempt(n){return callGenerate(prompt,imagePayload,size).catch(function(e){
  if(e&&typeof e.code==='string'&&e.code.indexOf('member')===0)throw e;
  if(e&&e.code==='rate_limited')return sleep(2600).then(function(){return attempt(n);});
  if(n>=2)throw e;return sleep(1300).then(function(){onTick&&onTick();return attempt(n+1);});
 });}
 return attempt(1);
}
function authPost(path,body){
 return fetch(API+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)})
  .then(function(r){return r.json();}).catch(function(){return {ok:false,error:{message:'网络异常，请稍后再试'}};});
}

/* ================= TOS 跨端云盘（登录用户原图/成品直传；任何失败静默降级本地，绝不阻断出图） ================= */
function _tosLoggedIn(){return !!(window.HogeeMember&&HogeeMember.isLoggedIn&&HogeeMember.isLoggedIn());}
function _dataUrlToBlob(d){
 try{
  var parts=String(d).split(','),mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  var bin=atob(parts[1]||''),len=bin.length,ua=new Uint8Array(len);
  for(var i=0;i<len;i++)ua[i]=bin.charCodeAt(i);
  return new Blob([ua],{type:mime});
 }catch(e){return null;}
}
function _tosExt(d){var m=String(d).match(/data:image\/([a-zA-Z0-9]+)/);m=m?m[1].toLowerCase():'jpeg';if(m==='jpeg')return 'jpg';return (['png','webp','gif'].indexOf(m)>=0?m:'jpg');}
function tosPutObject(dataUrl,kind){
 if(!dataUrl||typeof dataUrl!=='string'||dataUrl.indexOf('data:image')!==0)return Promise.resolve(null);
 if(!_tosLoggedIn())return Promise.resolve(null);
 var ext=_tosExt(dataUrl);
 return authPost('/api/storage',{action:'put',ext:ext,kind:kind||'result'}).then(function(j){
  if(!j||!j.ok||!j.putUrl)return null;
  var blob=_dataUrlToBlob(dataUrl);if(!blob)return null;
  return fetch(j.putUrl,{method:'PUT',headers:{'Content-Type':(j.headers&&j.headers['Content-Type'])||blob.type||('image/'+ext)},body:blob})
   .then(function(r){return r.ok?{key:j.key,getUrl:j.getUrl}:null;}).catch(function(){return null;});
 }).catch(function(){return null;});
}
function tosGetUrl(key){
 if(!key||!_tosLoggedIn())return Promise.resolve(null);
 return authPost('/api/storage',{action:'get',key:key}).then(function(j){return (j&&j.ok&&j.getUrl)?j.getUrl:null;}).catch(function(){return null;});
}
function tosSyncImage(imgItem,kind){
 if(!imgItem||imgItem.tosKey||imgItem._tosBusy||!imgItem.dataUrl)return;
 imgItem._tosBusy=true;
 tosPutObject(imgItem.dataUrl,kind).then(function(o){
  imgItem._tosBusy=false;
  if(o){imgItem.tosKey=o.key;imgItem.tosUrl=o.getUrl;try{if(state.identity)markTaskProgress();}catch(e){}}
 });
}
function tosSyncResult(resItem){
 if(!resItem||resItem.tosKey||resItem._tosBusy||!resItem.url)return;
 resItem._tosBusy=true;
 tosPutObject(resItem.url,'result').then(function(o){
  resItem._tosBusy=false;
  if(o){resItem.tosKey=o.key;resItem.tosUrl=o.getUrl;try{markTaskProgress();}catch(e){}}
 });
}

function addWatermark(dataUrl){
 return new Promise(function(resolve){
  if(!dataUrl||typeof dataUrl!=='string'){resolve(dataUrl);return;}
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
   try{
    var c=document.createElement('canvas');
    c.width=img.width;c.height=img.height;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0);
    var pad=Math.round(img.width*0.012);
    var fs=Math.round(img.width*0.026);
    var bw=fs*9,bh=fs+pad*2;
    var bx=img.width-bw-pad*1.5;
    var by=img.height-bh-pad*1.5;
    ctx.fillStyle='rgba(0,0,0,0.55)';
    var r=fs*0.28;
    ctx.beginPath();
    ctx.moveTo(bx+r,by);
    ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,r);
    ctx.arcTo(bx,by+bh,bx,by,r);
    ctx.arcTo(bx,by,bx+bw,by,r);
    ctx.closePath();ctx.fill();
    ctx.font='600 '+fs+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText('WorkHogee 出图',bx+pad*1.4,by+bh/2);
    resolve(c.toDataURL('image/jpeg',0.92));
   }catch(e){resolve(dataUrl);}
  };
  img.onerror=function(){resolve(dataUrl);};
  img.src=dataUrl;
 });
}

function callIdentify(dataUrl){

   if(f.brand&&CAR_DB.length){

/* ================= 让图动起来（前端 canvas + gifenc，零 AI 成本） ================= */
var DYN_EDGE=440;
function dynTick(){return new Promise(function(r){setTimeout(r,0);});}
function dynRatio(){var s=SIZES.filter(function(x){return state.sizes.has(x.k);})[0]||SIZES[0];return s.w/s.h;}
function dynSize(ratio,edge){return ratio>=1?{w:edge,h:Math.max(8,Math.round(edge/ratio))}:{h:edge,w:Math.max(8,Math.round(edge*ratio))};}
function dynPaint(x,img,w,h,scale,px,py){x.fillStyle='#fff';x.fillRect(0,0,w,h);var ir=img.width/img.height,tr=w/h,bw,bh;if(ir>tr){bh=h;bw=h*ir;}else{bw=w;bh=w/ir;}bw*=scale;bh*=scale;var ox=(bw-w)/2,oy=(bh-h)/2;x.drawImage(img,(w-bw)/2+px*ox,(h-bh)/2+py*oy,bw,bh);}
function dynFrame(img,w,h,scale,px,py,delay,newPal){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');dynPaint(x,img,w,h,scale,px,py);return {data:x.getImageData(0,0,w,h).data,delay:delay,newPalette:!!newPal};}
function dynEase(t){return t*t*(3-2*t);}
async function dynBuildGif(frames,w,h,onProg){var gif=HGif.GIFEncoder(),palette=null;for(var i=0;i<frames.length;i++){if(frames[i].newPalette||!palette){palette=HGif.quantize(frames[i].data,256,{format:'rgb444'});}var idx=HGif.applyPalette(frames[i].data,palette,'rgb444');gif.writeFrame(idx,w,h,{palette:palette,delay:frames[i].delay,dispose:2});if(onProg)onProg(i+1,frames.length);await dynTick();}gif.finish();var b=gif.bytes();return new Blob([b],{type:'image/gif'});}
async function dynKen(img,ratio,setP){var z=dynSize(ratio,DYN_EDGE),N=22,fr=[];for(var i=0;i<N;i++){var ph=i/(N-1),k=ph<.5?ph*2:(1-ph)*2,e=dynEase(k);fr.push(dynFrame(img,z.w,z.h,1+0.10*e,-0.7+1.4*e,-0.5+1.0*e,70,i===0));if(i%4===0)setP(i+1,N);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:N};}
async function dynShow(imgs,ratio,setP){var z=dynSize(ratio,DYN_EDGE),fr=[],per=7,n=0;for(var g=0;g<imgs.length;g++){for(var f=0;f<per;f++){var e=f/(per-1);fr.push(dynFrame(imgs[g],z.w,z.h,1+0.06*e,0,0,110,f===0));n++;setP(n,imgs.length*per);}}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:n};}
async function dynSpin(imgs,setP){var z=dynSize(1,DYN_EDGE),fr=[];for(var g=0;g<imgs.length;g++){for(var f=0;f<2;f++){fr.push(dynFrame(imgs[g],z.w,z.h,1.08,0,0,95,f===0));}setP(g+1,imgs.length);}var blob=await dynBuildGif(fr,z.w,z.h,setP);return {blob:blob,w:z.w,h:z.h,frames:fr.length};}
function dynGrid9(img){var S=1200,c=document.createElement('canvas');c.width=S;c.height=S;var x=c.getContext('2d');dynPaint(x,img,S,S,1.06,0,0);var cell=S/3,out=[];for(var r=0;r<3;r++)for(var cc=0;cc<3;cc++){var t=document.createElement('canvas');t.width=cell;t.height=cell;var tx=t.getContext('2d');tx.drawImage(c,cc*cell,r*cell,cell,cell,0,0,cell,cell);out.push(t.toDataURL('image/jpeg',.92));}return out;}
function dynKb(n){return n>1048576?(n/1048576).toFixed(1)+'MB':Math.round(n/1024)+'KB';}
function renderDyn(){var box=$('#dynOut');if(!box)return;box.innerHTML='';state.dyn.forEach(function(d,i){var w=document.createElement('div');w.innerHTML='<div class="dyn-item"><div class="di-view"><img src="'+d.url+'" alt=""></div><div class="di-meta"><div class="di-name">'+d.name.replace(/\.gif$/,'')+'</div>'+d.w+'×'+d.h+(d.frames?' · '+d.frames+' 帧':' · 9 张')+' · '+dynKb(d.bytes)+'</div><div class="di-btns"><button class="di-btn" data-act="dlDyn" data-i="'+i+'">'+IC.download+' 下载</button></div></div>';box.appendChild(w.firstChild);});
 if(state.dynGrid){var g=state.dynGrid,w=document.createElement('div');w.innerHTML='<div class="dyn-item"><div class="di-nine">'+g.items.map(function(u){return '<img src="'+u+'" alt="">';}).join('')+'</div><div class="di-meta"><div class="di-name">九宫格切图</div>每张 400×400 · 9 张 JPG</div><div class="di-btns"><button class="di-btn" data-act="dlGrid">'+IC.pack+' 打包下载</button></div></div>';box.appendChild(w.firstChild);}
}

function drawCoverKB(x,img,W,H,s,ox,oy,alpha){
 x.save();x.globalAlpha=alpha;
 var ir=img.width/img.height,tr=W/H,bw,bh;
 if(ir>tr){bh=H;bw=H*ir;}else{bw=W;bh=W/ir;}
 bw*=s;bh*=s;
 var ex=Math.max(1,(bw-W)/2),ey=Math.max(1,(bh-H)/2);
 x.drawImage(img,(W-bw)/2+ox*ex,(H-bh)/2+oy*ey,bw,bh);
 x.restore();
}
function kbFor(p,motion){
 var e=p*p*(3-2*p);
 if(motion==='push-in')return {s:1.06+0.10*e,ox:0,oy:0};
 if(motion==='zoom-out')return {s:1.16-0.10*e,ox:0,oy:0};
 if(motion==='pan-right')return {s:1.15,ox:-0.55+1.1*e,oy:0};
 if(motion==='pan-left')return {s:1.15,ox:0.55-1.1*e,oy:0};
 if(motion==='rise')return {s:1.13,ox:0,oy:0.5-1.0*e};
 return {s:1.05+0.10*e,ox:-0.3+0.6*e,oy:-0.25+0.5*e};
}

function composeVideo(sb,imgs,onProg){
 var dim=VIDEO_RATIOS[sb.ratio]||VIDEO_RATIOS['9:16'],W=dim.w,H=dim.h;
 var canvas=document.getElementById('vidCanvasEl');
 if(!canvas)return Promise.reject(new Error('视频画布未就绪'));
 canvas.width=W;canvas.height=H;var x=canvas.getContext('2d');
 var shots=sb.shots||[],INTRO=1.3,OUTRO=1.8,TRANS=0.28;
 var shotsDur=shots.reduce(function(a,s){return a+(+s.duration||3);},0);
 var total=INTRO+shotsDur+OUTRO;
 var mime=pickVideoMime();
 if(!mime)return Promise.reject(new Error('当前浏览器不支持本地视频录制，请用最新版 Chrome / Edge / Safari'));
 function frame(t){
  x.fillStyle='#0c0b09';x.fillRect(0,0,W,H);
  if(t<INTRO){drawIntro(x,W,H,t/INTRO,sb.title);return;}
  if(t>=INTRO+shotsDur){drawOutro(x,W,H,(t-INTRO-shotsDur)/OUTRO);return;}
  var lt=t-INTRO,cum=0,shot=shots[shots.length-1],idx=shots.length-1,local=0,dur=3;
  for(var i=0;i<shots.length;i++){var d=+shots[i].duration||3;cum+=d;if(lt<cum){shot=shots[i];idx=i;local=lt-(cum-d);dur=d;break;}}
  var p=Math.max(0,Math.min(1,local/dur));
  var kb=kbFor(p,shot.motion);
  var fade=Math.min(1,local/TRANS);
  if(idx===shots.length-1&&local>dur-0.32)fade*=Math.max(0,(dur-local)/0.32);
  var img=imgs[idx%imgs.length];
  if(img)drawCoverKB(x,img,W,H,kb.s,kb.ox,kb.oy,Math.max(0,Math.min(1,fade)));
  if(shot.caption&&local>0.34&&local<dur-0.16)drawCaption(x,W,H,shot.caption,Math.min(1,(local-0.34)/0.3));
  drawCorner(x,W,H);
 }
 var stream=canvas.captureStream(30);
 var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
 var chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
 return new Promise(function(res,rej){
  rec.onerror=function(){rej(new Error('录制失败'));};
  rec.onstop=function(){res({blob:new Blob(chunks,{type:mime.split(';')[0]}),w:W,h:H,dur:total});};
  var start=null,raf=0,stopped=false;
  function loop(ts){
   if(!start)start=ts;var t=(ts-start)/1000;
   if(t>=total){frame(total);onProg&&onProg(1);if(!stopped){stopped=true;setTimeout(function(){try{rec.stop();}catch(e){}},150);}return;}
   frame(t);onProg&&onProg(Math.min(0.999,t/total));raf=requestAnimationFrame(loop);
  }
  rec.onstart=function(){raf=requestAnimationFrame(loop);};
  setTimeout(function(){try{rec.start(200);}catch(e){rej(e);}},60);
 });
}

function exportRatio(url,w,h,mode,fmt){
 return loadImage(url).then(function(img){
  var base=state.quality==='hd'?2048:1600,cw,ch;
  if(w>=h){cw=base;ch=Math.round(base*h/w);}else{ch=base;cw=Math.round(base*w/h);}
  var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
  var ir=img.width/img.height,tr=cw/ch;
  if(mode==='cover'){var sw,sh,sx,sy;if(ir>tr){sh=img.height;sw=img.height*tr;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=img.width/tr;sx=0;sy=(img.height-sh)/2;}x.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);}
  else{var dw,dh;if(ir>tr){dw=cw;dh=cw/ir;}else{dh=ch;dw=ch*ir;}x.drawImage(img,(cw-dw)/2,(ch-dh)/2,dw,dh);}
  return fmt==='png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',state.quality==='hd'?.96:.9);
 });
}
function modeFor(k){return k==='white'?'contain':'cover';}

async function packAll(){
 if(window.HogeeMember){try{await HogeeMember.requireAuth();}catch(e){return;}}

 toast('正在按尺寸导出…');
 var JSZip=window.JSZip;
 if(!JSZip){try{await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');JSZip=window.JSZip;}catch(e){JSZip=null;}}
 var sizeList=SIZES.filter(function(s){return state.sizes.has(s.k);});
 var stamp=new Date().toISOString().slice(0,10);
 var copyText=state.copy.cps?state.copy.cps.general:buildCopies().general;
 if(JSZip){
  var zip=new JSZip();
  for(var i=0;i<state.results.length;i++){var r=state.results[i];for(var j=0;j<sizeList.length;j++){var s=sizeList[j];var du=await exportRatio(r.url,s.w,s.h,modeFor(r.k),state.fmt);zip.file(safeName(r.label)+'_'+s.k+'.'+state.fmt,du.split(',')[1],{base64:true});}}

function syncQuality(){var b=$('#btnQuality');b.textContent=state.quality==='hd'?'高清':'标清';b.classList.toggle('on',state.quality==='hd');}
function handleAct(b){
 var act=b.dataset.act;
 if(act==='chooseFile'){if(!state.identity){startOrder('general');}else{$('#fileInput').click();}}
 else if(act==='chooseBg'){$('#bgInput').click();}
 else if(act==='delShot'||act==='delAttach'){state.images.splice(+b.dataset.i,1);refreshShots();}
 else if(act==='toConfirm'){if(!state.images.length){toast('先传至少一张图','err');return;}var st=botTyping('atu');setTimeout(function(){st();renderConfirmCard();},420);}
 else if(act==='backUpload'){renderUploadCard();state.stage='upload';refreshShots();}
 else if(act==='fillBrand'){pickCarBrand(b.dataset.b);}
 else if(act==='carCat'){carFilter.cat=b.dataset.c;carFilter.letter='';renderCarPicker();}
 else if(act==='carAbc'){carFilter.letter=b.dataset.l;renderCarPicker();}
 else if(act==='fillSell'){var ex=document.getElementById('extraInstr'),v=b.dataset.v,arr=ex?ex.value.split(/[、,，\n]/).map(function(x){return x.trim();}).filter(Boolean):[];if(b.classList.contains('on')){b.classList.remove('on');arr=arr.filter(function(x){return x!==v;});}else{if(arr.indexOf(v)<0)arr.push(v);b.classList.add('on');}if(ex)ex.value=arr.join('、');}
 else if(act==='confirmProduct'){
  var used=state.identity.type==='usedcar';
  if(used){
   var brand=$('#carBrand').value.trim(),series=$('#carSeries').value.trim();
   var year=$('#carYear').value.trim(),trim=$('#carTrim').value.trim();
   var color=$('#carColor')?$('#carColor').value.trim():'';
   var energy=$('#carEnergy')?$('#carEnergy').value:'燃油';
   var gear=$('#carGear')?$('#carGear').value:'';
   state.product={brand:brand,series:series,year:year,trim:trim,color:color,energy:energy,gear:gear,name:[year,brand,series].filter(Boolean).join(' ')};
  }else{
   var nm=$('#productName').value.trim();
   state.product.name=nm;
  }
  state.extra=$('#extraInstr')?$('#extraInstr').value.trim():'';
  state.taskTitle=state.taskTitle||state.product.name||(used?'这台车':'这款商品');
  markTaskProgress();renderTopbar();
  botSay('认下了：<b>'+esc(state.product.name||'这单货')+'</b>。下面挑这单要出哪些图。','atu');
  renderOutputsCard();
 }
 else if(act==='skipIdentify'){
  // 快速路径：不填任何信息，直接进产出选择
  var used2=state.identity.type==='usedcar';
  var f=identifyFields||{};
  state.product={brand:f.brand||'',series:f.series||'',year:f.year||'',trim:'',color:f.color||'',energy:f.energy||'燃油',gear:'',name:used2?[f.year,f.brand,f.series].filter(Boolean).join(' '):(f.name||'')};
  state.extra='';
  state.taskTitle=state.taskTitle||state.product.name||(used2?'这台车':'这款商品');
  markTaskProgress();renderTopbar();
  botSay('好，直接出图。下面挑这单要出哪些图。','atu');
  renderOutputsCard();
 }
 else if(act==='showEditIdentify'){
  renderConfirmEdit();
 }
 else if(act==='toggleOutput'){var k=b.dataset.k;if(state.outputs.has(k)){if(state.outputs.size===1){toast('至少保留一种图');return;}state.outputs.delete(k);b.classList.remove('on');}else{state.outputs.add(k);b.classList.add('on');}}
 else if(act==='toScene'){var isUsed=state.identity.type==='usedcar';
  if(isUsed&&state.outputs.has('onsite')&&!state.bgImage)renderBgCard();
  else if(isUsed&&state.outputs.has('onsite')&&state.bgImage){toast('用你上次传的实地展厅背景');renderSpecCard();}
  else if(!isUsed&&state.outputs.has('scene'))renderSceneCard();
  else renderSpecCard();}
 else if(act==='pickScene'){state.scene=b.dataset.k;$$('[data-act="pickScene"]').forEach(function(c){c.classList.remove('on');});b.classList.add('on');}
 else if(act==='cancelOnsite'){state.outputs.delete('onsite');toast('已去掉实地展厅版');renderSpecCard();}
 else if(act==='toSpec'){if(state.stage==='bg'&&!state.bgImage){toast('先传一张展厅背景，或取消实地版','err');return;}renderSpecCard();}
 else if(act==='toggleSize'){var sk=b.dataset.k;if(state.sizes.has(sk)){if(state.sizes.size===1){toast('至少保留一个尺寸');return;}state.sizes.delete(sk);b.classList.remove('on');}else{state.sizes.add(sk);b.classList.add('on');}}
 else if(act==='pickFmt'){state.fmt=b.dataset.v;$$('[data-act="pickFmt"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.fmt);});}
 else if(act==='pickQuality'){state.quality=b.dataset.v;$$('[data-act="pickQuality"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.quality);});syncQuality();}
 else if(act==='startGen'){var outs=OUTPUTS[state.identity.type==='usedcar'?'usedcar':'general'],summary=[];state.outputs.forEach(function(kk){var o=outs.filter(function(x){return x.k===kk;})[0];summary.push(o?o.t:kk);});
  userSay('开始出图：'+summary.join('、')+'，尺寸 '+Array.from(state.sizes).join('/'));var stt=botTyping('atu');setTimeout(function(){stt();runGenerate();},420);}
 else if(act==='dlvPreview'){openLightbox(state.results[+b.dataset.i].url);}
 else if(act==='dlvDownload'){downloadOne(+b.dataset.i);}
 else if(act==='dlvRedo'){redoOne(+b.dataset.i);}
 else if(act==='openDeliver'){setDeliverTab('all');openDeliver();}
 else if(act==='pack'){packAll();}
 else if(act==='copyText'){var t0=$('#copyText');if(t0){t0.select();copyPlain(t0.value).then(function(){toast('文案已复制');});}}
 else if(act==='copyChan'){state.copy.channel=b.dataset.v;var cps0=state.copy.cps||buildCopies();state.copy.draft='';state.copy._lastCh=state.copy.channel;renderDeliver();}
 else if(act==='copyRedo'){var toneMap={'casual':'再口语化一点，像真人说话，不要广告腔','short':'再短一点，朋友圈就3行，别啰嗦','real':'别这么像广告，像个人闲置转让，有点小缺点也没事'};redoCopy(toneMap[b.dataset.t]||b.dataset.t);}
 else if(act==='copyClean'){var tac=$('#copyText');if(tac){var rr=cleanBanned(tac.value);tac.value=rr.text;state.copy.draft=tac.value;refreshCopyScan();toast(rr.removed.length?('已净化 '+rr.removed.length+' 处绝对化词，请通读'):'未发现需净化词');}}
 else if(act==='reach'){reachPlatform(b.dataset.p);}
 else if(act==='dynKen'){dynMake('ken',b);}else if(act==='dynShow'){dynMake('show',b);}else if(act==='dynSpin'){dynMake('spin',b);}else if(act==='dynGrid'){dynMake('grid',b);}
 else if(act==='dlDyn'){var dd=state.dyn[+b.dataset.i];if(dd){downloadDataUrl(dd.url,dd.name);toast('已下载 '+dd.name);}}
 else if(act==='dlGrid'){dlGridZip();}
 else if(act==='videoTpl'){state.videoCfg.tpl=b.dataset.v;$$('[data-act="videoTpl"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.videoCfg.tpl);});}
 else if(act==='videoRatio'){state.videoCfg.ratio=b.dataset.v;$$('[data-act="videoRatio"]').forEach(function(c){c.classList.toggle('on',c.dataset.v===state.videoCfg.ratio);});}
 else if(act==='videoMake'){videoMake(b);}
 else if(act==='videoDl'){var vv=state.videos[+b.dataset.i];if(vv){downloadDataUrl(vv.url,vv.name);toast('已下载 '+vv.name);}}
 else if(act==='videoAiSoon'){toast('AI 图生视频内测中，即将开放；现在先用图文成片把多张成品剪成短视频');}
 else if(act==='newOrder'){newOrder();}
 else if(act==='moreScene'){state.results=[];state.dyn=[];state.dynGrid=null;renderDeliver();renderOutputsCard();}
 else if(act==='publishShowcase'){renderPublishCard();}
 else if(act==='backPublish'){var pc=$('#publishCard');if(pc){pc.closest('.msg').remove();}}
 else if(act==='doPublish'){doPublish();}
 else if(act==='dlQr'){downloadQr();}
 else if(act==='copyShowLink'){copyShowLink();}
 else if(act==='addChannelDo'){addChannel();}
 else if(act==='openAnalytics'){window.open('/analytics.html','_blank','noopener');}
 /* 实验室：技能 / 插件 / 伙伴 */
 else if(act==='skillUse'){var id=b.dataset.id;if(state.identity&&state.identity.type===id){toast('已在使用该技能');return;}closeLab();startOrder(id);}
 else if(act==='skillNotify'){var sid=b.dataset.id;var n=notifyState();if(n.indexOf(sid)<0){n.push(sid);try{localStorage.setItem('hogee_skill_notify',JSON.stringify(n));}catch(e){}}b.disabled=true;b.textContent='已提醒';renderLab();toast('已记下，该技能上线第一时间通知你');}
 else if(act==='pluginKit'){closeLab();setDeliverTab('reach');openDeliver();toast('该渠道无需连接账号：出图后在「送达」复制文案、保存素材，本人打开发布页即可发');}
 else if(act==='pluginApply'){var pid=b.dataset.id,ps=pluginsState();ps[pid]='applied';savePlugins(ps);renderLab();toast('已登记。官方 API 需企业资质（营业执照/认证），开放内测第一时间通知你；现在可用素材就绪包本人发');}
 else if(act==='pluginSoon'){toast('该渠道陆续接入，已记下你的关注');}
 else if(act==='hire'||act==='hireLab'){var hid=b.dataset.id;if(hid==='atu')return;if(state.hires.has(hid)){state.hires.delete(hid);if(state.activePartner===hid)state.activePartner='atu';}else state.hires.add(hid);renderPartners();if($('#labModal').classList.contains('show'))renderLab();}
 else if(act==='speak'){setActivePartner(b.dataset.id);$('#partnerPop').classList.remove('show');if($('#labModal').classList.contains('show'))renderLab();}
}

    var u=user();
    menu.innerHTML='<div class="wb-mhead"><span class="wb-ava">'+esc(initialOf(u))+'</span>'
      +'<span class="meta"><div class="t1">'+esc(dispName(u))+'<\/div><div class="t2">'+esc((u&&(u.account||u.phone||u.email||u.username))||'已登录')+'<\/div></span>'
      +'<span class="wb-plan">'+esc(planLabel(u))+'</span></div>'
      +'<button class="wb-mi" data-am="profile">'+svgIc('settings')+'账号资料</button>'
      +'<button class="wb-mi" data-am="quota">'+svgIc('gauge')+'额度状态</button>'
      +'<div class="wb-sep"></div>'
      +'<button class="wb-mi" data-am="cloud">'+svgIc('cloud')+'我的云盘</button>'
      +'<button class="wb-mi" data-am="site">'+svgIc('external')+'WorkHogee 官网</button>'
      +'<button class="wb-mi" data-am="help">'+svgIc('help')+'帮助与反馈</button>'
      +'<button class="wb-mi" data-am="update">'+svgIc('rotate')+'检查更新</button>'
      +'<div class="wb-sep"></div>'
      +'<button class="wb-mi" data-am="switch">'+svgIc('switchacc')+'切换账号</button>'
      +'<button class="wb-mi danger" data-am="logout">'+svgIc('logout')+'退出登录</button>';
  }
  function openMenu(){buildMenu();menu.classList.add('open');}
  function closeMenu(){menu.classList.remove('open');}
  menu.addEventListener('click',function(e){var b=e.target.closest('[data-am]');if(b)onMenu(b.getAttribute('data-am'));});
  document.addEventListener('mousedown',function(e){if(menu.classList.contains('open')&&!menu.contains(e.target)&&!(e.target.closest&&e.target.closest('#wbAccount')))closeMenu();});

  function openModal(html){mask.innerHTML=html;mask.classList.add('open');}
  function closeModal(){mask.classList.remove('open');mask.innerHTML='';}
  function modalShell(title,body,foot){
    return '<div class="wb-modal" role="dialog" aria-modal="true"><div class="wb-mh"><b>'+title+'</b>'
      +'<button class="wb-x" data-am="close" aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'
      +'<div class="wb-mb">'+body+'</div>'+(foot?'<div class="wb-mf">'+foot+'</div>':'')+'</div>';
  }
  mask.addEventListener('click',function(e){var b=e.target.closest('[data-am="close"]');if(b)closeModal();});

  function showProfile(){
    var u=user()||{},p=getProfile();
    var industries=['通用电商','二手车','服装服饰','家居家装','餐饮美食','美妆个护','数码家电','本地生活','其他'];
    var opts=industries.map(function(it){return '<option '+(p.industry===it?'selected':'')+'>'+it+'</option>';}).join('');
    var body='<div class="wb-field"><label>登录账号（不可修改）</label><input class="wb-ro" readonly value="'+esc(u.account||u.phone||u.email||u.username||'—')+'"></div>'
      +'<div class="wb-field"><label>联系人称呼</label><input id="pfContact" maxlength="20" value="'+esc(p.contactName||u.contactName||'')+'" placeholder="怎么称呼你"></div>'
      +'<div class="wb-field"><label>店铺 / 公司名</label><input id="pfMerchant" maxlength="30" value="'+esc(p.merchantName||u.merchantName||'')+'" placeholder="你的店铺或公司名称"></div>'
      +'<div class="wb-field"><label>主营行业</label><select id="pfIndustry">'+opts+'</select></div>'
      +'<div class="wb-note">内测阶段资料仅保存在本机，用于让伙计更懂你的生意；正式版将同步到账号云端。</div>';
    var foot='<button class="wb-mbtn" data-am="close">取消</button><button class="wb-mbtn p" id="pfSave">保存</button>';
    openModal(modalShell('账号资料',body,foot));
    q('#pfSave',mask).addEventListener('click',function(){
      var prof={contactName:q('#pfContact',mask).value.trim(),merchantName:q('#pfMerchant',mask).value.trim(),industry:q('#pfIndustry',mask).value};
      try{localStorage.setItem('hogee_profile',JSON.stringify(prof));}catch(e){}
      closeModal();renderAccount();if(window.toast)toast('资料已保存在本机');
    });
  }
  function showQuota(){
    var u=user()||{};
    var body='<div class="wb-qrow"><span>当前套餐</span><b>'+esc(planLabel(u))+'</b></div>'
      +'<div class="wb-qrow"><span>账号状态</span><b>'+esc(statusLabel(u))+'</b></div>'
      +'<div class="wb-qrow"><span>出图额度</span><b>内测阶段 · 不限量</b></div>'
      +'<div class="wb-qrow"><span>本机累计生成</span><b class="big">'+genCount()+' 张</b></div>'
      +'<div class="wb-note">内测期间注册登录即可使用，不限出图数量。正式版将上线套餐与按量计费，额度与用量以账号云端统计为准；切换设备后本机计数不互通。</div>';
    openModal(modalShell('额度状态',body,'<button class="wb-mbtn p" data-am="close">知道了</button>'));
  }
  function onMenu(k){
    closeMenu();
    if(k==='profile'){showProfile();}
    else if(k==='quota'){showQuota();}
    else if(k==='cloud'){if(window.setDeliverTab)setDeliverTab('all');if(window.openDeliver)openDeliver();if(window.toast)toast('交付物都归档在云盘：图片 / 动态 / 图文 / 送达');}
    else if(k==='site'){window.open('https://www.workhogee.com/','_blank','noopener');}
    else if(k==='help'){window.open('mailto:910036590@qq.com?subject=WorkHogee%20%E5%B8%AE%E5%8A%A9%E4%B8%8E%E5%8F%8D%E9%A6%88','_blank');if(window.toast)toast('已为你打开邮件反馈');}
    else if(k==='update'){if(window.toast)toast('当前已是最新版本，网页版会自动更新');}
    else if(k==='switch'){if(M){M.logout();setTimeout(function(){M.open('login');},260);}}
    else if(k==='logout'){if(M){M.logout();if(window.toast)toast('已退出登录');}}
  }

  function renderAccount(){
    if(!M){acct.innerHTML='';return;}
    if(!M.isLoggedIn()){
      acct.innerHTML='<button class="wb-btn wb-btn-p" id="wbReg">'+(IC?IC.user:'')+'Hogee会员注册</button>'
        +'<button class="wb-btn wb-btn-g" id="wbLogin">登录</button>';
      var r=q('#wbReg',acct),l=q('#wbLogin',acct);
      if(r)r.addEventListener('click',function(){M.open('register');});
      if(l)l.addEventListener('click',function(){M.open('login');});
      closeMenu();return;
    }
    var u=user();
    acct.innerHTML='<button class="wb-ab" id="wbAb" aria-haspopup="true"><span class="wb-ava">'+esc(initialOf(u))+'</span>'
      +'<span class="nm">'+esc(dispName(u))+'</span><span class="cv">'+(IC?IC.chevron:'')+'</span></button>';
    q('#wbAb',acct).addEventListener('click',function(e){e.stopPropagation();if(menu.classList.contains('open'))closeMenu();else openMenu();});
  }
  window.HG_renderAccount=renderAccount;
  renderAccount();
  if(M&&M.verify){try{M.verify().then(renderAccount,renderAccount);}catch(e){}}
  document.addEventListener('hogee:auth',renderAccount);
  document.addEventListener('hogee:logout',renderAccount);
})();
})();



</script>
</body>
</html>
